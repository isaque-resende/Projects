<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mockup · Estilo Tunic</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Alegreya+Sans:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2b8fe8; font-family: 'Alegreya Sans', system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { display: block; width: 100%; height: 100%; }
    [hidden] { display: none !important; }
    #fade { position: fixed; inset: 0; background: #0d1a2e; opacity: 1; pointer-events: none; transition: opacity .35s; z-index: 5; }
    #title { position: fixed; left: 50%; top: max(18px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 4; text-align: center; pointer-events: none; opacity: 0; transition: opacity .8s; color: #fff8e6; text-shadow: 0 2px 0 #1b3a6b, 0 0 14px #0006; }
    #title.on { opacity: 1; }
    #title b { display: block; font: 700 clamp(16px, 4vw, 24px) 'Cinzel', serif; letter-spacing: .14em; }
    #title small { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; opacity: .85; }
    .mark { position: fixed; left: -999px; top: -999px; opacity: 0; z-index: 3; transform: translate(-50%, -100%); pointer-events: none; display: flex; flex-direction: column; align-items: center; transition: opacity .2s; }
    .mark i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #fff8e6; color: #b5482a; font: 700 18px 'Cinzel', serif; font-style: normal; box-shadow: 0 3px 0 #b5482a, 0 0 0 3px #b5482a inset; animation: bob 1.4s ease-in-out infinite; }
    .mark span { margin-top: 6px; font: 700 12px 'Alegreya Sans', sans-serif; color: #fff8e6; background: #1b3a6bcc; border-radius: 10px; padding: 2px 8px; white-space: nowrap; }
    .mark.exit i { background: #ffe58a; color: #1b3a6b; box-shadow: 0 3px 0 #1b3a6b, 0 0 0 3px #1b3a6b inset; }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    #talk { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(620px, calc(100vw - 32px)); box-sizing: border-box; z-index: 6; background: #fff8e6; color: #3a2414; border-radius: 14px; padding: 14px 18px 16px; box-shadow: 0 5px 0 #b5482a, 0 0 0 3px #b5482a inset, 0 14px 30px #0005; cursor: pointer; }
    #talk b { position: absolute; top: -14px; left: 16px; background: #b5482a; color: #fff8e6; font: 700 13px 'Cinzel', serif; letter-spacing: .1em; padding: 4px 12px; border-radius: 8px; }
    #talk p { margin: 6px 0 0; font-size: 17px; line-height: 1.45; min-height: 2.9em; }
    #talk em { position: absolute; right: 14px; bottom: 6px; font-style: normal; color: #b5482a; font-size: 12px; }
    #hint { position: fixed; left: max(14px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 3; color: #fff8e6; font-size: 13px; text-shadow: 0 1px 2px #0008; pointer-events: none; }
    #ping { position: fixed; z-index: 3; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 3px solid #fff8e6; border-radius: 50%; pointer-events: none; opacity: 0; }
    #ping.go { animation: ping .5s ease-out; }
    @keyframes ping { from { opacity: 1; transform: scale(.4); } to { opacity: 0; transform: scale(1.6); } }
  </style>
</head>
<body>
  <div id="fade"></div>
  <div id="title"><small></small><b></b></div>
  <div id="marks"></div>
  <div id="ping"></div>
  <div id="talk" hidden><b></b><p></p><em>▶</em></div>
  <div id="hint">Toque ou clique no chão para andar · WASD também · toque/E para falar</div>
  <script type="module" src="/src/mockups/tunic/main.js"></script>
</body>
</html>
