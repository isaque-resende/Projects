<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mockup HD-2D — Emaús</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #f3e9d2; --gold: #d9b56a; --gold2: #8a6a34; --box: #0d0b10ee; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b090c; color: var(--ink); font-family: 'Alegreya', Georgia, serif; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { display: block; width: 100%; height: 100%; }
    [hidden] { display: none !important; }
    #fade { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity .55s; z-index: 9; }
    #banner { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity 1s; z-index: 5; text-shadow: 0 2px 10px #000; white-space: nowrap; }
    #banner.on { opacity: 1; }
    #banner small { display: block; font: 600 12px 'Cinzel', serif; letter-spacing: .3em; color: var(--gold); opacity: .85; }
    #banner b { display: block; font: 700 clamp(22px, 6vw, 38px) 'Cinzel', serif; letter-spacing: .14em; color: #fff3da; margin: 4px 0; }
    #banner i { display: block; height: 1px; width: 70%; margin: 6px auto 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    /* caixa de diálogo estilo Octopath: escura, borda dupla ornamental, cantos */
    #talk { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(720px, calc(100vw - 28px)); box-sizing: border-box; z-index: 8; padding: 18px 26px 22px; background: linear-gradient(180deg, #17131cf0, #0a080cf2); border: 2px solid var(--gold2); outline: 1px solid #000; box-shadow: inset 0 0 0 4px #0a080c, inset 0 0 0 5px #5a4524, 0 10px 40px #000c; cursor: pointer; }
    #talk::before, #talk::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--gold); transform: rotate(45deg); background: #0d0b10; top: -9px; }
    #talk::before { left: 18px; } #talk::after { right: 18px; }
    #talkName { position: absolute; left: 34px; top: -15px; padding: 3px 14px 4px; font: 700 14px 'Cinzel', serif; letter-spacing: .14em; color: #fff0cf; background: linear-gradient(#3a2a14, #1e150b); border: 1px solid var(--gold); text-shadow: 0 1px 2px #000; }
    #talkText { margin: 6px 0 0; font-size: clamp(16px, 4.2vw, 19px); line-height: 1.5; min-height: 3em; color: var(--ink); }
    #talkMore { position: absolute; right: 18px; bottom: 8px; color: var(--gold); font-size: 13px; opacity: 0; }
    #talk.ready #talkMore { opacity: 1; animation: bob .8s infinite; }
    @keyframes bob { 50% { transform: translateY(3px); } }
    #hint { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); font: 500 13px 'Alegreya', serif; color: #f3e9d2cc; background: #0d0b10aa; border: 1px solid #8a6a3466; padding: 6px 14px; border-radius: 3px; white-space: nowrap; z-index: 4; }
    #tag { position: fixed; left: max(14px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); font: 600 11px 'Cinzel', serif; letter-spacing: .2em; color: #d9b56a99; z-index: 4; }
  </style>
</head>
<body>
  <div id="tag">MOCKUP · HD-2D</div>
  <div id="banner"><small>Domingo, o terceiro dia</small><b id="bannerName">Betânia</b><i></i></div>
  <div id="talk" hidden><span id="talkName"></span><p id="talkText"></p><span id="talkMore">▼</span></div>
  <div id="hint">Toque no chão para andar · toque em quem tem ✦ para falar</div>
  <div id="fade"></div>
  <script type="module" src="/src/mockups/octopath/main.js"></script>
</body>
</html>
