<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Reino Estilizado</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #a9c8e8; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #1d2b3a; color: #f3ead2; z-index: 10; transition: opacity .6s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 { margin: 0; font-weight: 600; letter-spacing: .08em; font-size: 22px; }
    #bar { width: min(260px, 70vw); height: 6px; background: #ffffff22; border-radius: 3px; overflow: hidden; }
    #bar i { display: block; height: 100%; width: 0; background: #f3d98a; transition: width .2s; }
    #hint { position: fixed; left: 16px; bottom: 14px; color: #fff; font-size: 13px; text-shadow: 0 1px 3px #0008; opacity: .85; pointer-events: none; }
    body.touch #hint { display: none; }
    #touch { display: none; }
    body.touch #touch { display: block; }
    #stick { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom)); width: 130px; height: 130px; border-radius: 50%; background: #ffffff22; border: 2px solid #ffffff55; }
    #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: #ffffffaa; box-shadow: 0 2px 8px #0005; }
    .btn { position: fixed; width: 66px; height: 66px; border-radius: 50%; background: #ffffff33; border: 2px solid #ffffff77; color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 13px; text-shadow: 0 1px 2px #0008; }
    #bJump { right: max(22px, env(safe-area-inset-right)); bottom: max(34px, env(safe-area-inset-bottom)); }
    #bAtk { right: max(98px, calc(env(safe-area-inset-right) + 76px)); bottom: max(78px, env(safe-area-inset-bottom)); }
    #bRun { right: max(22px, env(safe-area-inset-right)); bottom: max(112px, calc(env(safe-area-inset-bottom) + 78px)); }
    .btn.on { background: #f3d98aaa; }
  </style>
</head>
<body>
  <div id="loading"><h1>REINO ESTILIZADO</h1><div id="bar"><i></i></div><div id="msg" style="font-size:13px;opacity:.7">carregando…</div></div>
  <div id="hint">WASD mover · Shift correr · Espaço pular · F/clique atacar · arraste o mouse para girar a câmera · roda para zoom</div>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <div class="btn" id="bRun">CORRER</div>
    <div class="btn" id="bAtk">ATACAR</div>
    <div class="btn" id="bJump">PULAR</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
