<script type="module">
// Fase de Betfagé, montada no Blender a partir do diorama de referência (betfage_cenario.glb + betfage_layout.json):

// pátio: o ponto de chão (sem telhado) mais perto do meio da ínsula, do lado da câmera

  JUM.anel.position.set(jumenta.o.position.x * 0.6 + jumentinho.o.position.x * 0.4, 0, jumenta.o.position.z * 0.6 + jumentinho.o.position.z * 0.4); JUM.anel.position.y = terreno(JUM.anel.position.x, JUM.anel.position.z) + 0.06;
  JUM.anel.material.opacity = JUM.visto ? Math.max(0, JUM.anel.material.opacity - dt * 0.3) : 0.35 + 0.15 * Math.sin(t * 2.5);
  for (const o of ovelhas) {
    if (o.alvo) {
      const d = new THREE.Vector3().subVectors(o.alvo, o.o.position).setY(0);
      if (d.length() < 0.1) { o.alvo = null; o.espera = 2 + rnd() * 5; o.toca(rnd() < 0.6 ? 'Comer' : 'Parado'); }
      else {
        d.normalize(); const fr = o.o.position.clone().addScaledVector(d, 0.3);
        if (ovelhas.some((b) => b !== o && b.o.position.distanceTo(fr) < 0.7)) { o.alvo = null; o.espera = 1 + rnd() * 2; o.toca('Parado'); }
        else { o.o.position.addScaledVector(d, 0.4 * dt); chao(o); lerpAng(o.o, Math.atan2(d.x, d.z), Math.min(1, dt * 5)); }
      }
    } else if ((o.espera -= dt) <= 0) { const a = rnd() * 6.28, r = rnd() * o.area.r; o.alvo = V3(o.area.x + Math.cos(a) * r, 0, o.area.z + Math.sin(a) * r); o.toca('Andar'); }
  }
  if (pausa > 0) { pausa -= dt; andante.toca('Parado'); }
  else if (jog.o.position.distanceTo(andante.o.position) < 1.1) andante.toca('Parado');
  else { andante.toca('Andar'); tRota += sentido * dt * 1.0 / ROTA.getLength(); if (tRota > tMax || tRota < tMin) { tRota = THREE.MathUtils.clamp(tRota, tMin, tMax); sentido *= -1; pausa = 3; } }
  { const pr = ROTA.getPointAt(tRota), tg = ROTA.getTangentAt(tRota).multiplyScalar(sentido), lat = V3(-tg.z, 0, tg.x).multiplyScalar(0.8); andante.o.position.copy(pr).add(lat); chao(andante); lerpAng(andante.o, Math.atan2(tg.x, tg.z), Math.min(1, dt * 5)); }
  for (const n of [conv1, conv2]) { const d = jog.o.position.distanceTo(n.o.position); lerpAng(n.o, d < 3.5 ? Math.atan2(jog.o.position.x - n.o.position.x, jog.o.position.z - n.o.position.z) : n.r0, Math.min(1, dt * 3)); }

  // câmera: afastada, o diorama inteiro; aproximando, segue o jogador
  distAlvo = Math.min(distAlvo, DMAX());
  dist += (distAlvo - dist) * Math.min(1, dt * 6);
  const k = sm(DMIN, DMAX() * 0.92, dist);
  const alvoF = pj.clone().lerp(CENTRO, k);
  foco.lerp(alvoF, Math.min(1, dt * 3));
  camera.position.copy(foco).addScaledVector(DIR, dist); camera.lookAt(foco);
  scene.fog.near = dist + 6; scene.fog.far = dist + 40;
  sun.position.set(foco.x - 10, foco.y + 26, foco.z + 14); sun.target.position.copy(foco);
  atualizaFade();
  renderer.render(scene, camera);
};
renderer.setAnimationLoop(() => laco());
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
