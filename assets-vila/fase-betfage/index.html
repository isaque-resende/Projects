<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e6e4d2">
<title>Fase de Betfagé</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e6e4d2; font-family: system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity .9s; display: flex; align-items: center; justify-content: center; color: #f3e9d2; font-size: 22px; letter-spacing: .04em; text-align: center; padding: 0 24px; }
  #acao { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 12px 20px; border: 0; border-radius: 12px; background: #fdf6e3; color: #4a3520; font-size: 16px; box-shadow: 0 3px 12px #0003; display: none; z-index: 5; }
  #fala { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: min(86vw, 560px); text-align: center; color: #fdf6e3; font: italic 19px/1.45 Georgia, serif; text-shadow: 0 2px 8px #000c; opacity: 0; transition: opacity .8s; pointer-events: none; }
  #dica { position: fixed; left: 12px; top: calc(10px + env(safe-area-inset-top)); color: #4a3520; background: #fdf6e3cc; padding: 6px 10px; border-radius: 8px; font-size: 13px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="fade">Betfagé</div>
<button id="acao"></button>
<div id="fala"></div>
<div id="dica">Direcional, WASD ou toque para andar · Shift corre · Espaço pula · roda/pinça: zoom</div>
<script type="module">
// Fase de Betfagé, montada no Blender a partir do diorama de referência (betfage_cenario.glb + betfage_layout.json):
// um morro com socalcos, a estrada em S do pé ao cume, a aldeia geminada no meio, o trigal à direita, a eira à esquerda.
// Aqui ficam a luz, a câmera, o jogador, o trigal instanciado e os NPCs.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// céu do diorama: verde-água claro em cima, creme embaixo
const CEU = (() => { const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#cfe6e0'); gr.addColorStop(0.55, '#e9ead6'); gr.addColorStop(1, '#f6dcc0'); g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
scene.background = CEU;
scene.fog = new THREE.Fog(0xe4e6d4, 60, 110);
const hemi = new THREE.HemisphereLight(0xe2f0ff, 0xc9b088, 1.45); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d6, 2.9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 100 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

let seed = 23;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const tl = new THREE.TextureLoader();
const sm = (a, b, x) => { let k = (x - a) / (b - a); k = k < 0 ? 0 : k > 1 ? 1 : k; return k * k * (3 - 2 * k); };
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const CIMA = V3(0, 1, 0);

// ---------- carregamento ----------
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const baixar = async (url) => {
  for (let k = 0; ; k++) {
    try { return await loader.loadAsync(url); } catch (e) { if (k >= 3) throw e; await new Promise((r) => setTimeout(r, 400 * (k + 1))); }
  }
};
const sombra = (r) => r.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
const LAY = await (await fetch('betfage_layout.json?v=23')).json();
const S = LAY.S;
// coordenadas do diorama: a = rumo ao canto direito, b = rumo ao canto esquerdo (0,0 = canto da frente)
const AB = (x, z) => [(S / 2 - z) / S, (S / 2 - x) / S];
const XZ = (a, b) => [S / 2 - b * S, S / 2 - a * S];
const ARQS = [...new Set(LAY.objetos.map((o) => o.glb))];
const [gCen, gCasaP, gTrigo, gColh, gBoi, gOve, gJum, gJog, gObj, nAldeao, nFaixa, nCarreg, nRobusto, nBotoes, nMoco, nPastor, nMagro, nRapaz, ...gArqs] = await Promise.all([
  baixar('betfage_cenario.glb?v=23'), baixar('../casa-porta/insula.glb'), baixar('../trigal/trigo.glb'), baixar('../colheita-trigo/colheita.glb'),
  baixar('../animais/boi.glb'), baixar('../animais/ovelha.glb'), baixar('../animais/jumento.glb'), baixar('../vila-betania/discipulo_acoes.glb'), baixar('../casa-porta/objetos_casa.glb'),
  baixar('../personagens/aldeao.glb'), baixar('../personagens/mulher_faixa.glb'), baixar('../personagens/carregador.glb'),
  baixar('../personagens/robusto.glb'), baixar('../personagens/mulher_botoes.glb'), baixar('../personagens/moco.glb'),
  null, baixar('../personagens/magro.glb'), baixar('../personagens/rapaz.glb'),
  ...ARQS.map((a) => baixar('../' + a)),
]);
const nos = (g) => { const m = {}; for (const n of g.scene.children) m[n.name] = n; return m; };
const KIT = Object.fromEntries(ARQS.map((a, i) => [a, nos(gArqs[i])]));
for (const k of Object.values(KIT)) for (const o of Object.values(k)) o.position.set(0, 0, 0);
const CO = nos(gColh), CO0 = {}; for (const [n, o] of Object.entries(CO)) { CO0[n] = o.position.clone(); o.position.set(0, 0, 0); }
const OB = nos(gObj); for (const o of Object.values(OB)) o.position.set(0, 0, 0);

// ---------- cenário do Blender: terreno, estrada, muros ----------
const matTerra = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true });
let TERRENO = null;
gCen.scene.traverse((o) => {
  if (!o.isMesh) return;
  if (o.name.startsWith('Betfage_Terreno')) { o.material = matTerra; TERRENO = o; o.receiveShadow = true; }
  else if (o.name.startsWith('Betfage_Estrada')) { o.material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true, polygonOffset: true, polygonOffsetFactor: -2 }); o.receiveShadow = true; }
  else { o.castShadow = true; o.receiveShadow = true; }
});
scene.add(gCen.scene);
// mapa de alturas do terreno (cada célula guarda a maior altura dos triângulos que a cobrem)
function mapaAltura(mesh, P = 0.3) {
  mesh.updateWorldMatrix(true, false);
  const cx = new THREE.Box3().setFromObject(mesh);
  const GX0 = cx.min.x - 0.2, GZ0 = cx.min.z - 0.2;
  const GW = Math.ceil((cx.max.x - cx.min.x + 0.4) / P) + 1, GD = Math.ceil((cx.max.z - cx.min.z + 0.4) / P) + 1;
  const ALT = new Float32Array(GW * GD).fill(-1e9);
  const pos = mesh.geometry.attributes.position, idx = mesh.geometry.index, m = mesh.matrixWorld;
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  const n = idx ? idx.count : pos.count;
  for (let t = 0; t < n; t += 3) {
    A.fromBufferAttribute(pos, idx ? idx.getX(t) : t).applyMatrix4(m); B.fromBufferAttribute(pos, idx ? idx.getX(t + 1) : t + 1).applyMatrix4(m); C.fromBufferAttribute(pos, idx ? idx.getX(t + 2) : t + 2).applyMatrix4(m);
    const i0 = Math.max(0, Math.floor((Math.min(A.x, B.x, C.x) - GX0) / P)), i1 = Math.min(GW - 1, Math.ceil((Math.max(A.x, B.x, C.x) - GX0) / P));
    const k0 = Math.max(0, Math.floor((Math.min(A.z, B.z, C.z) - GZ0) / P)), k1 = Math.min(GD - 1, Math.ceil((Math.max(A.z, B.z, C.z) - GZ0) / P));
    const d = (B.z - C.z) * (A.x - C.x) + (C.x - B.x) * (A.z - C.z);
    if (Math.abs(d) < 1e-6) { for (let i = i0; i <= i1; i++) for (let k = k0; k <= k1; k++) { const y = Math.max(A.y, B.y, C.y); if (y > ALT[i * GD + k]) ALT[i * GD + k] = y; } continue; }
    for (let i = i0; i <= i1; i++) for (let k = k0; k <= k1; k++) {
      const xx = GX0 + i * P, zz = GZ0 + k * P;
      const w1 = ((B.z - C.z) * (xx - C.x) + (C.x - B.x) * (zz - C.z)) / d, w2 = ((C.z - A.z) * (xx - C.x) + (A.x - C.x) * (zz - C.z)) / d, w3 = 1 - w1 - w2;
      if (w1 < -0.02 || w2 < -0.02 || w3 < -0.02) continue;
      const y = w1 * A.y + w2 * B.y + w3 * C.y; if (y > ALT[i * GD + k]) ALT[i * GD + k] = y;
    }
  }
  return (wx, wz) => {
    const fx = (wx - GX0) / P, fz = (wz - GZ0) / P;
    const i = Math.max(0, Math.min(GW - 2, Math.floor(fx))), k = Math.max(0, Math.min(GD - 2, Math.floor(fz))), a = fx - i, b = fz - k;
    const g = (ii, kk) => { const v = ALT[ii * GD + kk]; return v < -1e8 ? 0 : v; };
    return (g(i, k) * (1 - a) + g(i + 1, k) * a) * (1 - b) + (g(i, k + 1) * (1 - a) + g(i + 1, k + 1) * a) * b;
  };
}
// TESTE "prado": terreno e estrada com sombreamento suave e cor misturada entre os vértices (sem faces chapadas)
function suaviza(mesh, verdeia) {
  const g0 = mesh.geometry, pos = g0.attributes.position, col = g0.attributes.color, idx = g0.index;
  const mapa = new Map(), P = [], C = [], N = [], I = [];
  const n = idx ? idx.count : pos.count;
  for (let t = 0; t < n; t++) {
    const v = idx ? idx.getX(t) : t;
    const x = pos.getX(v), y = pos.getY(v), z = pos.getZ(v), k = Math.round(x * 50) + '_' + Math.round(z * 50) + '_' + Math.round(y * 50);
    let j = mapa.get(k);
    if (j === undefined) { j = P.length / 3; mapa.set(k, j); P.push(x, y, z); C.push(0, 0, 0); N.push(0); }
    if (col) { C[j * 3] += col.getX(v); C[j * 3 + 1] += col.getY(v); C[j * 3 + 2] += col.getZ(v); N[j]++; }
    I.push(j);
  }
  for (let j = 0; j < N.length; j++) if (N[j]) {
    let r = C[j * 3] / N[j], gg = C[j * 3 + 1] / N[j], b = C[j * 3 + 2] / N[j];
    if (verdeia && gg > r * 0.98) { r *= 0.92; gg = Math.min(1, gg * 1.1); b *= 0.75; }   // grama um pouco mais viva, como na referência
    C[j * 3] = r; C[j * 3 + 1] = gg; C[j * 3 + 2] = b;
  }
  const g1 = new THREE.BufferGeometry();
  g1.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g1.setAttribute('color', new THREE.Float32BufferAttribute(C, 3)); g1.setIndex(I);
  g1.computeVertexNormals(); mesh.geometry = g1;
  mesh.material = mesh.material.clone(); mesh.material.flatShading = false; mesh.material.needsUpdate = true;
}
suaviza(TERRENO, true);
gCen.scene.traverse((o) => { if (o.isMesh && o.name.startsWith('Betfage_Estrada')) suaviza(o, false); });
// texturas pintadas (grama e terra), projetadas de cima pelo mundo; a cor de vértice decide onde é grama e onde é terra
const texChao = (url) => { const x = tl.load(url); x.colorSpace = THREE.SRGBColorSpace; x.wrapS = x.wrapT = THREE.RepeatWrapping; x.anisotropy = 4; return x; };
const TX = { grama: texChao('tex/grama.webp?v=1'), terra: texChao('tex/terra.webp?v=1') };
function texturiza(mesh, soTerra) {
  const m = mesh.material;
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uGrama = { value: TX.grama }; sh.uniforms.uTerra = { value: TX.terra };
    sh.vertexShader = 'varying vec3 vWP; varying vec3 vWN;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n vWP = (modelMatrix * vec4(transformed, 1.0)).xyz; vWN = normalize(mat3(modelMatrix) * objectNormal);');
    sh.fragmentShader = 'uniform sampler2D uGrama; uniform sampler2D uTerra; varying vec3 vWP; varying vec3 vWN;\n' + sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      vec3 vc = vColor.rgb;
      vec3 tg = texture2D(uGrama, vWP.xz * 0.2).rgb;
      vec3 tt = texture2D(uTerra, vWP.xz * 0.16 + 0.37).rgb;
      float gr = ${soTerra ? '0.0' : 'smoothstep(-0.045, 0.0, vc.g - vc.r) * smoothstep(0.55, 0.8, vWN.y)'};
      float seco = ${soTerra ? '0.0' : '1.0 - smoothstep(-0.01, 0.04, vc.g - vc.r)'};
      tg = mix(tg, vec3(dot(tg, vec3(0.3, 0.59, 0.11))), 0.18) * vec3(0.9, 0.88, 0.8);              // grama menos neon
      tg = mix(tg, tg * vec3(1.15, 1.0, 0.65), seco * 0.6);                                         // capim seco amarelado
      float lt = dot(tt, vec3(0.3, 0.59, 0.11));
      vec3 terra = mix(tt, vec3(lt) * vec3(1.18, 1.02, 0.78), 0.45) * 1.05;                         // terra bege, menos laranja
      diffuseColor.rgb = mix(terra, tg, gr);`);
  };
  m.customProgramCacheKey = () => 'chao-tex-' + soTerra; m.needsUpdate = true;
}
texturiza(TERRENO, false);
gCen.scene.traverse((o) => { if (o.isMesh && o.name.startsWith('Betfage_Estrada')) texturiza(o, true); });
const terreno = mapaAltura(TERRENO);
// matas mais fechadas ao longe: cada árvore distante ganha duas vizinhas
{
  const extra = [];
  for (const o of LAY.objetos) {
    if (!o.f || /Rocha/.test(o.no)) continue;
    for (let i = 0; i < 2; i++) {
      const a = rnd() * 6.28, d = 1.3 + rnd() * 1.1, x = o.p[0] + Math.cos(a) * d, z = o.p[2] + Math.sin(a) * d;
      extra.push({ ...o, p: [x, terreno(x, z) - 0.15, z], r: rnd() * 6.28, k: o.k * (0.8 + rnd() * 0.35) });
    }
  }
  LAY.objetos.push(...extra);
}

// ---------- estrada (do layout) ----------
const ESTR = LAY.estrada.map(([x, z]) => V3(x, 0, z));
const ROTA = new THREE.CatmullRomCurve3(ESTR);
const AMOS = []; { const L = ROTA.getLength(), n = Math.ceil(L * 2); for (let i = 0; i <= n; i++) AMOS.push(ROTA.getPointAt(i / n)); }
const distEstrada = (x, z) => { let m = 1e9; for (const p of AMOS) { const d = Math.hypot(p.x - x, p.z - z); if (d < m) m = d; } return m; };
const naEstrada = (x, z, m = 0) => distEstrada(x, z) < LAY.meia + m;

// ---------- obstáculos ----------
const CAIXAS = [], CIRC = LAY.obst.map(([x, z, r]) => ({ x, z, r })), FADE = [];
const bate = (x, z, m = 0.3) => CAIXAS.some((c) => x > c.x0 - m && x < c.x1 + m && z > c.z0 - m && z < c.z1 + m) || CIRC.some((c) => Math.hypot(c.x - x, c.z - z) < c.r + m);
function caixaDe(obj, enc = 0) { obj.updateWorldMatrix(true, true); const b = new THREE.Box3().setFromObject(obj); CAIXAS.push({ x0: b.min.x + enc, x1: b.max.x - enc, z0: b.min.z + enc, z1: b.max.z - enc }); }
// objetos do layout (árvores, pedras, eira, feixes, cestos...)
const ALTOS = /Oliveira|Cipreste|Arvore|Figueira/;
const CONSTR = [];       // construções com pisos e paredes (a ínsula e a casa avulsa)
const FORNO = {};        // forno de barro (tabun): fogo dentro, fumaça pela boca de cima; pães na mesa ao lado
// ao longe (matas e pedregais): uma InstancedMesh por malha de cada modelo
{
  const grupos = {};
  for (const o of LAY.objetos) if (o.f) (grupos[o.glb + '|' + o.no] ||= []).push(o);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (const lista of Object.values(grupos)) {
    const raiz = KIT[lista[0].glb]?.[lista[0].no]; if (!raiz) continue;
    raiz.updateMatrixWorld(true);
    raiz.traverse((mm) => {
      if (!mm.isMesh) return;
      const inst = new THREE.InstancedMesh(mm.geometry, mm.material, lista.length);
      lista.forEach((o, i) => { q.setFromEuler(new THREE.Euler(raiz.rotation.x, raiz.rotation.y + o.r, raiz.rotation.z)); s.copy(raiz.scale).multiplyScalar(o.k); m4.compose(p.set(...o.p), q, s); m4.multiply(raiz.matrixWorld.clone().invert().multiply(mm.matrixWorld)); inst.setMatrixAt(i, m4); });
      inst.castShadow = false; inst.receiveShadow = true; inst.frustumCulled = false; scene.add(inst);
    });
  }
}
for (const o of LAY.objetos) {
  if (o.f) continue;
  const m = KIT[o.glb]?.[o.no]; if (!m) continue;
  const n = m.clone(); n.position.set(...o.p); n.rotation.y += o.r; n.scale.multiplyScalar(o.k); sombra(n); scene.add(n);
  if (/^Casa(2|_Sobrado|_Alcapao|_Varal)$/.test(o.no)) { FADE.push(n); n.userData.casa = true; CONSTR.push(n); }
  if (o.no === 'Cocho') { if (Math.hypot(o.p[0] - LAY.manjedoura[0], o.p[2] - LAY.manjedoura[2]) < 1) FORNO.manj = n; else FORNO.bebe = n; }
  if (o.no === 'Peneira_Graos') FORNO.eira = n;
  if (o.no === 'Forno_Barro') FORNO.o = n, FORNO.r = o.r;
  if (o.no === 'Bancada') FORNO.mesa = n;
  if (ALTOS.test(o.no)) FADE.push(n);
}

// ---------- casas geminadas, em degraus ----------
const CASAS = [];        // (as portas das casas avulsas não existem mais: a aldeia é uma ínsula só)
const ABERTO = -1.75;
// a ínsula: casas geminadas em L em volta de um pátio, com escada externa; dá para subir nos terraços
const INS = { g: gCasaP.scene };
INS.g.position.set(...LAY.insula.p); INS.g.rotation.y = LAY.insula.r; sombra(INS.g); scene.add(INS.g); FADE.push(INS.g);
INS.g.updateMatrixWorld(true);
// pisos: cada célula guarda as alturas de todas as faces viradas para cima (chão, degraus, terraços);
// paredes: o trecho de altura ocupado por faces de pé. Assim o beiral não vira chão e a parede barra a passagem.
function mapaCamadas(mesh, P = 0.2) {
  mesh.updateWorldMatrix(true, false);
  const cx = new THREE.Box3().setFromObject(mesh), X0 = cx.min.x - 0.3, Z0 = cx.min.z - 0.3;
  const W = Math.ceil((cx.max.x - cx.min.x + 0.6) / P) + 1, D = Math.ceil((cx.max.z - cx.min.z + 0.6) / P) + 1;
  const PISO = Array.from({ length: W * D }, () => []), PA0 = new Float32Array(W * D).fill(1e9), PA1 = new Float32Array(W * D).fill(-1e9);
  const pos = mesh.geometry.attributes.position, idx = mesh.geometry.index, m = mesh.matrixWorld, n = idx ? idx.count : pos.count;
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3(), N = new THREE.Vector3(), Q = new THREE.Vector3();
  const cel = (x, z) => { const i = Math.round((x - X0) / P), k = Math.round((z - Z0) / P); return i < 0 || k < 0 || i >= W || k >= D ? -1 : i * D + k; };
  for (let t = 0; t < n; t += 3) {
    A.fromBufferAttribute(pos, idx ? idx.getX(t) : t).applyMatrix4(m); B.fromBufferAttribute(pos, idx ? idx.getX(t + 1) : t + 1).applyMatrix4(m); C.fromBufferAttribute(pos, idx ? idx.getX(t + 2) : t + 2).applyMatrix4(m);
    N.subVectors(B, A).cross(Q.subVectors(C, A)); const area = N.length(); if (area < 1e-7) continue; N.divideScalar(area);
    const L = Math.max(A.distanceTo(B), B.distanceTo(C), C.distanceTo(A)), s = Math.max(2, Math.ceil(L / (P * 0.5)));
    if (N.y < -0.6) continue;          // face virada para baixo (fundo da escada, beiral): nem piso nem parede
    const piso = N.y > 0.6;
    for (let i = 0; i <= s; i++) for (let k = 0; k <= s - i; k++) {
      const u = i / s, v = k / s; Q.copy(A).multiplyScalar(1 - u - v).addScaledVector(B, u).addScaledVector(C, v);

  else if (portaPerto) botao.textContent = (toqueTela ? '' : 'E: ') + (portaPerto.aberta ? 'fechar a porta' : 'abrir a porta');
  botao.style.display = (saida || portaPerto) && !fora ? 'block' : 'none';

  UT.uP.value[0].copy(pj); UT.uP.value[1].copy(ceifeiro.o.position); UT.uP.value[2].copy(atadeira.o.position); UT.uP.value[3].copy(carregador.o.position);
  fornoPasso(dt, t); ceifeiroPasso(dt, t); atadeiraPasso(dt); carregadorPasso(dt); debulhadorPasso(dt, t); joeiradeiraPasso(dt, t); partPasso(dt);
  if (rnd() < dt * 0.08) boiCarro.toca(boiCarro.atual === 'Comer' ? 'Parado' : 'Comer');
  if (rnd() < dt * 0.06) jumenta.toca(jumenta.atual === 'Comer' ? 'Parado' : 'Comer');
  { const c = jumenta.o.position.clone().add(V3(0, 0.9, 0)).addScaledVector(frente(jumenta), 0.5); barra(CORDA_J, ESTACA.clone().add(V3(0, 0.95, 0)), c); }
  if (!JUM.visto && jog.o.position.distanceTo(jumenta.o.position) < 3.2) { JUM.visto = true; fala('Uma jumenta amarrada, e um jumentinho com ela, em que ninguém ainda montou.'); setTimeout(() => fala(''), 5000); }
  JUM.anel.position.set(jumenta.o.position.x * 0.6 + jumentinho.o.position.x * 0.4, 0, jumenta.o.position.z * 0.6 + jumentinho.o.position.z * 0.4); JUM.anel.position.y = terreno(JUM.anel.position.x, JUM.anel.position.z) + 0.06;
  JUM.anel.material.opacity = JUM.visto ? Math.max(0, JUM.anel.material.opacity - dt * 0.3) : 0.35 + 0.15 * Math.sin(t * 2.5);
  for (const o of ovelhas) {
    if (o.alvo) {
      const d = new THREE.Vector3().subVectors(o.alvo, o.o.position).setY(0);
      if (d.length() < 0.1) { o.alvo = null; o.espera = 2 + rnd() * 5; o.toca(rnd() < 0.6 ? 'Comer' : 'Parado'); }
      else {
        d.normalize(); const fr = o.o.position.clone().addScaledVector(d, 0.3);
        if (ovelhas.some((b) => b !== o && b.o.position.distanceTo(fr) < 0.7)) { o.alvo = null; o.espera = 1 + rnd() * 2; o.toca('Parado'); }
        else { o.o.position.addScaledVector(d, 0.4 * dt); chao(o); lerpAng(o.o, Math.atan2(d.x, d.z), Math.min(1, dt * 5)); }
      }
    } else if ((o.espera -= dt) <= 0) { const a = rnd() * 6.28, r = rnd() * o.area.r; o.alvo = V3(o.area.x + Math.cos(a) * r, 0, o.area.z + Math.sin(a) * r); o.toca('Andar'); }
  }
  if (pausa > 0) { pausa -= dt; andante.toca('Parado'); }
  else if (jog.o.position.distanceTo(andante.o.position) < 1.1) andante.toca('Parado');
  else { andante.toca('Andar'); tRota += sentido * dt * 1.0 / ROTA.getLength(); if (tRota > tMax || tRota < tMin) { tRota = THREE.MathUtils.clamp(tRota, tMin, tMax); sentido *= -1; pausa = 3; } }
  { const pr = ROTA.getPointAt(tRota), tg = ROTA.getTangentAt(tRota).multiplyScalar(sentido), lat = V3(-tg.z, 0, tg.x).multiplyScalar(0.8); andante.o.position.copy(pr).add(lat); chao(andante); lerpAng(andante.o, Math.atan2(tg.x, tg.z), Math.min(1, dt * 5)); }
  for (const n of [conv1, conv2]) { const d = jog.o.position.distanceTo(n.o.position); lerpAng(n.o, d < 3.5 ? Math.atan2(jog.o.position.x - n.o.position.x, jog.o.position.z - n.o.position.z) : n.r0, Math.min(1, dt * 3)); }

  // câmera: afastada, o diorama inteiro; aproximando, segue o jogador
  distAlvo = Math.min(distAlvo, DMAX());
  dist += (distAlvo - dist) * Math.min(1, dt * 6);
  const k = sm(DMIN, DMAX() * 0.92, dist);
  const alvoF = pj.clone().lerp(CENTRO, k);
  foco.lerp(alvoF, Math.min(1, dt * 3));

};
renderer.setAnimationLoop(() => laco());
