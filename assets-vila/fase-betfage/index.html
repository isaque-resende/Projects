<script type="module">
// Fase de Betfagé: aldeia na encosta leste do Monte das Oliveiras. O terreno sobe da frente (onde se chega,
// vindo de Betânia) até o alto (saída para Jerusalém). Câmera isométrica fixa, só segue e aproxima.
// Eixos da fase: u = direita da tela, v = subida (para o fundo da tela).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdcd6c4);
scene.fog = new THREE.Fog(0xdcd6c4, 60, 120);
const hemi = new THREE.HemisphereLight(0xd6ebff, 0xc9a47a, 1.3); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe2b8, 3.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 90 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

let seed = 23;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const tl = new THREE.TextureLoader();
const tex = (url, rep) => {
  const t = tl.load(url); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); if (rep) t.repeat.set(rep, rep); return t;
};
const TX = '../fase-betania/tex/';
const sm = (a, b, x) => { let k = (x - a) / (b - a); k = k < 0 ? 0 : k > 1 ? 1 : k; return k * k * (3 - 2 * k); };
const S2 = Math.SQRT1_2;
const XZ = (u, v) => [(u - v) * S2, (-u - v) * S2];
const pUV0 = XZ;
const UV = (x, z) => [(x - z) * S2, -(x + z) * S2];
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const CIMA0 = V3(0, 1, 0);

// ---------- carregamento ----------
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const baixar = async (url) => {
  for (let k = 0; ; k++) {
    try { return await loader.loadAsync(url); } catch (e) { if (k >= 3) throw e; await new Promise((r) => setTimeout(r, 400 * (k + 1))); }
  }
};
const sombra = (r) => r.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
const nos = (g) => { const m = {}; for (const n of g.scene.children) { m[n.name] = n; } return m; };
const [gCasaP, gMuros, gTripo, gCip, gFrond, gRoch, gObj, gPast, gTrigo, gColh, gFig, gOliv, gBoi, gOve, gJum, gJog,
  nAldeao, nFaixa, nCarreg, nRobusto, nBotoes, nMoco, nPastor, nMagro, nRapaz] = await Promise.all([
  baixar('../casa-porta/casa_porta.glb'), baixar('../casa-porta/muros_kit.glb'), baixar('../casa-porta/arvores_tripo.glb'),
  baixar('../diorama-ciprestes/ciprestes.glb'), baixar('../casa-porta/arvores_frondosas.glb'), baixar('../casa-porta/rochas.glb'),
  baixar('../casa-porta/objetos_casa.glb'), baixar('../casa-porta/pastoril.glb'), baixar('../trigal/trigo.glb'),
  baixar('../colheita-trigo/colheita.glb'), baixar('../figueiras/figueiras.glb'), baixar('../oliveiras/oliveiras.glb'),
  baixar('../animais/boi.glb'), baixar('../animais/ovelha.glb'), baixar('../animais/jumento.glb'), baixar('../vila-betania/discipulo_acoes.glb'),
  baixar('../personagens/aldeao.glb'), baixar('../personagens/mulher_faixa.glb'), baixar('../personagens/carregador.glb'),
  baixar('../personagens/robusto.glb'), baixar('../personagens/mulher_botoes.glb'), baixar('../personagens/moco.glb'),
  baixar('../personagens/pastor.glb'), baixar('../personagens/magro.glb'), baixar('../personagens/rapaz.glb'),
]);
const MU = nos(gMuros), AT = nos(gTripo), C = nos(gCip), FR = nos(gFrond), R = nos(gRoch), OB = nos(gObj), PS = nos(gPast),
  CO = nos(gColh), FG = nos(gFig), OL = nos(gOliv);
// cada peça com a origem na própria base (os kits vêm espalhados pela cena do Blender)
const CO0 = {};
for (const [n, o] of Object.entries(CO)) CO0[n] = o.position.clone();
for (const o of [...Object.values(MU), ...Object.values(AT), ...Object.values(C), ...Object.values(FR), ...Object.values(R), ...Object.values(OB),
  ...Object.values(PS), ...Object.values(CO), ...Object.values(FG), ...Object.values(OL)]) o.position.set(0, 0, 0);

// ---------- layout (u, v) ----------
const U0 = -24, U1 = 29, V0 = -30, V1 = 27;                 // área de jogo
const ESTRADA_UV = [[-1, -46], [-2, -30], [-3, -24], [-5.5, -17], [-6, -11], [-3.5, -5], [-1.5, 0], [-1, 5], [-2.8, 10], [-4.5, 14], [-3, 19], [-0.5, 23], [0.5, 28], [1, 40]];
const CAMPO = { x0: 4.5, x1: 14.5, z0: -25.5, z1: -15.5 };    // trigal (alinhado com x/z, como na imagem)
const noCampo = (x, z, m = 0) => x > CAMPO.x0 - m && x < CAMPO.x1 + m && z > CAMPO.z0 - m && z < CAMPO.z1 + m;
const EIRA = { x: XZ(-13, -3)[0], z: XZ(-13, -3)[1], r: 3.1 };
const CASAS_XZ = [[3, -7], [11, -9], [10, 1]];

// ---------- terreno ----------
const P_T = 1.3;                                            // altura de cada socalco
function hb(x, z) {
  const [u, v] = UV(x, z); let h;
  if (v < 23) h = 0.21 * (v + 27);
  else { const d = Math.min(v - 23, 8); h = 10.5 + 0.21 * d - 0.013125 * d * d; }   // o alto do monte: a subida acaba num plano coberto de oliveiras
  h -= 0.0035 * u * u;
  h += 0.12 * Math.sin(x * 0.31 + 1) * Math.cos(z * 0.27 - 0.5) + 0.05 * Math.sin(x * 0.8 + z * 0.6);
  return h + 3;
}
// socalcos: só à esquerda, no olival, e no alto à direita
const mascaraT = (u, v) => Math.max(sm(-6, -9, u) * sm(1, 4, v) * sm(22, 19.5, v), sm(4, 7, u) * sm(14.5, 16.5, v) * sm(22, 19.5, v));
function hT(x, z) {
  const h = hb(x, z), [u, v] = UV(x, z), m = mascaraT(u, v);
  if (m <= 0) return h;
  const f = h / P_T, fl = Math.floor(f), t = P_T * (fl + sm(0.8, 1, f - fl));
  return h + (t - h) * m;
}
// plataformas niveladas (casas e eira)
const PADS = [];
const caixaCasa = (() => { const b = new THREE.Box3().setFromObject(gCasaP.scene); return { c: b.getCenter(new THREE.Vector3()), s: b.getSize(new THREE.Vector3()) }; })();
for (const [x, z] of CASAS_XZ) PADS.push({ x: x + caixaCasa.c.x, z: z + caixaCasa.c.z, hx: caixaCasa.s.x / 2 + 1.2, hz: caixaCasa.s.z / 2 + 1.6, f: 2.6, y: hT(x + caixaCasa.c.x, z + caixaCasa.c.z) - 0.15 });
PADS.push({ x: EIRA.x, z: EIRA.z, r: EIRA.r + 0.8, f: 2.4, y: hT(EIRA.x, EIRA.z) });
function hFinal(x, z) {
  let h = hT(x, z);
  for (const p of PADS) {
    const d = p.r ? Math.max(0, Math.hypot(x - p.x, z - p.z) - p.r) : Math.hypot(Math.max(0, Math.abs(x - p.x) - p.hx), Math.max(0, Math.abs(z - p.z) - p.hz));
    const w = 1 - sm(0, p.f, d); if (w > 0) h += (p.y - h) * w;
  }
  return h;
}
// grade de alturas (0,5 m)
const G0 = -80, GP = 0.5, GN = 321, GH = new Float32Array(GN * GN);
for (let i = 0; i < GN; i++) for (let k = 0; k < GN; k++) GH[i * GN + k] = hFinal(G0 + i * GP, G0 + k * GP);
function terreno(x, z) {
  const fx = (x - G0) / GP, fz = (z - G0) / GP;
  const i = Math.max(0, Math.min(GN - 2, Math.floor(fx))), k = Math.max(0, Math.min(GN - 2, Math.floor(fz)));
  const a = fx - i, b = fz - k;
  return (GH[i * GN + k] * (1 - a) + GH[(i + 1) * GN + k] * a) * (1 - b) + (GH[i * GN + k + 1] * (1 - a) + GH[(i + 1) * GN + k + 1] * a) * b;
}

// ---------- chão: vai muito além da área de jogo; facetado, cor por triângulo ----------
const ground = (() => {
  const g = new THREE.PlaneGeometry(160, 160, 160, 160); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, terreno(p.getX(i), p.getZ(i)));
  const gn = g.toNonIndexed(), q = gn.attributes.position, cor = [];
  const h = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
  const ruido = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return (h(xi, yi) * (1 - u) + h(xi + 1, yi) * u) * (1 - v) + (h(xi, yi + 1) * (1 - u) + h(xi + 1, yi + 1) * u) * v; };
  const verde = new THREE.Color(0xf2f2e4), verdeE = new THREE.Color(0xcfd8bc), seco = new THREE.Color(0xf6ead0), barranco = new THREE.Color(0xe9d8b8), c = new THREE.Color();
  const A = new THREE.Vector3(), B = new THREE.Vector3(), Cc = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < q.count; i += 3) {
    A.fromBufferAttribute(q, i); B.fromBufferAttribute(q, i + 1); Cc.fromBufferAttribute(q, i + 2);
    const x = (A.x + B.x + Cc.x) / 3, z = (A.z + B.z + Cc.z) / 3;
    const n1 = ruido(x / 14 + 5, z / 14 + 9), n2 = ruido(x / 6, z / 6);
    c.copy(verde).lerp(verdeE, sm(0.35, 0.75, n1) * 0.8);
    c.lerp(seco, sm(0.55, 0.85, n2 * 0.6 + n1 * 0.4) * 0.3);
    n.subVectors(B, A).cross(Cc.clone().sub(A)).normalize();
    c.lerp(barranco, sm(0.93, 0.75, Math.abs(n.y)) * 0.8);       // barrancos dos socalcos mais secos
    c.multiplyScalar(0.96 + h(x, z) * 0.07);
    for (let k = 0; k < 3; k++) cor.push(c.r, c.g, c.b);
  }
  gn.setAttribute('color', new THREE.Float32BufferAttribute(cor, 3)); gn.computeVertexNormals();
  return new THREE.Mesh(gn, new THREE.MeshStandardMaterial({ map: tex(TX + 'grama.webp', 9), vertexColors: true, roughness: 1, flatShading: true }));
})();
ground.receiveShadow = true; scene.add(ground);

// manchas de terra que acompanham o relevo (eira, terreiro, chão do trigal)
const bordaSuave = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const cx = cv.getContext('2d'), gr = cx.createRadialGradient(64, 64, 20, 64, 64, 64);
  gr.addColorStop(0, '#fff'); gr.addColorStop(0.7, '#fff'); gr.addColorStop(1, '#000');
  cx.fillStyle = gr; cx.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(cv);
})();
function mancha(x, z, rx, rz, mapa, cor = 0xffffff, rep = 2.5) {
  const NA = 32, NR = 6, pos = [], uv = [], uv1 = [], idx = [];
  pos.push(x, terreno(x, z) + 0.04, z); uv.push(0, 0); uv1.push(0.5, 0.5);
  for (let r = 1; r <= NR; r++) for (let a = 0; a < NA; a++) {
    const ang = a / NA * Math.PI * 2, k = r / NR, px = x + Math.cos(ang) * rx * k, pz = z + Math.sin(ang) * rz * k;
    pos.push(px, terreno(px, pz) + 0.04, pz); uv.push((px - x) / rep, (pz - z) / rep); uv1.push(0.5 + Math.cos(ang) * k * 0.5, 0.5 + Math.sin(ang) * k * 0.5);
  }
  for (let a = 0; a < NA; a++) idx.push(0, 1 + (a + 1) % NA, 1 + a);
  for (let r = 1; r < NR; r++) for (let a = 0; a < NA; a++) {
    const i0 = 1 + (r - 1) * NA + a, i1 = 1 + (r - 1) * NA + (a + 1) % NA, j0 = i0 + NA, j1 = i1 + NA;
    idx.push(i0, i1, j0, i1, j1, j0);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('uv1', new THREE.Float32BufferAttribute(uv1, 2)); g.setIndex(idx); g.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ map: mapa, color: cor, alphaMap: bordaSuave, transparent: true, depthWrite: false, roughness: 1, polygonOffset: true, polygonOffsetFactor: -1.5 });
  mat.alphaMap.channel = 1;
  const m = new THREE.Mesh(g, mat); m.receiveShadow = true; scene.add(m); return m;
}
const patio = tex(TX + 'patio.webp');

// ---------- estrada larga e ruelas, coladas no relevo ----------
const CAMINHOS = [];
function caminho(pts, larg) {
  const curva = new THREE.CatmullRomCurve3(pts.map(([x, z]) => V3(x, 0, z)));
  const L = curva.getLength(), N = Math.max(20, Math.round(L * 2)), pos = [], uv = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, p = curva.getPointAt(t), tg = curva.getTangentAt(t);
    const w = 1.45 * larg * (0.92 + 0.1 * Math.sin(t * 13 + pts.length));
    for (let j = 0; j <= 4; j++) {
      const s = -1 + j / 2, x = p.x - tg.z * w * s, z = p.z + tg.x * w * s;
      pos.push(x, terreno(x, z) + 0.05, z); uv.push(j / 4, t * L / (2.9 * larg));
    }
  }
  for (let i = 0; i < N; i++) for (let j = 0; j < 4; j++) { const a = i * 5 + j, b = a + 5; idx.push(a, a + 1, b, a + 1, b + 1, b); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex(TX + 'estrada.webp'), color: 0xf4ead8, roughness: 1, polygonOffset: true, polygonOffsetFactor: -2 }));
  m.receiveShadow = true; scene.add(m);
  const amostras = []; for (let i = 0; i <= Math.ceil(L * 1.5); i++) amostras.push(curva.getPointAt(i / Math.ceil(L * 1.5)));
  const c = { curva, larg, amostras }; CAMINHOS.push(c); return c;
}
const ESTRADA = caminho(ESTRADA_UV.map(([u, v]) => XZ(u, v)), 1.6);
const naEstrada = (x, z, m) => CAMINHOS.some(({ amostras, larg }) => amostras.some((p) => Math.hypot(p.x - x, p.z - z) < 1.45 * larg + m));
// distância à estrada principal, medida em u (para saber de que lado fica)
const uEstrada = (v) => { const a = ESTRADA_UV; for (let i = 0; i < a.length - 1; i++) if (v >= a[i][1] && v <= a[i + 1][1]) { const k = (v - a[i][1]) / (a[i + 1][1] - a[i][1]); return a[i][0] + (a[i + 1][0] - a[i][0]) * k; } return 0; };

// ---------- obstáculos ----------
const CAIXAS = [], CIRC = [], FADE = [];
const bate = (x, z, m = 0.3) => CAIXAS.some((c) => x > c.x0 - m && x < c.x1 + m && z > c.z0 - m && z < c.z1 + m) || CIRC.some((c) => Math.hypot(c.x - x, c.z - z) < c.r + m);
function caixaDe(obj, enc = 0) {
  obj.updateWorldMatrix(true, true);
  const b = new THREE.Box3().setFromObject(obj);
  CAIXAS.push({ x0: b.min.x + enc, x1: b.max.x - enc, z0: b.min.z + enc, z1: b.max.z - enc });
}
function por(modelo, x, z, r = 0, k = 1, { fade = false, caixa = false, circ = 0, y = null, afunda = 0.05 } = {}) {
  const n = modelo.clone(); n.position.set(x, (y ?? terreno(x, z)) - afunda, z); n.rotation.y = r; n.scale.setScalar(k);
  sombra(n); scene.add(n);
  if (caixa) caixaDe(n, typeof caixa === 'number' ? caixa : 0.15);
  if (circ) CIRC.push({ x, z, r: circ * k });
  if (fade) FADE.push(n);
  return n;
}

// ---------- casas da aldeia: três, em plataformas cortadas na encosta ----------
const CASAP = gCasaP.scene; CASAP.children.forEach((c) => c.position.set(0, 0, 0));
const CASAS = [];
const PASSO = 0.12, ABERTO = -1.75;
CASAS_XZ.forEach(([x, z], ic) => {
  const y0 = PADS[ic].y, r = 0;
  const g = new THREE.Group(); for (const c of [...CASAP.children]) g.add(c.clone(true));
  g.updateMatrixWorld(true);
  const porta = g.getObjectByName('Casa2_Porta'), corpo = g.getObjectByName('Casa2');
  const bp = new THREE.Box3().setFromObject(porta);
  const px = (bp.min.x + bp.max.x) / 2, pz = bp.max.z;
  g.position.set(x, y0, z); g.rotation.y = r; sombra(g); scene.add(g); FADE.push(g);
  g.updateMatrixWorld(true);
  const cx = new THREE.Box3().setFromObject(g);
  const GX0 = cx.min.x - 0.2, GZ0 = cx.min.z - 0.2;
  const GW = Math.ceil((cx.max.x - cx.min.x + 0.4) / PASSO) + 1, GD = Math.ceil((cx.max.z - cx.min.z + 0.4) / PASSO) + 1;
  const ALT = new Float32Array(GW * GD);
  const pos = corpo.geometry.attributes.position, idx = corpo.geometry.index, m = corpo.matrixWorld;
  const A = new THREE.Vector3(), B = new THREE.Vector3(), Cc = new THREE.Vector3();
  const n = idx ? idx.count : pos.count;
  for (let t = 0; t < n; t += 3) {
    A.fromBufferAttribute(pos, idx ? idx.getX(t) : t).applyMatrix4(m); B.fromBufferAttribute(pos, idx ? idx.getX(t + 1) : t + 1).applyMatrix4(m); Cc.fromBufferAttribute(pos, idx ? idx.getX(t + 2) : t + 2).applyMatrix4(m);
    const i0 = Math.max(0, Math.floor((Math.min(A.x, B.x, Cc.x) - GX0) / PASSO)), i1 = Math.min(GW - 1, Math.ceil((Math.max(A.x, B.x, Cc.x) - GX0) / PASSO));
    const k0 = Math.max(0, Math.floor((Math.min(A.z, B.z, Cc.z) - GZ0) / PASSO)), k1 = Math.min(GD - 1, Math.ceil((Math.max(A.z, B.z, Cc.z) - GZ0) / PASSO));

    if (tecla.KeyD || tecla.ArrowRight) mv.add(rt); if (tecla.KeyA || tecla.ArrowLeft) mv.sub(rt);
    if (JOY.on && Math.hypot(JOY.x, JOY.y) > 0.15) mv.addScaledVector(fw, -JOY.y).addScaledVector(rt, JOY.x);
    if (mv.lengthSq() > 0) alvoToque = null;
    else if (alvoToque) { mv.subVectors(alvoToque, jog.o.position).setY(0); if (mv.length() < 0.15) { alvoToque = null; mv.set(0, 0, 0); } }
  }
  for (const c of CASAS) { c.ang += ((c.aberta ? ABERTO : 0) - c.ang) * Math.min(1, dt * 5); c.porta.rotation.y = c.ang; }
  const pj = jog.o.position;
  const passagem = (x, z) => CASAS.some((c) => { if (!(c.aberta && c.ang < -1.2) || pj.y > c.y0 + 0.3) return false; const [lx, lz] = c.local(x, z); return Math.abs(lx - c.px) < 0.45 && lz > c.pz - 1.0 && lz < c.pz + 0.8; });
  const naFolha = (x, z) => CASAS.some((c) => { if (c.ang > -0.3) return false; const b = new THREE.Box3().setFromObject(c.porta).expandByScalar(0.18); return x > b.min.x && x < b.max.x && z > b.min.z && z < b.max.z; });
  let andou = false;
  if (mv.lengthSq() > 0) {
    mv.normalize(); const corre = tecla.ShiftLeft || tecla.ShiftRight || (JOY.on && Math.hypot(JOY.x, JOY.y) > 0.9) || (alvoToque && alvoToque.distanceTo(jog.o.position) > 6);
    const v = (corre ? 5.2 : 2.4) * dt, p = jog.o.position;
    const nx = p.x + mv.x * v, nz = p.z + mv.z * v;
    const moveis = [[andante, 0.6], [ceifeiro, 0.5], [atadeira, 0.5], [carregador, 0.5], ...ovelhas.map((o) => [o, 0.7])];
    const rente = p.y - terreno(p.x, p.z) < 0.4;
    const livreJ = (x, z) => naArea(x, z) && !naFolha(x, z) && (!rente || !bate(x, z)) &&
      (passagem(x, z) || alturaEm(x, z) <= p.y + 0.5) &&
      !moveis.some(([m, r]) => { const d = Math.hypot(m.o.position.x - x, m.o.position.z - z); return d < r && d < Math.hypot(m.o.position.x - p.x, m.o.position.z - p.z); });
    const x0 = p.x, z0 = p.z;
    if (livreJ(nx, nz)) { p.x = nx; p.z = nz; }
    else if (livreJ(nx, p.z)) p.x = nx;
    else if (livreJ(p.x, nz)) p.z = nz;
    else alvoToque = null;
    andou = Math.hypot(p.x - x0, p.z - z0) > v * 0.3;
    const ang = Math.atan2(mv.x, mv.z); let d = ang - jog.o.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); jog.o.rotation.y += d * Math.min(1, dt * 12);
    if (andou) jog.toca(corre ? 'Correr' : 'Andar');
  }
  // altura: chão inclinado, degrau, escada e terraço; pulo e queda
  const pas = passagem(pj.x, pj.z);
  const chaoJ = pas ? Math.max(terreno(pj.x, pj.z), CASAS.find((c) => c.aberta)?.y0 ?? 0) : alturaEm(pj.x, pj.z);
  if (jogNoChao && pj.y - chaoJ > 0.5) jogNoChao = false;
  if (jogNoChao) pj.y += (chaoJ - pj.y) * Math.min(1, dt * 18);
  else { jogVy -= 14 * dt; pj.y += jogVy * dt; if (pj.y <= chaoJ) { pj.y = chaoJ; jogVy = 0; jogNoChao = true; } }
  if (!jogNoChao) jog.toca(jogVy > 0 ? 'Pulo_Ar' : 'Pulo_Queda');
  else if (!andou) jog.toca('Parado');
  for (const c of CASAS) {
    if (!(c.aberta && c.ang < -1.2) || fora) continue;
    const [lx, lz] = c.local(pj.x, pj.z);
    if (Math.abs(lx - c.px) < 0.45 && lz < c.pz - 0.45) entrarCasa(c);
  }
  const [ju, jv] = UV(pj.x, pj.z);
  saida = jv > V1 - 2.5 ? 'alto' : jv < V0 + 2.2 ? 'baixo' : null;
  portaPerto = CASAS.find((c) => Math.abs(pj.y - c.y0) < 0.3 && c.mundo(c.px, c.pz).setY(0).distanceTo(V3(pj.x, 0, pj.z)) < 2.0) || null;
  if (saida === 'alto') botao.textContent = (toqueTela ? '' : 'E: ') + 'seguir para Jerusalém';
  else if (saida === 'baixo') botao.textContent = (toqueTela ? '' : 'E: ') + 'voltar para Betânia';
  else if (portaPerto) botao.textContent = (toqueTela ? '' : 'E: ') + (portaPerto.aberta ? 'fechar a porta' : 'abrir a porta');
  botao.style.display = (saida || portaPerto) && !fora ? 'block' : 'none';

  // o trigo se abre em volta de quem anda por dentro
  UT.uP.value[0].copy(pj); UT.uP.value[1].copy(ceifeiro.o.position); UT.uP.value[2].copy(atadeira.o.position); UT.uP.value[3].copy(carregador.o.position);
  ceifeiroPasso(dt, t); atadeiraPasso(dt, t); carregadorPasso(dt, t); debulhadorPasso(dt, t); joeiradeiraPasso(dt, t); partPasso(dt);
  // boi da carroça: descansa e rumina
  if (rnd() < dt * 0.08) boiCarro.toca(boiCarro.atual === 'Comer' ? 'Parado' : 'Comer');
  if (rnd() < dt * 0.06) jumenta.toca(jumenta.atual === 'Comer' ? 'Parado' : 'Comer');
  { const c = jumenta.o.position.clone().add(V3(0, 0.95, 0)).addScaledVector(frente(jumenta), 0.55); barra(CORDA_J, ESTACA.clone().add(V3(0, 0.95, 0)), c); }

  // ovelhas
  for (const o of ovelhas) {
    if (o.alvo) {
      const d = new THREE.Vector3().subVectors(o.alvo, o.o.position).setY(0);
      if (d.length() < 0.1) { o.alvo = null; o.espera = 2 + rnd() * 5; o.toca(rnd() < 0.6 ? 'Comer' : 'Parado'); }
      else {
        d.normalize();
        const fr = o.o.position.clone().addScaledVector(d, 0.3);
        if (ovelhas.some((b) => b !== o && b.o.position.distanceTo(fr) < 0.75)) { o.alvo = null; o.espera = 1 + rnd() * 2; o.toca('Parado'); }
        else { o.o.position.addScaledVector(d, 0.45 * dt); chao(o); let k = Math.atan2(d.x, d.z) - o.o.rotation.y; k = Math.atan2(Math.sin(k), Math.cos(k)); o.o.rotation.y += k * Math.min(1, dt * 5); }
      }
    } else if ((o.espera -= dt) <= 0) {
      const a = rnd() * 6.28, r = rnd() * PASTO.r; o.alvo = V3(PASTO.x + Math.cos(a) * r, 0, PASTO.z + Math.sin(a) * r); o.toca('Andar');
    }
  }
  // passante na estrada
  if (pausa > 0) { pausa -= dt; andante.toca('Parado'); }
  else if (jog.o.position.distanceTo(andante.o.position) < 1.1) andante.toca('Parado');
  else {
    andante.toca('Andar');
    tRota += sentido * dt * 1.1 / rota.getLength();
    if (tRota > tRotaMax || tRota < tRotaMin) { tRota = THREE.MathUtils.clamp(tRota, tRotaMin, tRotaMax); sentido *= -1; pausa = 3; }
  }
  {
    const pr = rota.getPointAt(tRota), tg = rota.getTangentAt(tRota).multiplyScalar(sentido), lat = V3(-tg.z, 0, tg.x).multiplyScalar(0.9);
    andante.o.position.copy(pr).add(lat); chao(andante);
    let k = Math.atan2(tg.x, tg.z) - andante.o.rotation.y; k = Math.atan2(Math.sin(k), Math.cos(k)); andante.o.rotation.y += k * Math.min(1, dt * 5);
  }
  // os dois do terreiro olham para o jogador quando ele chega perto
  for (const n of [conv1, conv2]) {
    const d = jog.o.position.distanceTo(n.o.position);
    const a = d < 3.5 ? Math.atan2(jog.o.position.x - n.o.position.x, jog.o.position.z - n.o.position.z) : n.r0;
    lerpAng(n.o, a, Math.min(1, dt * 3));
  }

  // câmera: limites em (u, v); afastada, anda menos
  dist += (distAlvo - dist) * Math.min(1, dt * 6);
  // o quadro não passa da sangria (árvores e pedras em volta); mas o jogador nunca sai da parte central da tela
  const hw = 0.2126 * dist * camera.aspect, hd = 0.37 * dist;
  const lim = (x, a, b) => a > b ? (a + b) / 2 : THREE.MathUtils.clamp(x, a, b);
  let cu = lim(ju, U0 - 7 + hw, U1 + 7 - hw), cv = lim(jv, V0 - 6 + hd, V1 + 12 - hd);
  cu = THREE.MathUtils.clamp(cu, ju - hw * 0.55, ju + hw * 0.55); cv = THREE.MathUtils.clamp(cv, jv - hd * 0.5, jv + hd * 0.5);
  const [fx, fz] = XZ(cu, cv);
  foco.x += (fx - foco.x) * Math.min(1, dt * 3); foco.z += (fz - foco.z) * Math.min(1, dt * 3);
  foco.y += (terreno(foco.x, foco.z) * 0.6 + pj.y * 0.3 - foco.y) * Math.min(1, dt * 3);
  camera.position.copy(foco).addScaledVector(DIR, dist); camera.lookAt(foco);
  scene.fog.near = dist + 16; scene.fog.far = dist + 75;
  sun.position.set(foco.x + 14, foco.y + 24, foco.z + 9); sun.target.position.copy(foco);

  atualizaFade();
  renderer.render(scene, camera);
};
renderer.setAnimationLoop(() => laco());
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
</script>
