<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#cdd6da">
<title>Diorama das amendoeiras</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd8dc; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; opacity: 0; transition: opacity .8s; }
  canvas.on { opacity: 1; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Diorama: uma ilha flutuante pequena com as amendoeiras do Tripo.
// Câmera travada de frente (quase isométrica): gira só um pouco, para a copa achatada nunca aparecer de lado.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#b9cfdc'); gr.addColorStop(0.6, '#d6dde0'); gr.addColorStop(1, '#e6e2d8');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
scene.fog = new THREE.Fog(0xd6dde0, 90, 170);

// manhã no deserto: sol branco-quente do leste, luz rebatida da areia
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0xc9a47a, 1.35));
const sun = new THREE.DirectionalLight(0xffe4bc, 3.2);
sun.position.set(9, 12, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 50 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun);

let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const tl = new THREE.TextureLoader();
const tex = (url, rep) => {
  const t = tl.load(url);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (rep) t.repeat.set(rep, rep);
  return t;
};

// ---------- a ilha: contorno irregular, topo de grama, paredão de rocha ----------
const W = 13, D = 7.5;                       // meia largura (x) e meia profundidade (z)
const borda = [];
const NB = 64;
for (let i = 0; i < NB; i++) {
  const a = (i / NB) * Math.PI * 2;
  const cx = Math.cos(a), sz = Math.sin(a);
  const sq = 1 / Math.pow(Math.pow(Math.abs(cx), 4) + Math.pow(Math.abs(sz), 4), 0.25); // retângulo arredondado
  const r = sq * (0.9 + 0.12 * Math.sin(a * 5 + 1.3) + 0.06 * Math.sin(a * 11) + 0.05 * (rnd() - 0.5));
  borda.push(new THREE.Vector2(cx * W * r, sz * D * r));
}
const dentro = (x, z, m = 0) => {               // ponto dentro do contorno (com margem)
  let c = false;
  for (let i = 0, j = NB - 1; i < NB; j = i++) {
    const a = borda[i], b = borda[j];
    if ((a.y > z) !== (b.y > z) && x < ((b.x - a.x) * (z - a.y)) / (b.y - a.y) + a.x) c = !c;
  }
  if (!c || m === 0) return c;
  for (const p of borda) if (Math.hypot(p.x - x, p.y - z) < m) return false;
  return true;
};

const grama = tex('../figueiras/tex/chao_grama_v3.webp');
{
  const shape = new THREE.Shape(borda);
  const geo = new THREE.ShapeGeometry(shape, 8);
  geo.rotateX(-Math.PI / 2);                   // shape (x, y) -> chão (x, 0, -y), como o paredão
  const uv = geo.attributes.uv, pos = geo.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / 5, pos.getZ(i) / 5);
  geo.computeVertexNormals();
  const topo = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: grama, roughness: 1, side: THREE.DoubleSide }));
  topo.receiveShadow = true;
  scene.add(topo);
}

// paredão: faixa vertical irregular sob a borda, facetada, com a textura de rocha
const rocha = tex('../vila-betania/tex/rocha_encosta.webp');
const matRocha = new THREE.MeshStandardMaterial({ map: rocha, color: 0xd8cbb4, roughness: 1, flatShading: true });
{
  const pos = [], uv = [], idx = [];
  const NIV = 5;                              // anéis de cima para baixo, encolhendo para dentro
  for (let k = 0; k <= NIV; k++) {
    const t = k / NIV;
    const enc = 1 - 0.55 * t * t;             // a base afina (ilha suspensa)
    const y = -0.02 - t * 5.5;
    for (let i = 0; i <= NB; i++) {
      const p = borda[i % NB];
      const ruido = k === 0 ? 0 : (rnd() - 0.5) * 0.7;
      pos.push(p.x * enc + ruido, y + (k === 0 ? 0 : (rnd() - 0.5) * 0.5), -p.y * enc + ruido);
      uv.push(i / NB * 18, t * 2.2);
    }
  }
  for (let k = 0; k < NIV; k++) for (let i = 0; i < NB; i++) {
    const a = k * (NB + 1) + i, b = a + 1, c = a + NB + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const parede = new THREE.Mesh(geo, matRocha);
  matRocha.side = THREE.DoubleSide;
  parede.castShadow = true; parede.receiveShadow = true;
  scene.add(parede);
}

// blocos e pilares de rocha facetados na borda (como na referência), mais altos ao fundo
function bloco(x, z, h, r, inclina = 0) {
  const g = new THREE.CylinderGeometry(r * 0.8, r, h, 6 + Math.floor(rnd() * 3), 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    p.setX(i, p.getX(i) * (0.85 + rnd() * 0.3));
    p.setZ(i, p.getZ(i) * (0.85 + rnd() * 0.3));
    if (p.getY(i) > h / 2 - 0.01) p.setY(i, p.getY(i) + (rnd() - 0.5) * r * 0.18);
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, matRocha);
  m.position.set(x, h / 2 - h * 0.35, z);
  m.rotation.set(inclina * (rnd() - 0.5), rnd() * Math.PI, inclina * (rnd() - 0.5));
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
}
for (let i = 0; i < NB; i += 3) {
  const p = borda[i];
  const z = -p.y;
  const atras = z < -D * 0.45;
  const h = atras ? 2.5 + rnd() * 3.5 : 0.8 + rnd() * 1.6;
  if (!atras && rnd() < 0.35) continue;       // na frente, menos blocos (não tampar a vista)
  bloco(p.x * 0.97, z * 0.97, h, 0.9 + rnd() * 0.9, 0.15);
}
// dois pilares grandes soltos ao fundo
bloco(-9.5, -11.5, 13, 2.6, 0.08);
bloco(6.5, -13, 16, 3.2, 0.06);
bloco(14.5, -6.5, 9, 2.0, 0.1);

// ---------- trilha de terra serpenteando pela ilha ----------
const curva = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-11.6, 0, 2.0), new THREE.Vector3(-7, 0, 3.0), new THREE.Vector3(-2, 0, 1.0),
  new THREE.Vector3(3, 0, -0.6), new THREE.Vector3(8, 0, 0.6), new THREE.Vector3(11.4, 0, -1.2),
]);
{
  const N = 120, L = 1.25;
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const p = curva.getPointAt(t), tg = curva.getTangentAt(t);
    const nx = -tg.z, nz = tg.x;
    const w = L * (0.85 + 0.25 * Math.sin(t * 17));
    pos.push(p.x + nx * w, 0.03, p.z + nz * w, p.x - nx * w, 0.03, p.z - nz * w);
    uv.push(0, t * 14, 1, t * 14);
  }
  for (let i = 0; i < N; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const trilha = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex('../betania/tex/estrada_terra.webp'), roughness: 1, side: THREE.DoubleSide }));
  trilha.receiveShadow = true;
  scene.add(trilha);
}
const naTrilha = (x, z, m) => {
  for (let i = 0; i <= 60; i++) { const p = curva.getPointAt(i / 60); if (Math.hypot(p.x - x, p.z - z) < m) return true; }
  return false;
};

// ---------- árvores e arbustos ----------
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const comRetentativa = async (url) => {
  for (let k = 0; ; k++) {
    try { return await loader.loadAsync(url); } catch (e) { if (k >= 3) throw e; await new Promise((r) => setTimeout(r, 400 * (k + 1))); }
  }
};
const carregar = async (url) => {
  const g = await comRetentativa(url);
  const m = {};
  for (const n of g.scene.children) {
    n.position.set(0, 0, 0);
    n.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    m[n.name] = n;
  }
  return m;
};
const [arv, est, tom, sar, flo] = await Promise.all([
  carregar('../amendoeiras-floridas/amendoeiras_floridas.glb'),
  carregar('../esteva/esteva.glb'), carregar('../tomilho/tomilho.glb'),
  carregar('../sarcopoterium/sarcopoterium.glb'), carregar('../flores/flores.glb'),
]);
const ocupado = [];
const livre = (x, z, r) => ocupado.every((o) => Math.hypot(o.x - x, o.z - z) > o.r + r);
const por = (modelo, x, z, yaw, k, r) => {
  const n = modelo.clone();
  n.position.set(x, 0, z); n.rotation.y = yaw; n.scale.setScalar(k);
  scene.add(n); ocupado.push({ x, z, r });
};

// amendoeiras: sempre de frente para a câmera (a copa é achatada), giro de no máximo ±14°
const ARV = [
  [-10.5, -3.6, 1.0, 'Amendoeira1_Copa'], [-6.2, -1.6, 0.85, 'Amendoeira2_Retorcida'],
  [-1.8, -4.4, 1.1, 'Amendoeira1_Copa'], [2.6, -2.6, 0.9, 'Amendoeira2_Retorcida'],
  [7.0, -4.6, 1.05, 'Amendoeira1_Copa'], [10.8, -2.4, 0.8, 'Amendoeira2_Retorcida'],
  [-3.6, 4.3, 0.75, 'Amendoeira2_Retorcida'], [5.4, 3.6, 0.8, 'Amendoeira1_Copa'],
];
for (const [x, z, k, nome] of ARV) por(arv[nome], x, z, (rnd() - 0.5) * 0.5, k, 1.3 * k);

// arbustos (são redondos, giram à vontade) e flores
const ARB = [
  est.Esteva1_Pequena_Florida, est.Esteva2_Media_Florida, est.Esteva3_Larga_Florida,
  tom.Tomilho1_Pequena_Florida, tom.Tomilho2_Media_Florida, sar.Sarco1_Pequena_Primavera, sar.Sarco2_Media_Primavera,
].filter(Boolean);
const FLO = Object.keys(flo).filter((k) => /Tufo|Touceira/.test(k)).map((k) => flo[k]);
for (let i = 0, n = 0; i < 400 && n < 26; i++) {
  const x = (rnd() * 2 - 1) * W, z = (rnd() * 2 - 1) * D;
  if (!dentro(x, -z, 1.0) || naTrilha(x, z, 1.9) || !livre(x, z, 0.8)) continue;
  por(ARB[Math.floor(rnd() * ARB.length)], x, z, rnd() * Math.PI * 2, 0.8 + rnd() * 0.5, 0.7); n++;
}
for (let i = 0, n = 0; i < 600 && n < 40; i++) {
  const x = (rnd() * 2 - 1) * W, z = (rnd() * 2 - 1) * D;
  if (!dentro(x, -z, 0.6) || naTrilha(x, z, 1.5) || !livre(x, z, 0.3)) continue;
  por(FLO[Math.floor(rnd() * FLO.length)], x, z, rnd() * Math.PI * 2, 0.9 + rnd() * 0.4, 0.25); n++;
}

// tufos de grama instanciados (um draw call), só em cima da ilha e fora da trilha
{
  const t = tl.load('../figueiras/tex/grama_tufo.webp'); t.colorSpace = THREE.SRGBColorSpace;
  const a = new THREE.PlaneGeometry(0.62, 0.62); a.translate(0, 0.29, 0);
  const b = a.clone(); b.rotateY(Math.PI / 2);
  const geo = mergeGeometries([a, b]);
  const nn = geo.attributes.normal;
  for (let i = 0; i < nn.count; i++) nn.setXYZ(i, 0, 1, 0);
  const mat = new THREE.MeshStandardMaterial({ map: t, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 1 });
  const N = 320, grass = new THREE.InstancedMesh(geo, mat, N);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), c = new THREE.Color();
  let k = 0;
  for (let i = 0; i < 5000 && k < N; i++) {
    const x = (rnd() * 2 - 1) * W, z = (rnd() * 2 - 1) * D;
    if (!dentro(x, -z, 0.3) || naTrilha(x, z, 1.3)) continue;
    p.set(x, 0, z);
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * Math.PI);
    const e = 0.5 + rnd() * 0.7;
    s.set(e, e * (0.8 + rnd() * 0.5), e);
    grass.setMatrixAt(k, m4.compose(p, q, s));
    const tt = 0.82 + rnd() * 0.25;
    grass.setColorAt(k, c.setRGB(tt, tt * (0.96 + rnd() * 0.06), tt * 0.9));
    k++;
  }
  grass.count = k;
  grass.receiveShadow = true;
  scene.add(grass);
}

// ---------- um personagem de 1,7 m na trilha, para comparar a escala ----------
let mixer = null;
{
  const g = await comRetentativa('../personagens/rapaz.glb');
  const p = curva.getPointAt(0.42);
  g.scene.position.set(p.x, 0, p.z + 0.2);
  g.scene.rotation.y = 0.35;
  g.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(g.scene);
  mixer = new THREE.AnimationMixer(g.scene);
  const c = g.animations.find((a) => a.name === 'Parado') || g.animations[0];
  if (c) mixer.clipAction(c).play();
}

// ---------- nuvens facetadas em volta da ilha, andando devagar ----------
const nuvens = [];
{
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true, emissive: 0xe8eef2, emissiveIntensity: 0.35 });
  const LUG = [[-16, -3.5, 3], [-11, -6.5, 6], [16, -4, 2], [12, -6, 6.5], [-2, -8, 5], [3, 5.5, -14], [-8, 4, -13]];
  for (const [x, y, z] of LUG) {
    const g = new THREE.Group();
    const n = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
      const r = 0.6 + rnd() * 0.7;
      const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), mat);
      m.position.set((i - n / 2) * 1.3 + rnd() * 0.5, rnd() * 0.6, (rnd() - 0.5) * 1.2);
      m.scale.y = 0.7;
      g.add(m);
    }
    g.position.set(x, y, z);
    g.userData.base = x; g.userData.vel = 0.15 + rnd() * 0.2; g.userData.fase = rnd() * 10;
    scene.add(g); nuvens.push(g);
  }
}

// ---------- câmera travada: quase isométrica, de frente ----------
const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.5, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
const AZ = 0.30, POL = 0.86;                  // ±17° de giro; ~40° acima do horizonte
controls.minAzimuthAngle = -AZ; controls.maxAzimuthAngle = AZ;
controls.minPolarAngle = POL - 0.12; controls.maxPolarAngle = POL + 0.08;
controls.minDistance = 26; controls.maxDistance = 95;
controls.screenSpacePanning = false;
controls.addEventListener('change', () => {   // não deixa arrastar a ilha para fora da tela
  controls.target.x = THREE.MathUtils.clamp(controls.target.x, -8, 8);
  controls.target.z = THREE.MathUtils.clamp(controls.target.z, -4, 4);
  controls.target.y = 0;
});
function enquadrar() {
  const retrato = innerHeight > innerWidth;
  const dist = retrato ? 88 : 60;
  camera.position.setFromSphericalCoords(dist, POL, 0).add(controls.target);
  controls.update();
}
enquadrar();
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

const relogio = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = relogio.getDelta();
  const t = relogio.elapsedTime;
  if (mixer) mixer.update(dt);
  for (const g of nuvens) {
    g.position.x = g.userData.base + Math.sin(t * 0.05 * g.userData.vel * 6 + g.userData.fase) * 2.2;
    g.position.y += Math.sin(t * 0.4 + g.userData.fase) * 0.0015;
  }
  controls.update();
  renderer.render(scene, camera);
});
requestAnimationFrame(() => renderer.domElement.classList.add('on'));
</script>
</body>
</html>
