<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#86b9df">
<title>Currais e poços</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c6e0ef; font-family: system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; opacity: 0; transition: opacity .8s; }
  canvas.on { opacity: 1; }
  #dica { z-index: 2; position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); color: #4a3a28;
          background: #f6efe2d9; padding: 7px 13px; border-radius: 16px; font-size: 13px; transition: opacity 1.2s; pointer-events: none; white-space: nowrap; }
  #vistas { z-index: 2; position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  #vistas button { border: 0; border-radius: 14px; padding: 7px 12px; background: #f6efe2e6; color: #4a3a28; font-size: 13px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="vistas"><button data-v="tudo">Tudo</button><button data-v="pocos">Poços</button><button data-v="curral">Curral</button><button data-v="aprisco">Aprisco</button><button data-v="muretas">Muretas</button></div>
<div id="dica">Toque no poço, na porteira, na barreira, no feno ou na água</div>
<script type="module">
// Vila: curral (3 cercas + porteira), aprisco de pedra seca, manjedoura, bebedouro, muretas, arrimo e 3 poços.
// As peças vêm de vila.glb (biblioteca); aqui elas são montadas como o jogo vai montar (módulos de 2 m, postes nos nós).
// Poço: toque -> o balde desce, enche lá embaixo, sobe e é despejado no cântaro, que enche.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const sky = (() => {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#86b9df'); gr.addColorStop(0.55, '#c6e0ef'); gr.addColorStop(1, '#f2e6d0');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
scene.background = sky;
scene.fog = new THREE.Fog(0xeae4d6, 30, 80);
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0xc9a47a, 1.35));
const sun = new THREE.DirectionalLight(0xffe4bc, 3.2);
sun.position.set(14, 13, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 0.5, far: 50 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 150);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 1.5; controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.47;

// ------------------------------------------------------------------ peças
const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('vila.glb');
const N = {};
gltf.scene.traverse((o) => { if (o.name) N[o.name] = o; });
const baseMat = N.Cerca_Varas.material;

function liquidMat(amp, flow, dark = 1) {
  const m = baseMat.clone();
  m.userData.u = { uTime: { value: 0 } };
  m.color.setScalar(dark);
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, m.userData.u);
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader
      .replace('#include <uv_vertex>', `#include <uv_vertex>
#ifdef USE_MAP
 vMapUv.x += sin(uTime * 0.4) * ${flow.toFixed(4)};
#endif`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        transformed.y += ${amp.toFixed(4)} * (sin(position.x * 13.0 + uTime * 2.1) + cos(position.z * 11.0 + uTime * 1.7));`);
  };
  m.customProgramCacheKey = () => 'liq' + amp + flow + dark;
  return m;
}
const matAgua = liquidMat(0.004, 0.006);
const matPoco = liquidMat(0.006, 0.008, 1.0);
const liquids = [matAgua, matPoco];

// grupo = cópia de várias peças, guardando o deslocamento de cada uma em relação à origem (a primeira peça)
function group(names, x, z, rot = 0, origin = null) {
  const g = new THREE.Group();
  const o0 = (origin ? N[origin] : N[names[0]]).position;
  const parts = {};
  for (const n of names) {
    const src = N[n]; if (!src) { console.warn('falta', n); continue; }
    const c = src.clone();
    c.position.copy(src.position).sub(o0);
    c.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
    g.add(c); parts[n] = c;
  }
  g.position.set(x, 0, z); g.rotation.y = rot;
  scene.add(g);
  g.userData.parts = parts;
  return g;
}
// módulo de 2 m entre dois nós (a, b em metros no plano xz)
function edge(name, ax, az, bx, bz) {
  return group([name], ax, az, Math.atan2(-(bz - az), bx - ax));
}
const clickables = [];
const tickers = [];
function clickable(g, fn) { g.traverse((o) => { if (o.isMesh) { o.userData.act = fn; clickables.push(o); } }); }

// ------------------------------------------------------------------ CURRAL (6 x 4 m), centrado em (-9, -6)
{
  const X = [-12, -10, -8, -6], Zn = -8, Zs = -4;
  for (let i = 0; i < 3; i++) edge('Cerca_Varas', X[i], Zn, X[i + 1], Zn);
  edge('Cerca_Rustica', X[0], Zs, X[1], Zs);
  edge('Cerca_Rustica', X[2], Zs, X[3], Zs);
  for (const x of [X[0], X[3]]) { edge('Cerca_Trancada', x, Zn, x, Zn + 2); edge('Cerca_Trancada', x, Zn + 2, x, Zs); }
  for (const x of X) group([x === X[0] || x === X[3] ? 'Cerca_Rustica_Poste' : 'Cerca_Varas_Poste'], x, Zn);
  for (const x of X) group(['Cerca_Rustica_Poste'], x, Zs);
  group(['Cerca_Trancada_Poste'], X[0], Zn + 2); group(['Cerca_Trancada_Poste'], X[3], Zn + 2);
  const gate = group(['Porteira_Amarras', 'Porteira_Folha'], X[1], Zs);
  const folha = gate.userData.parts.Porteira_Folha;
  let aberta = false, ang = 0;
  clickable(gate, () => { aberta = !aberta; });
  tickers.push((dt) => { ang += ((aberta ? 1.75 : 0) - ang) * Math.min(1, dt * 2.5); folha.rotation.y = ang; });
  const manj = group(['Manjedoura', 'Manjedoura_Feno', 'Manjedoura_FenoChao'], -11, -7.2, 0);
  const feno = manj.userData.parts.Manjedoura_Feno; let fenoAlvo = 1, fenoK = 1;
  clickable(manj, () => { fenoAlvo = fenoAlvo > 0.5 ? 0.15 : 1; });
  tickers.push((dt) => { fenoK += (fenoAlvo - fenoK) * Math.min(1, dt * 1.5); feno.scale.set(0.7 + 0.3 * fenoK, fenoK, 0.7 + 0.3 * fenoK); });
  const beb = group(['Bebedouro', 'Bebedouro_Agua'], -7.4, -6.6, Math.PI / 2);
  const agua = beb.userData.parts.Bebedouro_Agua; agua.material = matAgua; agua.castShadow = false;
  const y0 = agua.position.y; let nivel = 1, nivelAlvo = 1;
  clickable(beb, () => { nivelAlvo = nivelAlvo > 0.5 ? 0 : 1; });
  tickers.push((dt) => { nivel += (nivelAlvo - nivel) * Math.min(1, dt * 0.8); agua.position.y = y0 - 0.26 * (1 - nivel); });
}

// ------------------------------------------------------------------ APRISCO (6 x 6 m) de pedra seca, centrado em (6, -9)
{
  const X = [3, 5, 7, 9], Z = [-12, -10, -8, -6];
  const muro = (i) => (i % 2 ? 'Aprisco_Muro_B' : 'Aprisco_Muro_A');
  for (let i = 0; i < 3; i++) edge(muro(i), X[i], Z[0], X[i + 1], Z[0]);            // fundo
  for (let i = 0; i < 3; i++) edge(muro(i + 1), X[0], Z[i], X[0], Z[i + 1]);        // lado oeste
  for (let i = 0; i < 3; i++) edge(muro(i), X[3], Z[i + 1], X[3], Z[i]);            // lado leste
  edge('Aprisco_Muro_A', X[0], Z[3], X[1], Z[3]); edge('Aprisco_Muro_B', X[3], Z[3], X[2], Z[3]);   // frente, com a entrada no meio
  for (const [x, z] of [[X[0], Z[0]], [X[3], Z[0]], [X[0], Z[3]], [X[3], Z[3]]]) group(['Aprisco_Canto'], x, z, Math.random() * 6);
  group(['Aprisco_Ombreira'], X[1], Z[3]);
  group(['Aprisco_Ombreira'], X[2], Z[3], Math.PI);
  const bar = group(['Aprisco_Barreira'], X[1] + 0.3, Z[3] - 0.15);
  let fechada = true, k = 1;
  clickable(bar, () => { fechada = !fechada; });
  tickers.push((dt) => {
    k += ((fechada ? 1 : 0) - k) * Math.min(1, dt * 2);
    bar.position.set(X[1] + 0.3 - (1 - k) * 0.2, 0, Z[3] - 0.15 + (1 - k) * 1.0);
    bar.rotation.y = (1 - k) * 1.2;
  });
}

// ------------------------------------------------------------------ MURETAS na beira do caminho e ARRIMO
group(['Mureta_Fim'], -6, 6, Math.PI);
edge('Mureta_Reta', -6, 6, -4, 6);
edge('Mureta_Reta', -4, 6, -2, 6);
edge('Mureta_Rampa', -2, 6, 0, 6);
edge('Arrimo_Reta', 2, 10, 4, 10);
edge('Arrimo_Reta', 4, 10, 6, 10);
// barranco atrás do arrimo (terra simples, só para ver o uso)
{
  const geo = new THREE.BoxGeometry(4.2, 1.1, 3); geo.translate(4, 0.55, 8.3);
  const m = new THREE.MeshStandardMaterial({ color: 0xb79a72, roughness: 1, flatShading: true });
  const b = new THREE.Mesh(geo, m); b.receiveShadow = true; scene.add(b);
}

// ------------------------------------------------------------------ POÇOS (3 sementes) com animação
const holes = [];
const wells = [];
const WELLPOS = [[-5, 0], [0, 0.4], [5, 0]];
for (let s = 1; s <= 3; s++) {
  const pre = 'Poco_' + s;
  const names = Object.keys(N).filter((n) => n === pre || n.startsWith(pre + '_') || n.startsWith('NPC_' + pre));
  const [x, z] = WELLPOS[s - 1];
  const g = group(names, x, z, 0, pre);
  const P = g.userData.parts;
  for (const n of names) if (n.startsWith('NPC_')) P[n].visible = false;
  P[pre + '_Agua'].material = matPoco; P[pre + '_Agua'].castShadow = false;
  P[pre + '_BaldeAgua'].material = matAgua; P[pre + '_CantaroAgua'].material = matAgua;
  P[pre + '_BaldeAgua'].visible = false; P[pre + '_CantaroAgua'].visible = false;
  P[pre + '_Cano'].castShadow = false;
  holes.push({ x, z, r: s === 2 ? null : (s === 3 ? 0.41 : 0.49), sq: s === 2 ? 0.455 : 0 });
  const w = {
    g, P, s, t: 0, fase: 'parado',
    balde: P[pre + '_Balde'], baldeAgua: P[pre + '_BaldeAgua'], corda: P[pre + '_Corda'], sarilho: P[pre + '_Sarilho'],
    cant: P[pre + '_Cantaro'], cantAgua: P[pre + '_CantaroAgua'], agua: P[pre + '_Agua'],
  };
  w.top = w.corda.position.clone();
  w.b0 = w.balde.position.clone();
  w.yFundo = w.agua.position.y + 0.41 - 0.12;
  w.pour = w.cant.position.clone().lerp(w.b0, 0.3);
  w.pour.y = w.cant.position.y + 1.15;
  w.encher = 0;
  clickable(g, () => { if (w.fase === 'parado') { w.fase = 'desce'; w.t = 0; } });
  wells.push(w);
}
const ease = (t) => t * t * (3 - 2 * t);
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), DOWN = new THREE.Vector3(0, -1, 0);
function wellTick(w, dt) {
  w.t += dt;
  const b = w.balde;
  let tilt = 0;
  if (w.fase === 'desce') {
    const T = 2.6, k = ease(Math.min(1, w.t / T));
    b.position.copy(w.b0); b.position.y = w.b0.y + (w.yFundo - w.b0.y) * k;
    if (w.sarilho) w.sarilho.rotation.x = -k * 14;
    if (w.t > T) { w.fase = 'enche'; w.t = 0; }
  } else if (w.fase === 'enche') {
    b.position.y = w.yFundo + Math.sin(w.t * 9) * 0.02 * (1 - w.t);
    if (w.t > 0.5) w.baldeAgua.visible = true;
    if (w.t > 1.0) { w.fase = 'sobe'; w.t = 0; }
  } else if (w.fase === 'sobe') {
    const T = 3.2, k = ease(Math.min(1, w.t / T));
    b.position.copy(w.b0); b.position.y = w.yFundo + (w.b0.y - w.yFundo) * k;
    b.position.x += Math.sin(w.t * 5) * 0.015;
    if (w.sarilho) w.sarilho.rotation.x = -(1 - k) * 14;
    if (w.t > T) { w.fase = 'leva'; w.t = 0; }
  } else if (w.fase === 'leva') {
    const T = 1.4, k = ease(Math.min(1, w.t / T));
    b.position.lerpVectors(w.b0, w.pour, k);
    if (w.t > T) { w.fase = 'despeja'; w.t = 0; }
  } else if (w.fase === 'despeja') {
    const T = 2.2, k = Math.min(1, w.t / T);
    b.position.copy(w.pour);
    tilt = Math.sin(Math.min(1, k * 1.4) * Math.PI / 2) * 1.6 * (k < 0.85 ? 1 : (1 - k) / 0.15);
    if (k > 0.25) { w.cantAgua.visible = true; w.encher = Math.min(1, (k - 0.25) / 0.55); }
    if (k > 0.7) w.baldeAgua.visible = false;
    if (w.t > T) { w.fase = 'volta'; w.t = 0; }
  } else if (w.fase === 'volta') {
    const T = 1.4, k = ease(Math.min(1, w.t / T));
    b.position.lerpVectors(w.pour, w.b0, k);
    if (w.t > T) { w.fase = 'cheio'; w.t = 0; }
  } else if (w.fase === 'cheio') {
    if (w.t > 5) { w.encher = Math.max(0, 1 - (w.t - 5) / 1.5); if (w.encher === 0) { w.cantAgua.visible = false; w.fase = 'parado'; } }
  }
  // inclina o balde na direção do cântaro
  const dir = tmpA.copy(w.cant.position).sub(w.b0); dir.y = 0; dir.normalize();
  b.rotation.set(0, 0, 0);
  b.rotateOnAxis(tmpB.set(dir.z, 0, -dir.x), tilt);
  w.baldeAgua.position.copy(b.position); w.baldeAgua.quaternion.copy(b.quaternion);
  w.cantAgua.scale.set(1, Math.max(0.02, w.encher), 1);
  // a corda vai do topo até a alça do balde
  const d = tmpA.copy(b.position).sub(w.top);
  w.corda.position.copy(w.top);
  w.corda.scale.set(1, d.length(), 1);
  w.corda.quaternion.setFromUnitVectors(DOWN, d.normalize());
}

// ------------------------------------------------------------------ chão com os furos dos poços
{
  const shape = new THREE.Shape(); shape.absarc(0, 0, 60, 0, Math.PI * 2, false);
  for (const h of holes) {
    const p = new THREE.Path();
    if (h.sq) { const s = h.sq; p.moveTo(h.x - s, -h.z - s); p.lineTo(h.x - s, -h.z + s); p.lineTo(h.x + s, -h.z + s); p.lineTo(h.x + s, -h.z - s); p.closePath(); }
    else p.absarc(h.x, -h.z, h.r, 0, Math.PI * 2, true);
    shape.holes.push(p);
  }
  const geo = new THREE.ShapeGeometry(shape, 48);
  const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / 2.5, uv.getY(i) / 2.5);
  const tex = new THREE.TextureLoader().load('tex/chao_grama_v3.webp');
  tex.colorSpace = THREE.SRGBColorSpace; tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
  scene.add(ground);
}

// ------------------------------------------------------------------ vistas e toque
const VISTAS = {
  tudo: [[0, 0.5, -2], [0.35, 0.85, 1], 24],
  pocos: [[0, 0.8, 0.2], [0.3, 0.6, 1], 9],
  curral: [[-9, 0.4, -6], [0.4, 0.75, 1], 9.5],
  aprisco: [[6, 0.5, -9], [-0.3, 0.9, 1], 11],
  muretas: [[0, 0.4, 7.5], [0.2, 0.55, 1], 11],
};
let anim = null;
function vista(k) {
  const [t, d, dist] = VISTAS[k];
  const f = innerHeight > innerWidth ? 1.45 : 1;
  anim = { t: 0, t0: controls.target.clone(), p0: camera.position.clone(),
    t1: new THREE.Vector3(...t), p1: new THREE.Vector3(...d).normalize().multiplyScalar(dist * f).add(new THREE.Vector3(...t)) };
}
document.querySelectorAll('#vistas button').forEach((b) => b.onclick = () => vista(b.dataset.v));
{
  const [t, d, dist] = VISTAS.tudo; const f = innerHeight > innerWidth ? 1.45 : 1;
  controls.target.set(...t); camera.position.set(...d).normalize().multiplyScalar(dist * f).add(controls.target);
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 8) return;
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(clickables, false)[0];
  if (hit) { hit.object.userData.act(); document.getElementById('dica').style.opacity = 0; }
});
setTimeout(() => { document.getElementById('dica').style.opacity = 0; }, 9000);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta()), T = clock.elapsedTime;
  for (const m of liquids) m.userData.u.uTime.value = T;
  for (const f of tickers) f(dt);
  for (const w of wells) wellTick(w, dt);
  if (anim) {
    anim.t = Math.min(1, anim.t + dt / 1.2); const k = ease(anim.t);
    controls.target.lerpVectors(anim.t0, anim.t1, k); camera.position.lerpVectors(anim.p0, anim.p1, k);
    if (anim.t >= 1) anim = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
renderer.domElement.classList.add('on');
</script>
</body>
</html>
