<!doctype html>

<style>

</div>

<div id="dica">Toque no chão para andar até lá. Arraste para girar.</div>
<script type="module">
// PRÉ-VILA DE BETÂNIA, em formato de FASE (diorama compacto, estilo RPG): três patamares de terra presos por
// muros de arrimo de pedra, ligados por rampas (a estrada) e escadas.
//   nível 0 (leste, mais baixo): curral e aprisco; a estrada chega de Jericó por uma rampa.
//   nível 1 (centro): terreiro, 4 casas, cisterna, forno, eira.
//   nível 2 (oeste, mais alto): casa, trigal, túmulo de Lázaro; a estrada sai subindo o Monte das Oliveiras (fim da fase).
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { carregarKit, casaAleatoria, GLSL_NOISE } from '../casas/construtor_casas.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = (() => {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#7fb3dc'); gr.addColorStop(0.55, '#c3ddec'); gr.addColorStop(1, '#efe5d2');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
scene.fog = new THREE.Fog(0xe7dfcf, 100, 260);
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0xc9a47a, 1.3));
const sun = new THREE.DirectionalLight(0xffe4bc, 3.1);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04;
scene.add(sun); scene.add(sun.target);
const SUN_DIR = new THREE.Vector3(9, 11, 6).normalize();

const retrato = () => innerHeight > innerWidth;
const camera = new THREE.PerspectiveCamera(retrato() ? 40 : 30, innerWidth / innerHeight, 0.3, 800);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 4; controls.maxDistance = 95; controls.maxPolarAngle = Math.PI * 0.42;

const TL = new THREE.TextureLoader();
function tex(url, repeat = true) {
  const t = TL.load(url); t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
const T = {
  terra: tex('tex/terra_batida.webp'), seco: tex('tex/campo_seco.webp'), verde: tex('tex/campo_verde.webp'),
  estrada: tex('tex/estrada_terra.webp'), rocha: tex('../tumulo/tex/rocha_encosta.webp'), pedra: tex('../casas/tex/pedra.webp'),
  capim: tex('tex/capim_tufo.webp', false), horiz: tex('tex/horizonte.webp', false),
};
T.estrada.wrapS = THREE.ClampToEdgeWrapping;

// ------------------------------------------------------------------ util
function hsh(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z); let fx = x - ix, fz = z - iz;
  fx = fx * fx * (3 - 2 * fx); fz = fz * fz * (3 - 2 * fz);
  const a = hsh(ix, iz), b = hsh(ix + 1, iz), c = hsh(ix, iz + 1), d = hsh(ix + 1, iz + 1);
  return a + (b - a) * fx + (c - a) * fz + (a - b - c + d) * fx * fz;
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function dentro(pts, x, z) {
  let c = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, zi] = pts[i], [xj, zj] = pts[j];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) c = !c;
  }
  return c;
}
function distBorda(pts, x, z) {
  let best = 1e9;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [ax, az] = pts[j], [bx, bz] = pts[i]; const dx = bx - ax, dz = bz - az;
    const t = Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz)));
    best = Math.min(best, Math.hypot(ax + dx * t - x, az + dz * t - z));
  }
  return best;
}
// contorno de patamar: retângulo com a borda levemente irregular (pedra assentada à mão)
function contorno(x0, x1, z0, z1, semente, jit = 0.3, passo = 1.6) {
  const pts = []; let k = semente;
  const lado = (ax, az, bx, bz, nx, nz) => {
    const L = Math.hypot(bx - ax, bz - az), n = Math.max(1, Math.round(L / passo));
    for (let i = 0; i < n; i++) {
      const t = i / n; const j = i === 0 ? 0 : (hsh(k++, 3.7) - 0.5) * 2 * jit;
      pts.push([ax + (bx - ax) * t + nx * j, az + (bz - az) * t + nz * j]);
    }
  };
  lado(x0, z0, x1, z0, 0, -1); lado(x1, z0, x1, z1, 1, 0); lado(x1, z1, x0, z1, 0, 1); lado(x0, z1, x0, z0, -1, 0);
  return pts;
}

// ================================================================== DESENHO DA FASE
const NIVEIS = [
  { nome: 'baixo', pts: contorno(-24, 22, -17, 17, 11, 0.35), top: 0.0, fundo: -4.5, lado: 'rocha' },
  { nome: 'meio', pts: contorno(-23.6, 7, -16.6, 16.6, 23, 0.3), top: 1.4, fundo: 0.0, lado: 'pedra' },
  { nome: 'alto', pts: contorno(-23.2, -12, -16.2, 16.2, 37, 0.3), top: 2.8, fundo: 1.4, lado: 'pedra' },
];
// rampas (a estrada) e a escada: [x baixo, x alto, z centro, meia-largura, y baixo, y alto]
const RAMPAS = [
  { xa: 12.2, xb: 7.0, zc: 2.0, hw: 1.9, ya: 0.0, yb: 1.4 },
  { xa: -7.6, xb: -12.0, zc: 2.0, hw: 1.9, ya: 1.4, yb: 2.8 },
  { xa: 29.0, xb: 22.0, zc: 2.4, hw: 1.9, ya: null, yb: 0.0 },   // saída leste: desce para o vale
];
const ESCADA = { x: 7.0, z: 13.2, w: 1.7, n: 7, rise: 0.2, run: 0.34 };

// fora da fase: encosta (sobe forte para oeste = Monte das Oliveiras; desce para leste = vale de Jericó)
function fora(x, z) {
  let h = -3 + 5.8 * smooth(22, -23, x);
  if (x < -23) h = 2.8 + 0.34 * (-x - 23);
  if (x > 22) h = -3 - 0.05 * (x - 22);
  h += 1.2 * (vnoise(x * 0.05, z * 0.05) - 0.5) + 0.5 * (vnoise(x * 0.13 + 5, z * 0.13) - 0.5);
  // um degrau em volta do bloco da vila (os muros aparecem), menos onde a estrada entra e sai
  const dx = Math.max(-24 - x, 0, x - 22), dz = Math.max(-17 - z, 0, z - 17);
  const dOut = Math.hypot(dx, dz), perto = Math.abs(z - 2) < 6 && (x > 20 || x < -22);
  if (!perto) h -= 1.6 * (1 - smooth(0, 9, dOut)) * smooth(-23, -15, x) ** 0.3;
  // o morrote do túmulo (canto noroeste) se apoia num ombro de terra que desce suave
  const dtm = Math.hypot(x + 18, z + 19); h = Math.max(h, 2.75 - 0.3 * Math.max(0, dtm - 6));
  return h;
}
RAMPAS[2].ya = fora(RAMPAS[2].xa + 0.5, RAMPAS[2].zc);
function naRampa(x, z) {
  for (const r of RAMPAS) {
    const lo = Math.min(r.xa, r.xb), hi = Math.max(r.xa, r.xb);
    if (x >= lo && x <= hi && Math.abs(z - r.zc) <= r.hw) return r.ya + (r.yb - r.ya) * (x - r.xa) / (r.xb - r.xa);
  }
  return null;
}
// altura do chão em qualquer ponto (para apoiar peças e capim)
function nivel(x, z) {
  const r = naRampa(x, z); if (r !== null) return r;
  for (let i = NIVEIS.length - 1; i >= 0; i--) if (dentro(NIVEIS[i].pts, x, z)) return NIVEIS[i].top;
  return fora(x, z);
}
const L = { baixo: 0, meio: 1.4, alto: 2.8 };

// estrada: chega do leste, sobe ao terreiro, sobe ao patamar alto e sai a oeste pela encosta
const ESTRADA = [[90, 5], [40, 3.5], [29, 2.4], [22, 2.4], [12.2, 2], [7, 2], [-1, 2.2], [-7.6, 2], [-12, 2], [-18, 1.6], [-23.2, 1], [-34, -1.5], [-60, -6], [-120, -12]];
const RW = 1.9;
const RP = [];
{
  let s = 0;
  for (let i = 0; i < ESTRADA.length - 1; i++) {
    const [ax, az] = ESTRADA[i], [bx, bz] = ESTRADA[i + 1]; const Ls = Math.hypot(bx - ax, bz - az); const n = Math.ceil(Ls);
    for (let k = 0; k < n; k++) { const t = k / n; RP.push({ x: ax + (bx - ax) * t, z: az + (bz - az) * t, s: s + Ls * t }); }
    s += Ls;
  }
  const last = ESTRADA[ESTRADA.length - 1]; RP.push({ x: last[0], z: last[1], s });
}
function naEstrada(x, z) {
  let best = 1e9, bi = 0, bt = 0;
  for (let i = 0; i < RP.length - 1; i++) {
    const a = RP[i], b = RP[i + 1]; const dx = b.x - a.x, dz = b.z - a.z; const L2 = dx * dx + dz * dz;
    const t = Math.max(0, Math.min(1, ((x - a.x) * dx + (z - a.z) * dz) / L2));
    const px = a.x + dx * t - x, pz = a.z + dz * t - z; const d = px * px + pz * pz;
    if (d < best) { best = d; bi = i; bt = t; }
  }
  const a = RP[bi], b = RP[bi + 1];
  const dx = b.x - a.x, dz = b.z - a.z; const side = Math.sign(dx * (z - a.z) - dz * (x - a.x)) || 1;
  return { d: Math.sqrt(best), sd: Math.sqrt(best) * side, s: a.s + (b.s - a.s) * bt };
}

// lugares
const PLAZA = { x: -1, z: 0, r: 3.8 };
const CASAS = [
  { x: -6.4, z: -7.6, semente: 3 }, { x: 3.2, z: -8.2, semente: 11 }, { x: -6.6, z: 8.4, semente: 27 },
  { x: 3.4, z: 8.6, semente: 42 }, { x: -17.6, z: -5.0, semente: 77 },
];
const CISTERNA = { x: 1.7, z: -2.7 };
const FORNO = { x: 5.4, z: -13.4 };
const EIRA = { x: -1.5, z: 13.6 };
const CURRAL = { x: 15.5, z: 11 };
const APRISCO = { x: 15.5, z: -11 };
const TRIGAL = { x: -18, z: 10, w: 8, d: 4.6 };
const TUMULO = { x: -18, z: -15.2 };
const ROMAS = [[-1.2, -12.6, 'Romanzeira2_Pomar_ComFruta'], [-10.4, 6.6, 'Romanzeira1_Jovem_ComFruta'], [10.2, -4.5, 'Romanzeira4_Aberta_ComFruta'], [-11, -12.2, 'Romanzeira3_Retorcida_ComFruta'], [19.5, 5.8, 'Romanzeira1_Jovem_SemFruta'], [6, 5.6, 'Romanzeira2_Pomar_SemFruta']];
const OLIVAS = [[-29, -10, 'Oliveira2_Retorcida'], [-30, 9, 'Oliveira1_Jovem'], [-27.5, 15.5, 'Oliveira4_Ancia'], [-32, -18, 'Oliveira3_Vaso'], [-21.5, 15, 'Oliveira1_Jovem']];
const FIGOS = [[-31, -5.2, 'Figueira4_Grande_SemFruta'], [-35.5, 3.6, 'Figueira2_Larga_SemFruta'], [-40, -7, 'Figueira1_Jovem_ComFruta']];

// chão batido (pátios, terreiro, caminhos): círculos e cápsulas suaves
const TERRA = [
  ['c', PLAZA.x, PLAZA.z, PLAZA.r + 1.2, 2.2], ['c', CISTERNA.x, CISTERNA.z, 2, 1], ['c', FORNO.x, FORNO.z, 2.2, 1.2], ['c', EIRA.x, EIRA.z, 3.4, 1.5],
  ['c', CURRAL.x, CURRAL.z, 3.6, 1.5], ['c', APRISCO.x, APRISCO.z, 3.4, 1.2], ['c', TUMULO.x, TUMULO.z + 2.4, 2.6, 1.5],
  ['s', -1, 0, ESCADA.x + 1, ESCADA.z, 1.1, 1.0], ['s', -1, 0, EIRA.x, EIRA.z, 1, 1], ['s', -18, 2, TUMULO.x, TUMULO.z + 3, 1, 1.2],
  ['s', 10, 2, CURRAL.x - 2, CURRAL.z - 2, 0.9, 1], ['s', 10, 2, APRISCO.x - 1, APRISCO.z + 3, 0.9, 1], ['s', -1, 0, FORNO.x, FORNO.z, 0.9, 1],
  ...CASAS.map((c) => ['s', c.x, c.z, PLAZA.x + (c.x < -12 ? -17 : 0), c.x < -12 ? 2 : 0, 1.0, 1.2]),
  ...CASAS.map((c) => ['c', c.x, c.z, 3.6, 1.6]),
];
function terraEm(x, z) {
  let m = 0;
  for (const t of TERRA) {
    let d;
    if (t[0] === 'c') d = Math.hypot(x - t[1], z - t[2]) - t[3];
    else {
      const [, ax, az, bx, bz, w] = t; const dx = bx - ax, dz = bz - az;
      const u = Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz)));
      d = Math.hypot(ax + dx * u - x, az + dz * u - z) - w;
    }
    m = Math.max(m, 1 - smooth(0, t[t.length - 1], d));
  }
  return m;
}

// buracos no chão: câmara do túmulo, sulco da pedra e poço da cisterna
const HOLES = { tumulo: [TUMULO.x - 1.75, TUMULO.z - 6.4, TUMULO.x + 1.75, TUMULO.z], sulco: [TUMULO.x - 2.65, TUMULO.z + 0.18, TUMULO.x + 0.98, TUMULO.z + 0.64], poco: [CISTERNA.x, CISTERNA.z, 0.5] };

// ------------------------------------------------------------------ máscara do chão (estrada, terra, verde, posição na estrada)
const MK = { min: -64, size: 128, res: 512 };
const mascara = (() => {
  const n = MK.res, data = new Uint8Array(n * n * 4);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const x = MK.min + (i + 0.5) / n * MK.size, z = MK.min + (j + 0.5) / n * MK.size;
    const r = naEstrada(x, z);
    const road = 1 - smooth(RW - 0.25, RW + 0.6, r.d);
    const across = Math.max(0, Math.min(1, 0.5 + r.sd / (2 * RW + 0.8)));
    const dirt = terraEm(x, z);
    const green = Math.min(1, 0.25 + 0.5 * vnoise(x * 0.06 + 7, z * 0.06) + 0.2 * smooth(10, 40, x));
    const k = (j * n + i) * 4;
    data[k] = road * 255; data[k + 1] = dirt * 255; data[k + 2] = green * 255; data[k + 3] = across * 255;
  }
  const t = new THREE.DataTexture(data, n, n, THREE.RGBAFormat); t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
})();

// ------------------------------------------------------------------ materiais do chão e dos muros
const UNI_CHAO = {
  tTerra: { value: T.terra }, tSeco: { value: T.seco }, tVerde: { value: T.verde }, tEstr: { value: T.estrada }, tRocha: { value: T.rocha }, tMask: { value: mascara },
  uHoleA: { value: new THREE.Vector4(...HOLES.tumulo) }, uHoleB: { value: new THREE.Vector4(...HOLES.sulco) }, uPoco: { value: new THREE.Vector3(...HOLES.poco) },
  uMK: { value: new THREE.Vector2(MK.min, MK.size) },
};
const matChao = new THREE.MeshStandardMaterial({ roughness: 1, metalness: 0 });
matChao.onBeforeCompile = (sh) => {
  Object.assign(sh.uniforms, UNI_CHAO);
  sh.vertexShader = 'varying vec3 vW;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vW = (modelMatrix * vec4(position, 1.0)).xyz;');
  sh.fragmentShader = 'uniform sampler2D tTerra, tSeco, tVerde, tEstr, tRocha, tMask; uniform vec4 uHoleA, uHoleB; uniform vec3 uPoco; uniform vec2 uMK; varying vec3 vW;\n' + GLSL_NOISE
    + sh.fragmentShader.replace('#include <map_fragment>', `
    if (vW.x > uHoleA.x && vW.x < uHoleA.z && vW.z > uHoleA.y && vW.z < uHoleA.w) discard;
    if (vW.x > uHoleB.x && vW.x < uHoleB.z && vW.z > uHoleB.y && vW.z < uHoleB.w) discard;
    if (distance(vW.xz, uPoco.xy) < uPoco.z) discard;
    vec2 p = vW.xz;
    vec4 mk = texture2D(tMask, (p - uMK.x) / uMK.y);
    vec3 seco = semRep(tSeco, p / 5.0), verde = semRep(tVerde, p / 5.5), terra = semRep(tTerra, p / 4.0);
    float n = vnoise(p * 0.09) * 0.6 + vnoise(p * 0.27 + 4.0) * 0.4;
    vec3 c = mix(seco, verde, smoothstep(0.45, 0.8, mk.b + (n - 0.5) * 0.8));
    c = mix(c, terra, smoothstep(0.3, 0.65, mk.g + (vnoise(p * 0.5) - 0.5) * 0.5));
    vec3 nW = normalize(cross(dFdx(vW), dFdy(vW)));
    float rk = smoothstep(0.8, 0.62, abs(nW.y)) * (1.0 - mk.r) * 0.9;
    c = mix(c, semRep(tRocha, planar(vW, nW) / 3.2) * 0.98, rk);
    float rm = smoothstep(0.25, 0.75, mk.r + (vnoise(p * 1.4) - 0.5) * 0.35);
    c = mix(c, texture2D(tEstr, vec2(clamp(mk.a, 0.02, 0.98), vW.x / 4.5)).rgb, rm);
    c *= macro(vec3(vW.x, 0.0, vW.z));
    c = mix(c, vec3(0.95, 0.92, 0.86), smoothstep(-2.5, -9.0, vW.y) * 0.5);
    diffuseColor.rgb *= c;`);
};
matChao.customProgramCacheKey = () => 'chao_betania_fase';
// muro: pedra (arrimo assentado) ou rocha (borda natural); textura pelo mundo, mais escura no pé, musgo seco no topo
function matMuro(tipo) {
  const m = new THREE.MeshStandardMaterial({ roughness: 1, metalness: 0, flatShading: true });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.tMuro = { value: tipo === 'pedra' ? T.pedra : T.rocha };
    sh.vertexShader = 'varying vec3 vW;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vW = (modelMatrix * vec4(position, 1.0)).xyz;');
    sh.fragmentShader = 'uniform sampler2D tMuro; varying vec3 vW;\n' + GLSL_NOISE + sh.fragmentShader.replace('#include <map_fragment>', `
      vec3 nW = normalize(cross(dFdx(vW), dFdy(vW)));
      vec3 c = semRep(tMuro, planar(vW, nW) / ${tipo === 'pedra' ? '2.4' : '3.4'});
      ${tipo === 'pedra' ? 'float l = dot(c, vec3(0.333)); c = mix(c, vec3(l) * vec3(1.0, 0.97, 0.92), 0.35) * 1.12;' : ''}
      c *= macro(vW);
      c = mix(c, vec3(0.95, 0.92, 0.86), smoothstep(-2.5, -9.0, vW.y) * 0.5);
      diffuseColor.rgb *= c;`);
  };
  m.customProgramCacheKey = () => 'muro_' + tipo;

});

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.fov = retrato() ? 40 : 30; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const ease = (t) => t * t * (3 - 2 * t);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const raw = clock.getDelta(), adt = Math.min(0.25, raw), T0 = clock.elapsedTime;
  for (const nb of NEVOAS) { const u = nb.userData; nb.position.x = u.x0 + Math.sin(T0 * 0.05 + u.f) * 4; nb.position.y = fora(nb.position.x, u.z0) + u.dy; }
  if (window.__capim.userData.sh) window.__capim.userData.sh.uniforms.uTime.value = T0;
  if (anim) {
    anim.t = Math.min(1, anim.t + adt / anim.dur); const k = ease(anim.t);
    controls.target.lerpVectors(anim.t0, anim.t1, k); camera.position.lerpVectors(anim.p0, anim.p1, k);
    if (anim.t >= 1) anim = null;
  }
  controls.update();
  const tg = controls.target; const s = Math.min(42, 12 + camera.position.distanceTo(tg) * 0.42);
  sun.position.copy(tg).addScaledVector(SUN_DIR, 70); sun.target.position.copy(tg);
  Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 10, far: 160 }); sun.shadow.camera.updateProjectionMatrix();
  renderer.render(scene, camera);
});
document.getElementById('carga').remove();
renderer.domElement.classList.add('on');
</script>
