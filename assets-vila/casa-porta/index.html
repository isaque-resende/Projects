<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#86b9df">
<title>Casa com porta</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c6e0ef; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; opacity: 0; transition: opacity .8s; }
  canvas.on { opacity: 1; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Casa do Tripo com porta. Ande com WASD/setas (Shift corre) ou tocando no chão; perto da porta, E ou o botão abre e fecha. Espaço pula; a escada leva ao terraço. Entrar pela porta aberta escurece a tela.
// Luz padrão: manhã no deserto.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const sky = (() => {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#86b9df'); gr.addColorStop(0.55, '#c6e0ef'); gr.addColorStop(1, '#f2e6d0');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
scene.background = sky;
scene.fog = new THREE.Fog(0xeae4d6, 34, 70);

// manhã no deserto: céu azul claro, sol branco-quente vindo do leste a uns 35°, luz rebatida da areia
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0xc9a47a, 1.35));
const sun = new THREE.DirectionalLight(0xffe4bc, 3.2);
sun.position.set(7, 6.5, 4.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 0.5, far: 30 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// chão: sua textura de terra clara com grama, repetida (~5 m por repetição)
const groundTex = new THREE.TextureLoader().load('../figueiras/tex/chao_grama_v3.webp');
groundTex.colorSpace = THREE.SRGBColorSpace;
groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
groundTex.repeat.set(16, 16);
groundTex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 48), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1, color: 0xffffff }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 120);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 42;
controls.maxPolarAngle = Math.PI * 0.48;
controls.target.set(0, 1.6, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
const stopSpin = () => { controls.autoRotate = false; };

// câmera travada de frente, quase isométrica
const AZ = 0.35, POL = 0.95;
controls.autoRotate = false;
controls.minAzimuthAngle = -AZ; controls.maxAzimuthAngle = AZ;
controls.minPolarAngle = POL - 0.15; controls.maxPolarAngle = POL + 0.1;
controls.minDistance = 8; controls.maxDistance = 30;
controls.enablePan = false;
controls.target.set(0, 1.4, 0);
function frame() {
  const dist = innerHeight > innerWidth ? 24 : 16;
  camera.position.setFromSphericalCoords(dist, POL, 0.15).add(controls.target);
  controls.update();
}
const LAYOUT = [{ x: 0, z: 0 }];
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const baixar = async (url) => { for (let k = 0; ; k++) { try { return await loader.loadAsync(url); } catch (e) { if (k >= 3) throw e; await new Promise((r) => setTimeout(r, 500 * (k + 1))); } } };
const sombra = (r) => r.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
const gltf = await baixar('casa_porta.glb');
sombra(gltf.scene);
scene.add(gltf.scene);
const porta = gltf.scene.getObjectByName('Casa2_Porta');
gltf.scene.updateMatrixWorld(true);

// ---------- mapa de alturas da casa (degraus, escada e terraço) ----------
// raio de cima para baixo numa grade de 12 cm: guarda a superfície mais alta de cada ponto.
const caixa = new THREE.Box3().setFromObject(gltf.scene);
const PASSO = 0.12;
const GX0 = caixa.min.x - 0.2, GZ0 = caixa.min.z - 0.2;
const GW = Math.ceil((caixa.max.x - caixa.min.x + 0.4) / PASSO) + 1, GD = Math.ceil((caixa.max.z - caixa.min.z + 0.4) / PASSO) + 1;
const ALT = new Float32Array(GW * GD);
{
  // rasteriza os triângulos da casa na grade (rápido, sem raios): cada célula guarda a maior altura
  const corpo = gltf.scene.getObjectByName('Casa2');
  const pos = corpo.geometry.attributes.position, idx = corpo.geometry.index;
  const m = corpo.matrixWorld, A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  const n = idx ? idx.count : pos.count;
  for (let t = 0; t < n; t += 3) {
    const ia = idx ? idx.getX(t) : t, ib = idx ? idx.getX(t + 1) : t + 1, ic = idx ? idx.getX(t + 2) : t + 2;
    A.fromBufferAttribute(pos, ia).applyMatrix4(m); B.fromBufferAttribute(pos, ib).applyMatrix4(m); C.fromBufferAttribute(pos, ic).applyMatrix4(m);
    const i0 = Math.max(0, Math.floor((Math.min(A.x, B.x, C.x) - GX0) / PASSO)), i1 = Math.min(GW - 1, Math.ceil((Math.max(A.x, B.x, C.x) - GX0) / PASSO));
    const k0 = Math.max(0, Math.floor((Math.min(A.z, B.z, C.z) - GZ0) / PASSO)), k1 = Math.min(GD - 1, Math.ceil((Math.max(A.z, B.z, C.z) - GZ0) / PASSO));
    const d = (B.z - C.z) * (A.x - C.x) + (C.x - B.x) * (A.z - C.z);
    if (Math.abs(d) < 1e-9) {                     // triângulo de pé (parede): marca a altura nas células que ele cruza
      for (let i = i0; i <= i1; i++) for (let k = k0; k <= k1; k++) { const y = Math.max(A.y, B.y, C.y); if (y > ALT[i * GD + k]) ALT[i * GD + k] = y; }
      continue;
    }
    for (let i = i0; i <= i1; i++) for (let k = k0; k <= k1; k++) {
      const x = GX0 + i * PASSO, z = GZ0 + k * PASSO;
      const w1 = ((B.z - C.z) * (x - C.x) + (C.x - B.x) * (z - C.z)) / d;
      const w2 = ((C.z - A.z) * (x - C.x) + (A.x - C.x) * (z - C.z)) / d;
      const w3 = 1 - w1 - w2;
      if (w1 < -0.02 || w2 < -0.02 || w3 < -0.02) continue;
      const y = w1 * A.y + w2 * B.y + w3 * C.y;
      if (y > ALT[i * GD + k]) ALT[i * GD + k] = y;
    }
  }
}
const alturaCasa = (x, z) => {
  const i = Math.round((x - GX0) / PASSO), k = Math.round((z - GZ0) / PASSO);
  if (i < 0 || k < 0 || i >= GW || k >= GD) return 0;
  return ALT[i * GD + k];
};

// ---------- árvores ----------
const TRONCOS = [];
{
  const g = await baixar('../diorama-ciprestes/ciprestes.glb');
  const t = await baixar('arvores_tripo.glb');
  const p = await baixar('tamareiras.glb?v=4');
  const ap = await baixar('arvores_par.glb');
  const m = {};
  for (const n of [...g.scene.children, ...t.scene.children, ...p.scene.children, ...ap.scene.children]) { n.position.set(0, 0, 0); sombra(n); m[n.name] = n; }
  // [x, z, escala, nome, giro]; as árvores do Tripo de copa rasa ficam de frente para a câmera (giro pequeno)
  const LUG = [
    [-6.2, -1.5, 0.95, 'Cipreste2_Esguio', 0.4], [-5.4, -4.6, 0.8, 'Cipreste1_Redondo', 2.1], [6.6, -3.2, 1.0, 'Cipreste2_Esguio', 1.2],
    [-9.5, 1.8, 1.0, 'Arvore2', 0.1], [9.6, 1.2, 0.95, 'Arvore6', -0.15], [-2.5, -7.5, 1.05, 'Arvore8', 0.1],
    [-12.5, -3.5, 1.0, 'Arvore5', 0.1], [12.2, -5.0, 1.0, 'Arvore2', -0.2], [3.5, -8.2, 1.0, 'Arvore3', 0.15],
    [-8.0, -9.0, 0.9, 'Arvore6', -0.1], [8.8, -9.2, 0.95, 'Arvore8', 0.2], [-13.5, 4.5, 0.9, 'Arvore9', 0.0],
    [13.0, 3.8, 0.9, 'Arvore1', -0.15], [-4.5, 9.5, 0.8, 'Arvore4', 0.2], [6.0, 10.0, 0.85, 'Arvore7', -0.1],
    [15.5, -0.8, 0.9, 'Arvore3', -0.1], [0.5, -11.5, 1.0, 'Arvore5', 0.05],
    [1.5, -15.5, 0.9, 'Arvores_Par', 0.05], [-17.0, 9.5, 0.75, 'Arvores_Par', 0.3],
    [-10.5, 8.0, 1.0, 'Tamareiras', 0.1], [11.0, -12.0, 0.9, 'Tamareiras', -0.2],
  ];
  for (const [x, z, k, nome, r] of LUG) {
    if (!m[nome]) continue;
    const n = m[nome].clone(); n.position.set(x, 0, z); n.scale.setScalar(k); n.rotation.y = r; scene.add(n);
    if (nome === 'Tamareiras') for (const dx of [-2.0, 1.7]) TRONCOS.push({ x: x + dx * k, z, r: 0.5 * k });
    else if (nome === 'Arvores_Par') for (const [dx, rr] of [[-3.5, 0.5], [1.8, 0.8]]) TRONCOS.push({ x: x + dx * k, z, r: rr * k });
    else TRONCOS.push({ x, z, r: 0.45 * k });
  }
  // rochas: [x, z, escala, número, giro]
  const ro = await baixar('rochas.glb');
  const R = {};
  for (const n of ro.scene.children) { n.position.set(0, 0, 0); sombra(n); R[n.name] = n; }
  const PEDRAS = [
    [-6.5, 3.5, 1.0, 1, 0.3], [6.2, 4.6, 0.9, 5, -0.6], [-7.5, -6.5, 1.1, 2, 1.2], [7.8, -6.8, 1.0, 4, 0.4],
    [-11.0, 0.5, 1.2, 3, 2.0], [11.8, -2.2, 1.0, 6, -1.0], [4.0, 8.5, 0.8, 7, 0.9], [-2.0, -10.0, 1.0, 8, 0.2],
    [5.5, -11.0, 0.9, 9, -0.4], [-14.0, -7.0, 1.3, 5, 1.6], [14.5, 6.5, 1.1, 2, -1.3], [-7.5, 5.8, 0.7, 9, 0.5],
  ];
  for (const [x, z, k, i, r] of PEDRAS) {
    const n = R['Rocha' + i].clone(); n.position.set(x, 0, z); n.scale.setScalar(k); n.rotation.y = r; scene.add(n);
    TRONCOS.push({ x, z, r: 0.6 * k });
  }
  // muros de pedra e rochas do kit: [x, z, giro, nome]; a colisão cobre a caixa da peça
  const mk = await baixar('muros_kit.glb');
  const M = {};
  for (const n of mk.scene.children) { n.position.set(0, 0, 0); sombra(n); M[n.name] = n; }
  const KIT = [
    [-13.2, 6.6, 0.0, 'Muro_Reto1'], [-10.7, 6.6, 0.03, 'Muro_Reto2'], [-7.9, 6.7, 0.0, 'Muro_Pilar'],
    [9.0, 7.6, 0.05, 'Muro_Reto4'], [11.4, 7.7, -0.03, 'Muro_Reto3'], [14.6, 9.0, 0.0, 'Muro_Canto'],
    [-3.0, 13.0, 0.4, 'Rocha10'], [8.5, 13.5, -0.8, 'Rocha11'], [-16.5, -1.0, 1.2, 'Rocha12'],
  ];
  for (const [x, z, r, nome] of KIT) {
    if (!M[nome]) continue;
    const n = M[nome].clone(); n.position.set(x, 0, z); n.rotation.y = r; scene.add(n);
    n.updateWorldMatrix(true, true);
    const b = new THREE.Box3().setFromObject(n);
    for (let px = b.min.x + 0.3; px < b.max.x; px += 0.5) for (let pz = b.min.z + 0.3; pz < b.max.z; pz += 0.5) TRONCOS.push({ x: px, z: pz, r: 0.4 });
  }
}
const bateArvore = (x, z) => TRONCOS.some((t) => Math.hypot(t.x - x, t.z - z) < t.r) || Math.hypot(x, z) > 30;

// ponto da porta: centro da folha fechada, rente à fachada
porta.updateWorldMatrix(true, true);
const bp = new THREE.Box3().setFromObject(porta);
const PORTA = new THREE.Vector3((bp.min.x + bp.max.x) / 2, 0, bp.max.z);
let aberta = false, ang = 0;
const ABERTO = -1.75;

// ---------- jogador ----------
const pj = await baixar('../vila-betania/discipulo_acoes.glb');
const jog = pj.scene; sombra(jog);
{ const b = new THREE.Box3().setFromObject(jog); jog.scale.setScalar(1.7 / (b.max.y - b.min.y)); }
jog.position.set(PORTA.x + 0.6, 0, PORTA.z + 4.5);
scene.add(jog);
const mixer = new THREE.AnimationMixer(jog);
const ACAO = Object.fromEntries(pj.animations.map((c) => [c.name, mixer.clipAction(c)]));
let anim = '';
const toca = (n) => { if (n === anim || !ACAO[n]) return; ACAO[n].reset().fadeIn(0.15).play(); if (ACAO[anim]) ACAO[anim].fadeOut(0.15); anim = n; };
toca('Parado');
let vy = 0, noChao = true;
const SOBE = 0.5;                                // degrau máximo sem pular
function pular() { if (noChao && !dentro) { vy = 5.2; noChao = false; toca('Pulo_Ar'); } }

// teclado (WASD / setas, Shift corre, Espaço pula) relativo à câmera; toque no chão anda até o ponto
const tec = {};
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase(); tec[k] = true;
  if (k === 'e') usarPorta();
  if (k === ' ') { e.preventDefault(); pular(); }
});
addEventListener('keyup', (e) => { tec[e.key.toLowerCase()] = false; });
let destino = null;
const ray = new THREE.Raycaster(), ponto = new THREE.Vector2();
let inicio = null;
renderer.domElement.addEventListener('pointerdown', (e) => { inicio = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!inicio || Math.hypot(e.clientX - inicio[0], e.clientY - inicio[1]) > 8) return;
  ponto.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ponto, camera);
  if (ray.intersectObject(porta, true).length && perto()) { usarPorta(); return; }
  const h = ray.intersectObjects([gltf.scene, ground], true);
  if (h.length) destino = h[0].point.clone();
});

// botões: porta (aparece perto dela) e pular (no celular)
const estilo = { position: 'fixed', padding: '12px 22px', font: '600 17px system-ui, sans-serif', color: '#3b2a1a', background: '#f6ead2ee', border: '2px solid #8a6a44', borderRadius: '12px', zIndex: 5, cursor: 'pointer', userSelect: 'none' };
const aviso = document.createElement('button');
Object.assign(aviso.style, estilo, { left: '50%', bottom: '12%', transform: 'translateX(-50%)', display: 'none' });
document.body.appendChild(aviso);
aviso.addEventListener('click', () => usarPorta());
const toque = matchMedia('(pointer: coarse)').matches;
if (toque) {
  const bPulo = document.createElement('button');
  bPulo.textContent = 'Pular';
  Object.assign(bPulo.style, estilo, { right: '18px', bottom: '22px', padding: '18px 22px', borderRadius: '50%' });
  document.body.appendChild(bPulo);
  bPulo.addEventListener('pointerdown', (e) => { e.preventDefault(); pular(); });
}
const perto = () => jog.position.y < 0.3 && Math.hypot(jog.position.x - PORTA.x, jog.position.z - PORTA.z) < 2.3;
function usarPorta() { if (perto() && !dentro) aberta = !aberta; }

// fade to black ao entrar (a cena de dentro entra aqui depois)
const veu = document.createElement('div');
Object.assign(veu.style, { position: 'fixed', inset: 0, background: '#000', opacity: 0, pointerEvents: 'none', transition: 'opacity .7s', zIndex: 6, display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: '20px', color: '#e8dcc4', font: '600 18px system-ui, sans-serif' });
document.body.appendChild(veu);
let dentro = false;
function entrar() {
  dentro = true; destino = null; toca('Parado');
  veu.style.pointerEvents = 'auto'; veu.style.opacity = 1;
  veu.textContent = 'Dentro da casa · toque ou aperte uma tecla para sair';
  const sair = () => {
    removeEventListener('keydown', sair); veu.removeEventListener('click', sair);
    jog.position.set(PORTA.x + 0.55, 0, PORTA.z + 1.4); jog.rotation.y = 0;
    veu.style.opacity = 0; veu.style.pointerEvents = 'none';
    setTimeout(() => { dentro = false; veu.textContent = ''; }, 700);
  };
  setTimeout(() => { addEventListener('keydown', sair); veu.addEventListener('click', sair); }, 800);
}

const relogio = new THREE.Clock();
const fr = new THREE.Vector3(), di = new THREE.Vector3(), mv = new THREE.Vector3(), alvoCam = new THREE.Vector3();
function animarPorta() {
  const dt = Math.min(relogio.getDelta(), 0.05);
  ang += ((aberta ? ABERTO : 0) - ang) * Math.min(1, dt * 5);
  porta.rotation.y = ang;
  mixer.update(dt);
  if (dentro) return;
  camera.getWorldDirection(fr); fr.y = 0; fr.normalize(); di.set(-fr.z, 0, fr.x);
  mv.set(0, 0, 0);
  if (tec.w || tec.arrowup) mv.add(fr);
  if (tec.s || tec.arrowdown) mv.sub(fr);
  if (tec.d || tec.arrowright) mv.add(di);
  if (tec.a || tec.arrowleft) mv.sub(di);
  const correr = tec.shift;
  if (mv.lengthSq() > 0) destino = null;
  else if (destino) { mv.set(destino.x - jog.position.x, 0, destino.z - jog.position.z); if (mv.length() < 0.15) { destino = null; mv.set(0, 0, 0); } }
  const naPorta = aberta && ang < -1.2;
  const passagem = (x, z) => naPorta && jog.position.y < 0.3 && Math.abs(x - PORTA.x) < 0.45 && z > PORTA.z - 1.0 && z < PORTA.z + 0.8;
  // pode ir para (x,z) se o chão ali não estiver acima do pé + um degrau
  const folha = new THREE.Box3().setFromObject(porta).expandByScalar(0.18);
  const naFolha = (x, z) => ang < -0.3 && x > folha.min.x && x < folha.max.x && z > folha.min.z && z < folha.max.z;
  const livre = (x, z) => !bateArvore(x, z) && !naFolha(x, z) && (passagem(x, z) || alturaCasa(x, z) <= jog.position.y + SOBE);
  if (mv.lengthSq() > 0) {
    mv.normalize();
    const v = correr ? 4.2 : 2.0;
    const nx = jog.position.x + mv.x * v * dt, nz = jog.position.z + mv.z * v * dt;
    if (livre(nx, nz)) { jog.position.x = nx; jog.position.z = nz; }
    else if (livre(nx, jog.position.z)) jog.position.x = nx;
    else if (livre(jog.position.x, nz)) jog.position.z = nz;
    else destino = null;
    let d = Math.atan2(mv.x, mv.z) - jog.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
    jog.rotation.y += d * Math.min(1, dt * 10);
  }
  // altura: chão da casa (degrau, escada, terraço) ou do campo; pulo e queda com gravidade
  const chao = passagem(jog.position.x, jog.position.z) ? 0 : alturaCasa(jog.position.x, jog.position.z);
  if (noChao && chao < jog.position.y - 0.05 && jog.position.y - chao > SOBE) noChao = false;   // beirada: cai
  if (noChao) jog.position.y += (chao - jog.position.y) * Math.min(1, dt * 18);               // sobe e desce degraus suave
  else {
    vy -= 14 * dt; jog.position.y += vy * dt;
    if (jog.position.y <= chao) { jog.position.y = chao; vy = 0; noChao = true; }
  }
  if (!noChao) toca(vy > 0 ? 'Pulo_Ar' : 'Pulo_Queda');
  else toca(mv.lengthSq() > 0 ? (correr ? 'Correr' : 'Andar') : 'Parado');
  if (naPorta && Math.abs(jog.position.x - PORTA.x) < 0.45 && jog.position.z < PORTA.z - 0.45) entrar();
  alvoCam.set(jog.position.x * 0.6, 1.4 + jog.position.y * 0.8, jog.position.z * 0.6);
  controls.target.lerp(alvoCam, Math.min(1, dt * 3));
  aviso.style.display = perto() ? 'block' : 'none';
  aviso.textContent = (toque ? 'Tocar: ' : 'E: ') + (aberta ? 'fechar a porta' : 'abrir a porta');
}

// tufos de grama em pé: 2 planos cruzados (4 triângulos) com o seu recorte de grama, todos num só draw call.
// Normais apontando para cima: a grama recebe a mesma luz do chão, sem escurecer de lado.
{
  const tex = new THREE.TextureLoader().load('../figueiras/tex/grama_tufo.webp');
  tex.colorSpace = THREE.SRGBColorSpace;
  const a = new THREE.PlaneGeometry(0.62, 0.62); a.translate(0, 0.29, 0);
  const b = a.clone(); b.rotateY(Math.PI / 2);
  const geo = mergeGeometries([a, b]);
  const n = geo.attributes.normal;
  for (let i = 0; i < n.count; i++) n.setXYZ(i, 0, 1, 0);
  const mat = new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 1 });
  let seed = 17;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const N = 300;
  const grass = new THREE.InstancedMesh(geo, mat, N);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    if (i < N * 0.55) {               // mais grama ao redor das figueiras
      const ang = rnd() * Math.PI * 2, d = 5.2 + rnd() * 3.5; const L = { x: 0, z: 0 };
      p.set(L.x + Math.cos(ang) * d, 0, L.z + Math.sin(ang) * d);
    } else {                          // e espalhada pelo campo
      const ang = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * 20;
      p.set(Math.cos(ang) * d, 0, Math.sin(ang) * d);
    }
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * Math.PI);
    const k = 0.55 + rnd() * 0.8;
    s.set(k, k * (0.8 + rnd() * 0.5), k);
    grass.setMatrixAt(i, m4.compose(p, q, s));
    const t = 0.82 + rnd() * 0.25;
    grass.setColorAt(i, c.setRGB(t, t * (0.96 + rnd() * 0.06), t * 0.9));
  }
  grass.receiveShadow = true;
  scene.add(grass);
}

frame();
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});
renderer.setAnimationLoop(() => { animarPorta(); controls.update(); renderer.render(scene, camera); });
requestAnimationFrame(() => renderer.domElement.classList.add('on'));
