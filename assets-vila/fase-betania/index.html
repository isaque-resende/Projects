<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d9d2bf">
<title>Fase de Betânia</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9d2bf; font-family: system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity .9s; display: flex; align-items: center; justify-content: center; color: #f3e9d2; font-size: 22px; letter-spacing: .04em; }
  #acao { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 12px 20px; border: 0; border-radius: 12px; background: #fdf6e3; color: #4a3520; font-size: 16px; box-shadow: 0 3px 12px #0003; display: none; }
  #dica { position: fixed; left: 12px; top: calc(10px + env(safe-area-inset-top)); color: #4a3520; background: #fdf6e3cc; padding: 6px 10px; border-radius: 8px; font-size: 13px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="fade"></div>
<button id="acao"></button>
<div id="dica">Direcional, WASD ou toque para andar · Shift corre · Espaço pula · roda/pinça: zoom</div>
<script type="module">
// Fase de Betânia: vila compacta em vista isométrica. A câmera não gira: só acompanha o jogador
// (com limite) e aproxima/afasta. O que fica entre a câmera e o jogador fica transparente.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d2bf);
scene.fog = new THREE.Fog(0xd9d2bf, 55, 95);
scene.add(new THREE.HemisphereLight(0xd6ebff, 0xc9a47a, 1.3));
const sun = new THREE.DirectionalLight(0xffe2b8, 3.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 80 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const tl = new THREE.TextureLoader();
const tex = (url, rep) => {
  const t = tl.load(url); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); if (rep) t.repeat.set(rep, rep); return t;
};

// ---------- chão: grande o bastante para a câmera nunca ver a borda ----------
// sem textura: cor por triângulo (facetado), manchas grandes e suaves de verde e capim seco
const ground = (() => {
  const g = new THREE.PlaneGeometry(200, 200, 110, 110).toNonIndexed();
  const p = g.attributes.position, cor = [];
  const h = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
  const ruido = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return (h(xi, yi) * (1 - u) + h(xi + 1, yi) * u) * (1 - v) + (h(xi, yi + 1) * (1 - u) + h(xi + 1, yi + 1) * u) * v; };
  const verde = new THREE.Color(0xffffff), verdeE = new THREE.Color(0xd8e0c4), seco = new THREE.Color(0xfff1d2), c = new THREE.Color();
  for (let i = 0; i < p.count; i += 3) {
    const x = (p.getX(i) + p.getX(i + 1) + p.getX(i + 2)) / 3, y = (p.getY(i) + p.getY(i + 1) + p.getY(i + 2)) / 3;
    const n1 = ruido(x / 14 + 5, y / 14 + 9), n2 = ruido(x / 6, y / 6);
    c.copy(verde).lerp(verdeE, THREE.MathUtils.smoothstep(n1, 0.35, 0.75) * 0.8);
    c.lerp(seco, THREE.MathUtils.smoothstep(n2 * 0.6 + n1 * 0.4, 0.55, 0.8) * 0.55);
    c.multiplyScalar(0.96 + h(x, y) * 0.07);
    for (let k = 0; k < 3; k++) cor.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cor, 3));
  return new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex('tex/grama.webp', 9), vertexColors: true, roughness: 1, flatShading: true }));
})();
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// ---------- caminhos de terra ----------
const CAMINHOS = [];
function caminho(pts, larg) {
  const curva = new THREE.CatmullRomCurve3(pts.map(([x, z]) => new THREE.Vector3(x, 0, z)));
  const N = Math.max(20, Math.round(curva.getLength() * 2)), pos = [], uv = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, p = curva.getPointAt(t), tg = curva.getTangentAt(t);
    const w = 1.45 * larg * (0.9 + 0.12 * Math.sin(t * 13 + pts.length)), L = curva.getLength();
    pos.push(p.x - tg.z * w, 0.02, p.z + tg.x * w, p.x + tg.z * w, 0.02, p.z - tg.x * w);
    uv.push(0, t * L / (2.9 * larg), 1, t * L / (2.9 * larg));
  }
  for (let i = 0; i < N; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex('tex/estrada.webp'), roughness: 1, polygonOffset: true, polygonOffsetFactor: -1 }));
  m.receiveShadow = true; scene.add(m);
  CAMINHOS.push({ curva, larg });
}
// estrada para Jerusalém (sai pelo oeste, à esquerda) e ruelas
caminho([[-60, 3], [-30, 3.5], [-19, 2.5], [-10, 2.8], [-3, 1.5], [3, 0.5], [9, -1.5], [16, -1]], 1.5);
caminho([[-3, 1.5], [-5, -2.5], [-7, -5.2]], 1.0);
caminho([[3, 0.5], [4.5, -3.5], [6, -6.5]], 1.0);
caminho([[-10, 2.8], [-10, 6.0]], 0.9);
const naEstrada = (x, z, m) => CAMINHOS.some(({ curva, larg }) => {
  for (let i = 0; i <= 80; i++) { const p = curva.getPointAt(i / 80); if (Math.hypot(p.x - x, p.z - z) < larg + m) return true; }
  return false;
});

// ---------- carregamento ----------
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const baixar = async (url) => {
  for (let k = 0; ; k++) {
    try { return await loader.loadAsync(url); } catch (e) { if (k >= 3) throw e; await new Promise((r) => setTimeout(r, 400 * (k + 1))); }
  }
};
const sombra = (r) => r.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
const nos = (g) => { const m = {}; for (const n of g.scene.children) { m[n.name] = n; } return m; };

// só a leva nova (modelada, com volume) + forno de pão
const [gCasaP, gMuros, gForno, gTripo, gPar, gTam, gCip, gFrond, gRoch, gObj, gParr, gBarr, gBoi, gOve, gJog, ...gNpc] = await Promise.all([
  baixar('../casa-porta/casa_porta.glb'), baixar('../casa-porta/muros_kit.glb'), baixar('../forno-pao/forno.glb'),
  baixar('../casa-porta/arvores_tripo.glb'), baixar('../casa-porta/arvores_par.glb'),
  baixar('../casa-porta/tamareiras.glb?v=4'), baixar('../diorama-ciprestes/ciprestes.glb'), baixar('../casa-porta/arvores_frondosas.glb'),
  baixar('../casa-porta/rochas.glb'), baixar('../casa-porta/objetos_casa.glb'),
  baixar('../casa-porta/parreiras_tripo.glb'), baixar('../casa-porta/barracas.glb'),
  baixar('../animais/boi.glb'), baixar('../animais/ovelha.glb'), baixar('../vila-betania/discipulo_acoes.glb'),
  baixar('../personagens/marta.glb'), baixar('../personagens/lazaro.glb'), baixar('../personagens/pastor.glb'),
  baixar('../personagens/aldeao.glb'), baixar('../personagens/mulher_lenco.glb'), baixar('../personagens/robusto.glb'),
  baixar('../personagens/mulher_botoes.glb'), baixar('../personagens/magro.glb'), baixar('../personagens/moco.glb'),
]);

// obstáculos: caixas (x0, x1, z0, z1) e círculos
const CAIXAS = [], CIRC = [];
const FADE = [];                                    // objetos altos que somem quando tampam o jogador
const bate = (x, z, m = 0.3) => bateAnel(x, z, m) || CAIXAS.some((c) => x > c.x0 - m && x < c.x1 + m && z > c.z0 - m && z < c.z1 + m) || CIRC.some((c) => Math.hypot(c.x - x, c.z - z) < c.r + m);
function caixaDe(obj, enc = 0) {
  obj.updateWorldMatrix(true, true);
  const b = new THREE.Box3().setFromObject(obj);
  CAIXAS.push({ x0: b.min.x + enc, x1: b.max.x - enc, z0: b.min.z + enc, z1: b.max.z - enc });
}
function por(modelo, x, z, r = 0, k = 1, { fade = false, caixa = false, circ = 0, y = 0 } = {}) {
  const n = modelo.clone(); n.position.set(x, y, z); n.rotation.y = r; n.scale.setScalar(k);
  sombra(n); scene.add(n);
  if (caixa) caixaDe(n, typeof caixa === 'number' ? caixa : 0.15);
  if (circ) CIRC.push({ x, z, r: circ * k });
  if (fade) FADE.push(n);
  return n;
}

// ---------- casas (todas ao fundo, de frente para a câmera) ----------
const CASAP = gCasaP.scene; CASAP.children.forEach((c) => c.position.set(0, 0, 0));
const CASAS = [];
const PASSO = 0.12, ABERTO = -1.75;
for (const [x, z, r] of [[-7, -9, 0], [7, -10.5, -0.15], [-16.5, -4.5, 0.6], [16, -4.5, -0.6]]) {
  const g = new THREE.Group(); for (const c of [...CASAP.children]) g.add(c.clone(true));
  g.updateMatrixWorld(true);
  const porta = g.getObjectByName('Casa2_Porta'), corpo = g.getObjectByName('Casa2');
  const bp = new THREE.Box3().setFromObject(porta);
  const px = (bp.min.x + bp.max.x) / 2, pz = bp.max.z;            // ponto da porta, no espaço da casa
  g.position.set(x, 0, z); g.rotation.y = r; sombra(g); scene.add(g); FADE.push(g);
  g.updateMatrixWorld(true);
  // rasteriza os triângulos da casa numa grade (cada célula guarda a maior altura)
  const cx = new THREE.Box3().setFromObject(g);
  const GX0 = cx.min.x - 0.2, GZ0 = cx.min.z - 0.2;
  const GW = Math.ceil((cx.max.x - cx.min.x + 0.4) / PASSO) + 1, GD = Math.ceil((cx.max.z - cx.min.z + 0.4) / PASSO) + 1;
  const ALT = new Float32Array(GW * GD);
  const pos = corpo.geometry.attributes.position, idx = corpo.geometry.index, m = corpo.matrixWorld;
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  const n = idx ? idx.count : pos.count;
  for (let t = 0; t < n; t += 3) {
    A.fromBufferAttribute(pos, idx ? idx.getX(t) : t).applyMatrix4(m); B.fromBufferAttribute(pos, idx ? idx.getX(t + 1) : t + 1).applyMatrix4(m); C.fromBufferAttribute(pos, idx ? idx.getX(t + 2) : t + 2).applyMatrix4(m);
    const i0 = Math.max(0, Math.floor((Math.min(A.x, B.x, C.x) - GX0) / PASSO)), i1 = Math.min(GW - 1, Math.ceil((Math.max(A.x, B.x, C.x) - GX0) / PASSO));
    const k0 = Math.max(0, Math.floor((Math.min(A.z, B.z, C.z) - GZ0) / PASSO)), k1 = Math.min(GD - 1, Math.ceil((Math.max(A.z, B.z, C.z) - GZ0) / PASSO));
    const d = (B.z - C.z) * (A.x - C.x) + (C.x - B.x) * (A.z - C.z);
    if (Math.abs(d) < 1e-6) {           // triângulo de pé (parede)
      for (let i = i0; i <= i1; i++) for (let k = k0; k <= k1; k++) { const y = Math.max(A.y, B.y, C.y); if (y > ALT[i * GD + k]) ALT[i * GD + k] = y; }
      continue;
    }
    for (let i = i0; i <= i1; i++) for (let k = k0; k <= k1; k++) {
      const xx = GX0 + i * PASSO, zz = GZ0 + k * PASSO;
      const w1 = ((B.z - C.z) * (xx - C.x) + (C.x - B.x) * (zz - C.z)) / d, w2 = ((C.z - A.z) * (xx - C.x) + (A.x - C.x) * (zz - C.z)) / d, w3 = 1 - w1 - w2;
      if (w1 < -0.02 || w2 < -0.02 || w3 < -0.02) continue;
      const y = w1 * A.y + w2 * B.y + w3 * C.y; if (y > ALT[i * GD + k]) ALT[i * GD + k] = y;
    }
  }
  const co = Math.cos(r), si = Math.sin(r);
  CASAS.push({ g, porta, ALT, GX0, GZ0, GW, GD, px, pz, x, z, co, si, aberta: false, ang: 0,
    local(wx, wz) { const dx = wx - x, dz = wz - z; return [dx * co - dz * si, dx * si + dz * co]; },
    alt(wx, wz) { const i = Math.round((wx - GX0) / PASSO), k = Math.round((wz - GZ0) / PASSO); return (i < 0 || k < 0 || i >= GW || k >= GD) ? 0 : ALT[i * GD + k]; },
    mundo(lx, lz) { return new THREE.Vector3(x + lx * co + lz * si, 0, z - lx * si + lz * co); } });
}
const alturaEm = (x, z) => { let h = 0; for (const c of CASAS) h = Math.max(h, c.alt(x, z)); return h; };

// ---------- largo: duas barracas; parreira junto à casa de Marta; aprisco de pedra ----------
const MU = nos(gMuros), BA = nos(gBarr), PA = nos(gParr);
for (const o of [...Object.values(MU), ...Object.values(BA), ...Object.values(PA)]) o.position.set(0, 0, 0);
por(BA.Barraca5, 1.0, -3.2, 0.15, 1, { caixa: 0.25, fade: true });
por(BA.Barraca2, -2.2, -2.2, -0.35, 1, { caixa: 0.25, fade: true });
por(PA.Parreira_Arco, 0.4, 13.0, 0, 1, { fade: true });
CIRC.push({ x: 0.4 - 1.23, z: 13.0, r: 0.22 }, { x: 0.4 + 1.16, z: 13.0, r: 0.22 });
por(PA.Parreira_Poste, 2.8, 13.6, 0.4, 1, { circ: 0.22 });
const [gPast, gOfi] = await Promise.all([baixar('../casa-porta/pastoril.glb'), baixar('../casa-porta/oficios.glb')]);
// aprisco: muro circular de pedra com porteira (a porteira abre quando o jogador chega perto)
let APR = null;
function bateAnel(x, z, m) {
  if (!APR) return false;
  const dx = x - APR.x, dz = z - APR.z, d = Math.hypot(dx, dz);
  if (Math.abs(d - APR.rm) > APR.esp / 2 + m) return false;
  let a = Math.atan2(dz, dx) + APR.r; a = Math.atan2(Math.sin(a), Math.cos(a));
  let g = a - APR.gap; g = Math.atan2(Math.sin(g), Math.cos(g));
  if (Math.abs(g) > APR.meia) return true;          // muro
  return APR.ab < 0.9;                              // vão: só passa com a porteira aberta
}
{
  const AX = -11, AZ = 8.6, K = 2.2, KY = 1.3;
  const muro = nos(gPast).Muro_Curvo.clone(); muro.position.set(0, 0, 0);
  // descobre o vão do anel pelos vértices
  const angs = []; const v = new THREE.Vector3(); let rIn = 1e9, rOut = 0;
  muro.updateMatrixWorld(true);
  muro.traverse((o) => { if (!o.isMesh) return; const pa = o.geometry.attributes.position; for (let i = 0; i < pa.count; i++) { v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld); angs.push(Math.atan2(v.z, v.x)); const r = Math.hypot(v.x, v.z); rOut = Math.max(rOut, r); if (v.y > 0.3) rIn = Math.min(rIn, r); } });
  angs.sort((a, b) => a - b);
  let gMax = 0, gA = 0;
  for (let i = 0; i < angs.length; i++) { const a = angs[i], b = i + 1 < angs.length ? angs[i + 1] : angs[0] + Math.PI * 2; if (b - a > gMax) { gMax = b - a; gA = (a + b) / 2; } }
  const alvoAng = Math.PI / 4;                       // vão virado para a câmera (+x +z)
  const r = gA - alvoAng;
  muro.scale.set(K, KY, K); muro.rotation.y = r; muro.position.set(AX, 0, AZ); sombra(muro); scene.add(muro);
  const rm = (rIn + rOut) / 2 * K;
  APR = { x: AX, z: AZ, r, gap: gA, meia: gMax / 2 + 0.02, rm, esp: (rOut - rIn) * K + 0.1, ab: 0, alvoAb: 0 };
  // porteira atravessada no vão, presa por uma das pontas (dobradiça)
  const port = nos(gPast).Porteira.clone(); port.position.set(0, 0, 0);
  const larg = 2 * rm * Math.sin(gMax / 2) + 0.7, kp = larg / 2.63;
  port.scale.setScalar(kp); sombra(port);
  const phi = alvoAng, c = new THREE.Vector3(AX + Math.cos(phi) * (rm + 0.25), 0, AZ + Math.sin(phi) * (rm + 0.25));
  const tg = new THREE.Vector3(-Math.sin(phi), 0, Math.cos(phi));
  const piv = new THREE.Group(); piv.position.copy(c).addScaledVector(tg, -larg / 2);
  const base = Math.atan2(-tg.z, tg.x);
  piv.rotation.y = base; port.position.set(larg / 2, 0, 0); piv.add(port); scene.add(piv);
  APR.piv = piv; APR.base = base; APR.centroPorta = c;
  globalThis.APRISCO = { x0: AX - 1.45, x1: AX + 1.45, z0: AZ - 1.45, z1: AZ + 1.45 };
}
{
  const F = nos(gForno);
  const base = F.Forno_Corpo.position.clone();
  const forno = new THREE.Group();
  for (const [n, o] of Object.entries(F)) if (n.startsWith('Forno_') && !/Chama|Brasa|Massa_[23]/.test(n)) { const c = o.clone(); c.position.sub(base); forno.add(c); }
  forno.position.set(-2.2, 0, -8.2); forno.rotation.y = 0.4; sombra(forno); scene.add(forno); CIRC.push({ x: -2.2, z: -8.2, r: 1.3 });
  // brasa e chamas acesas
  for (const n of ['Forno_Brasa', 'Forno_Chamas', 'Forno_ChamaBoca']) if (F[n]) { const c = F[n].clone(); c.position.sub(base); forno.add(c); }
  forno.updateWorldMatrix(true, true);
  globalThis.FORNO = {};
  for (const n of ['Forno_Boca', 'Forno_Massa_1', 'Forno_Pao_1', 'Forno_Pao_2', 'Forno_Pao_3', 'Forno_Corpo']) {
    const o = forno.children.find((c) => c.name === n || c.name.startsWith(n)); if (!o) continue;
    globalThis.FORNO[n] = new THREE.Box3().setFromObject(o);
  }
  for (const n of ['NPC_Amassar', 'NPC_Aticar', 'NPC_Assar']) {
    const e = F[n]; const p = e.position.clone().sub(base).applyMatrix4(forno.matrixWorld);
    const q = new THREE.Quaternion().setFromRotationMatrix(forno.matrixWorld).multiply(e.quaternion);
    globalThis.FORNO[n] = { p, r: new THREE.Euler().setFromQuaternion(q, 'YXZ').y };
  }
}
// lagar de pisar uvas, à frente, entre o aprisco e a lavoura
const gLagar = await baixar('../lagar/lagar.glb');
{
  const L = nos(gLagar), base = L.Lagar_Rocha.position.clone();
  const lagar = new THREE.Group();
  for (const o of Object.values(L)) { const c = o.clone(); c.position.sub(base); lagar.add(c); }
  lagar.position.set(-3.2, 0, 10.8); lagar.rotation.y = 0.3; sombra(lagar); scene.add(lagar);
  lagar.updateWorldMatrix(true, true); caixaDe(lagar, 0.35);
  const mundo = (n) => L[n].position.clone().sub(base).applyMatrix4(lagar.matrixWorld);
  globalThis.LAGAR = { tanque: mundo('Lagar_Uvas_6'), cesto: mundo('Lagar_CestoUvas'), jarro: mundo('Lagar_Jarro'), r: lagar.rotation.y };
}

// ---------- lavoura: terra arada à frente-direita ----------
const LAV = { x0: 5.0, x1: 16.6, z0: 6.0, z1: 12.4 };
{

{

  const pj = jog.o.position;
