<script type="module">
// Fase de Betânia: vila compacta em vista isométrica. A câmera não gira: só acompanha o jogador
// (com limite) e aproxima/afasta. O que fica entre a câmera e o jogador fica transparente.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d2bf);
scene.fog = new THREE.Fog(0xd9d2bf, 55, 95);
const hemi = new THREE.HemisphereLight(0xd6ebff, 0xc9a47a, 1.3); scene.add(hemi);

sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 80 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const tl = new THREE.TextureLoader();
const tex = (url, rep) => {
  const t = tl.load(url); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); if (rep) t.repeat.set(rep, rep); return t;
};

// ---------- chão: vem do Blender (betania_blender.py), carregado mais abaixo ----------
let ground = null;

// ---------- posições exportadas do Blender (betania.blend > texto EXPORTAR_PARA_O_JOGO) ----------

const POS = await fetch('betania_posicoes.json', { cache: 'no-cache' }).then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
const VER = POS.versao || 16;
const P = (id, x, z, r = 0, k = 1) => { const o = POS.pontos?.[id]; return { x: o?.x ?? x, z: o?.z ?? z, r: o?.r ?? r, k: o?.k ?? k, de: !!o }; };

// ---------- caminhos de terra ----------
const CAMINHOS = [];
function caminho(pts, larg) {
  const curva = new THREE.CatmullRomCurve3(pts.map(([x, z]) => new THREE.Vector3(x, 0, z)));
  CAMINHOS.push({ curva, larg });
}
// estrada para Jerusalém (sai pelo oeste) atravessa a vila; ruelas levam a cada porta e ao aprisco
if (POS.caminhos) for (const c of POS.caminhos) caminho(c.pts, c.larg);
else {
  caminho([[-60, 3], [-30, 3.2], [-20, 2.8], [-10, 2.2], [-2, 0.8], [6, 0.4], [12, 1.0], [16, 1.6]], 1.5);
  caminho([[-2, 0.8], [-2.5, -3.5], [-2.7, -6.6]], 1.0);
  caminho([[6, 0.4], [6.1, -3.5], [6.3, -7.2]], 1.0);
  caminho([[12, 1.0], [14.2, -2.2], [14.6, -5.8]], 0.9);
  caminho([[-10, 2.2], [-7.6, 6.4], [-8.2, 10.6]], 0.9);
}
const naEstrada = (x, z, m) => CAMINHOS.some(({ curva, larg }) => {
  for (let i = 0; i <= 80; i++) { const p = curva.getPointAt(i / 80); if (Math.hypot(p.x - x, p.z - z) < larg + m) return true; }
  return false;
});

// ---------- carregamento ----------
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const baixar = async (url) => {
  for (let k = 0; ; k++) {
    try { return await loader.loadAsync(url); } catch (e) { if (k >= 3) throw e; await new Promise((r) => setTimeout(r, 400 * (k + 1))); }
  }
};
const sombra = (r) => r.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
const nos = (g) => { const m = {}; for (const n of g.scene.children) { m[n.name] = n; } return m; };

// só a leva nova (modelada, com volume) + forno de pão
const [gCasaP, gMuros, gForno, gTripo, gPar, gTam, gCip, gFrond, gRoch, gObj, gParr, gBarr, gBoi, gOve, gJog, ...gNpc] = await Promise.all([
  baixar('../casa-porta/casa_porta.glb'), baixar('../casa-porta/muros_kit.glb'), baixar('../forno-pao/forno.glb'),
  baixar('../casa-porta/arvores_tripo.glb'), baixar('../casa-porta/arvores_par.glb'),
  baixar('../casa-porta/tamareiras.glb?v=4'), baixar('../diorama-ciprestes/ciprestes.glb'), baixar('../casa-porta/arvores_frondosas.glb'),
  baixar('../casa-porta/rochas.glb'), baixar('../casa-porta/objetos_casa.glb'),
  baixar('../casa-porta/parreiras_tripo.glb'), baixar('../casa-porta/barracas.glb'),
  baixar('../animais/boi.glb'), baixar('../animais/ovelha.glb'), baixar('../vila-betania/discipulo_acoes.glb'),
  baixar('../personagens/marta.glb'), baixar('../personagens/lazaro.glb'), baixar('../personagens/pastor.glb'),
  baixar('../personagens/aldeao.glb'), baixar('../personagens/mulher_lenco.glb'), baixar('../personagens/robusto.glb'),
  baixar('../personagens/mulher_botoes.glb'), baixar('../personagens/magro.glb'), baixar('../personagens/moco.glb'),
]);

// obstáculos: caixas (x0, x1, z0, z1) e círculos
const CAIXAS = [], CIRC = [];
const FADE = [];                                    // objetos altos que somem quando tampam o jogador
const bate = (x, z, m = 0.3) => bateAnel(x, z, m) || CAIXAS.some((c) => x > c.x0 - m && x < c.x1 + m && z > c.z0 - m && z < c.z1 + m) || CIRC.some((c) => Math.hypot(c.x - x, c.z - z) < c.r + m);
function caixaDe(obj, enc = 0) {
  obj.updateWorldMatrix(true, true);
  const b = new THREE.Box3().setFromObject(obj);
  CAIXAS.push({ x0: b.min.x + enc, x1: b.max.x - enc, z0: b.min.z + enc, z1: b.max.z - enc });
}
function por(modelo, x, z, r = 0, k = 1, { fade = false, caixa = false, circ = 0, y = 0 } = {}) {
  const n = modelo.clone(); n.position.set(x, y, z); n.rotation.y = r; n.scale.setScalar(k);
  sombra(n); scene.add(n);
  if (caixa) caixaDe(n, typeof caixa === 'number' ? caixa : 0.15);
  if (circ) CIRC.push({ x, z, r: circ * k });
  if (fade) FADE.push(n);
  return n;
}

// ---------- cenário do Blender: terreno (vila plana, morros em volta), caminhos, muretas; árvores e pedras do layout ----------
const [gCen, LAYB] = await Promise.all([baixar('betania_cenario.glb?v=' + VER), fetch('betania_layout.json?v=' + VER).then((r) => r.json())]);
// terreno e caminhos com sombreamento suave e a cor misturada entre os vértices (visual "prado", igual a Betfagé)
function suaviza(mesh) {
  const g0 = mesh.geometry, pos = g0.attributes.position, col = g0.attributes.color, idx = g0.index;
  const mapa = new Map(), P = [], C = [], N = [], I = [], n = idx ? idx.count : pos.count;
  for (let t = 0; t < n; t++) {
    const v = idx ? idx.getX(t) : t, x = pos.getX(v), y = pos.getY(v), z = pos.getZ(v), k = Math.round(x * 50) + '_' + Math.round(z * 50) + '_' + Math.round(y * 50);
    let j = mapa.get(k);
    if (j === undefined) { j = P.length / 3; mapa.set(k, j); P.push(x, y, z); C.push(0, 0, 0); N.push(0); }
    if (col) { C[j * 3] += col.getX(v); C[j * 3 + 1] += col.getY(v); C[j * 3 + 2] += col.getZ(v); N[j]++; }
    I.push(j);
  }
  for (let j = 0; j < N.length; j++) if (N[j]) for (let c = 0; c < 3; c++) C[j * 3 + c] /= N[j];
  const g1 = new THREE.BufferGeometry(); g1.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g1.setAttribute('color', new THREE.Float32BufferAttribute(C, 3)); g1.setIndex(I); g1.computeVertexNormals();
  mesh.geometry = g1;
}
const texChao = (url) => { const x = tl.load(url); x.colorSpace = THREE.SRGBColorSpace; x.wrapS = x.wrapT = THREE.RepeatWrapping; x.anisotropy = 4; return x; };
const TXC = { grama: texChao('../fase-betfage/tex/grama.webp?v=1'), terra: texChao('../fase-betfage/tex/terra.webp?v=1'), grama2: texChao('tex/grama.webp'), patio: texChao('tex/patio.webp'), estrada: texChao('tex/estrada.webp'), pedras: texChao('tex/pedras.webp') };
function matChao(soTerra, offset) {
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, ...(offset ? { polygonOffset: true, polygonOffsetFactor: -2 } : {}) });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uGrama = { value: TXC.grama }; sh.uniforms.uTerra = { value: TXC.terra }; sh.uniforms.uGrama2 = { value: TXC.grama2 }; sh.uniforms.uPatio = { value: TXC.patio }; sh.uniforms.uEstrada = { value: TXC.estrada }; sh.uniforms.uPedras = { value: TXC.pedras };
    sh.vertexShader = 'varying vec3 vWP; varying vec3 vWN;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n vWP = (modelMatrix * vec4(transformed, 1.0)).xyz; vWN = normalize(mat3(modelMatrix) * objectNormal);');
    sh.fragmentShader = 'uniform sampler2D uGrama; uniform sampler2D uTerra; uniform sampler2D uGrama2; uniform sampler2D uPatio; uniform sampler2D uEstrada; uniform sampler2D uPedras; varying vec3 vWP; varying vec3 vWN;\n' + sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      vec3 vc = vColor.rgb;
      // manchas grandes trocam entre as duas gramas (o chão não fica igual em toda parte)
      float mg = smoothstep(-0.35, 0.35, sin(vWP.x * 0.11 + 1.7) * cos(vWP.z * 0.09 - 0.6) + 0.45 * sin(vWP.x * 0.27 + vWP.z * 0.21));
      vec3 tg = mix(texture2D(uGrama, vWP.xz * 0.2).rgb, texture2D(uGrama2, vWP.xz * 0.12).rgb * vec3(0.95, 1.02, 0.9), mg * 0.75);
      vec3 tt = texture2D(uTerra, vWP.xz * 0.16 + 0.37).rgb;
      // terra clara do largo e dos pátios (cor de vértice mais clara) usa a textura de pátio
      float lv = dot(vc, vec3(0.3, 0.59, 0.11));
      tt = mix(tt, texture2D(uPatio, vWP.xz * 0.25).rgb, smoothstep(0.6, 0.7, lv) * ${soTerra ? '0.0' : '1.0'});
      ${soTerra ? 'tt = mix(tt, texture2D(uPatio, vWP.xz * 0.18).rgb, 0.35);' : ''}
      float gr = ${soTerra ? '0.0' : 'smoothstep(-0.045, 0.0, vc.g - vc.r) * smoothstep(0.55, 0.8, vWN.y)'};
      float seco = ${soTerra ? '0.0' : '1.0 - smoothstep(-0.01, 0.04, vc.g - vc.r)'};
      tg = mix(tg, vec3(dot(tg, vec3(0.3, 0.59, 0.11))), 0.18) * vec3(0.9, 0.88, 0.8);
      tg = mix(tg, tg * vec3(1.15, 1.0, 0.65), seco * 0.6);
      float lt = dot(tt, vec3(0.3, 0.59, 0.11));
      vec3 terra = mix(tt, vec3(lt) * vec3(1.18, 1.02, 0.78), 0.45) * 1.05;
      // manchas de pedregulho e de chão seco, espalhadas (não aparecem nos caminhos)
      float np = sin(vWP.x * 0.23 + 4.1) * cos(vWP.z * 0.19 + 2.3) + 0.6 * sin(vWP.x * 0.51 - vWP.z * 0.37 + 1.7);
      float nd = sin(vWP.x * 0.13 - 2.2) * cos(vWP.z * 0.17 + 0.9) + 0.5 * sin(vWP.x * 0.41 + vWP.z * 0.33);
      vec3 tp = texture2D(uPedras, vWP.xz * 0.28).rgb;
      tg = mix(tg, mix(tg, terra, 0.55) * vec3(1.06, 1.0, 0.86), smoothstep(0.95, 1.25, nd) * 0.7);
      diffuseColor.rgb = mix(terra, tg, gr);`);
  };
  m.customProgramCacheKey = () => 'chao-bet2-' + soTerra; return m;
}
gCen.scene.traverse((o) => {
  if (!o.isMesh) return;
  if (o.name.startsWith('Betania_Terreno')) { suaviza(o); o.material = matChao(false, false); o.receiveShadow = true; ground = o; }
  else if (o.name.startsWith('Betania_Caminhos')) { suaviza(o); o.material = matChao(true, true); o.receiveShadow = true; }
  else { o.castShadow = true; o.receiveShadow = true; }
});
scene.add(gCen.scene);
// árvores e pedras (posições fixas do Blender); as de longe vão instanciadas
const CASAS_NOVAS = [], BEBEDOURO = [];
{
  const ARQB = [...new Set(LAYB.objetos.map((o) => o.glb))];
  const gB = await Promise.all(ARQB.map((a) => baixar('../' + a)));
  const KB = Object.fromEntries(ARQB.map((a, i) => [a, nos(gB[i])]));
  for (const k of Object.values(KB)) for (const o of Object.values(k)) o.position.set(0, 0, 0);
  const grupos = {};
  for (const o of LAYB.objetos) if (o.f) (grupos[o.glb + '|' + o.no] ||= []).push(o);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (const lista of Object.values(grupos)) {
    const raiz = KB[lista[0].glb]?.[lista[0].no]; if (!raiz) continue;
    raiz.updateMatrixWorld(true);
    raiz.traverse((mm) => {
      if (!mm.isMesh) return;
      const inst = new THREE.InstancedMesh(mm.geometry, mm.material, lista.length);
      lista.forEach((o, i) => { q.setFromEuler(new THREE.Euler(raiz.rotation.x, raiz.rotation.y + o.r, raiz.rotation.z)); s.copy(raiz.scale).multiplyScalar(o.k); m4.compose(p.set(...o.p), q, s); m4.multiply(raiz.matrixWorld.clone().invert().multiply(mm.matrixWorld)); inst.setMatrixAt(i, m4); });
      inst.castShadow = false; inst.receiveShadow = true; inst.frustumCulled = false; scene.add(inst);
    });
  }
  for (const o of LAYB.objetos) {
    if (o.f) continue;
    const m = KB[o.glb]?.[o.no]; if (!m) continue;
    const n = m.clone(); n.position.set(...o.p); n.rotation.y += o.r; n.scale.multiplyScalar(o.k); sombra(n); scene.add(n);
    const alto = /Arvore|Cipreste|Tamareira/.test(o.no);
    if (/^Casa_/.test(o.no)) { CASAS_NOVAS.push(n); continue; }
    if (o.no === 'Cocho') BEBEDOURO.push(n);
    CIRC.push({ x: o.p[0], z: o.p[2], r: alto ? 0.45 : 0.35 * o.k + 0.15 });
  }
}

for (const b of BEBEDOURO) {          // água dentro do cocho de pedra
  b.updateMatrixWorld(true); const bx = new THREE.Box3().setFromObject(b), rc = new THREE.Raycaster(), d = [];
  const N = 18; for (let i = 0; i <= N; i++) for (let k = 0; k <= N; k++) {
    const x = bx.min.x + (bx.max.x - bx.min.x) * i / N, z = bx.min.z + (bx.max.z - bx.min.z) * k / N;
    rc.set(new THREE.Vector3(x, bx.max.y + 1, z), new THREE.Vector3(0, -1, 0)); const h = rc.intersectObject(b, true)[0];
    if (h && h.point.y < bx.max.y - 0.12 && h.point.y > bx.min.y + 0.06) d.push(h.point);
  }
  if (d.length > 6) {
    const c = d.reduce((a, p) => a.add(p), new THREE.Vector3()).multiplyScalar(1 / d.length);
    const pts = d.map((p) => [p.x, p.z]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], hi = []; for (const p of pts) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    for (const p of [...pts].reverse()) { while (hi.length > 1 && cr(hi[hi.length - 2], hi[hi.length - 1], p) <= 0) hi.pop(); hi.push(p); }
    const casco = lo.slice(0, -1).concat(hi.slice(0, -1)).map(([x, z]) => new THREE.Vector2(c.x + (x - c.x) * 0.82, -(c.z + (z - c.z) * 0.82)));
    const yf = Math.min(bx.max.y - 0.06, Math.max(...d.map((p) => p.y)) + 0.04);
    const ag = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(casco)), new THREE.MeshStandardMaterial({ color: 0x4f8a92, roughness: 0.3 }));
    ag.rotation.x = -Math.PI / 2; ag.position.y = yf; scene.add(ag);
  }
}
function tingeCasa(raiz) {
  raiz.traverse((m) => {
    if (!m.isMesh) return;
    m.material = m.material.clone();
    m.material.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>
      float lum = dot(diffuseColor.rgb, vec3(0.3, 0.59, 0.11));
      diffuseColor.rgb = mix(diffuseColor.rgb, lum * vec3(1.08, 1.03, 0.9), 0.6);`); };
    m.material.customProgramCacheKey = () => 'casa-creme';
  });
}
for (const n of CASAS_NOVAS) tingeCasa(n);

// ---------- casas (todas ao fundo, de frente para a câmera) ----------
const CASAP = gCasaP.scene; CASAP.children.forEach((c) => c.position.set(0, 0, 0));
const CASAS = [];
const PASSO = 0.12, ABERTO = -1.75;
for (const { x, z, r } of [P('casa_discipulo', -3, -10.5, 0.1), P('casa_marta', 6.2, -11, -0.05)]) {
  const g = new THREE.Group(); for (const c of [...CASAP.children]) g.add(c.clone(true));
  g.updateMatrixWorld(true);
  const porta = g.getObjectByName('Casa2_Porta'), corpo = g.getObjectByName('Casa2');
  const bp = new THREE.Box3().setFromObject(porta);
  const px = (bp.min.x + bp.max.x) / 2, pz = bp.max.z;            // ponto da porta, no espaço da casa
  g.position.set(x, 0, z); g.rotation.y = r; sombra(g); scene.add(g); tingeCasa(g);
  g.updateMatrixWorld(true);
  // rasteriza os triângulos da casa numa grade (cada célula guarda a maior altura)
  const cx = new THREE.Box3().setFromObject(g);
  const GX0 = cx.min.x - 0.2, GZ0 = cx.min.z - 0.2;
  const GW = Math.ceil((cx.max.x - cx.min.x + 0.4) / PASSO) + 1, GD = Math.ceil((cx.max.z - cx.min.z + 0.4) / PASSO) + 1;
  const ALT = new Float32Array(GW * GD);
  const pos = corpo.geometry.attributes.position, idx = corpo.geometry.index, m = corpo.matrixWorld;
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();

  foco.x += (fx - foco.x) * Math.min(1, dt * 3); foco.z += (fz - foco.z) * Math.min(1, dt * 3); foco.y += (jog.o.position.y * 0.8 - foco.y) * Math.min(1, dt * 3);
  camera.position.copy(foco).addScaledVector(DIR, dist); camera.lookAt(foco);
  scene.fog.near = dist + 14; scene.fog.far = dist + 70;   // a neblina acompanha o zoom: o fundo da vila nunca some
  sun.position.set(foco.x + 14, 22, foco.z + 9); sun.target.position.copy(foco);

  atualizaFade();
  renderer.render(scene, camera);
};
renderer.setAnimationLoop(() => laco());
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
</script>
