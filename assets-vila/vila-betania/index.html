<!doctype html>

<title>Betânia</title>
<style>
  :root { --papel: #f6ecd6; --tinta: #3d2e1f; --ouro: #c98a2b; --borda: #d9c49a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e6dfcd; font-family: Georgia, 'Times New Roman', serif; color: var(--tinta);
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #carga { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; background: #e6dfcd; transition: opacity .9s; }
  #carga h1 { font-weight: normal; letter-spacing: .14em; margin: 0 0 6px; font-size: 30px; text-align: center; }
  #carga p { margin: 0; text-align: center; font-size: 14px; opacity: .7; font-style: italic; }
  #barra { width: 180px; height: 3px; background: #d8ccb0; margin: 14px auto 0; border-radius: 2px; overflow: hidden; }
  #barra i { display: block; height: 100%; width: 0; background: var(--ouro); transition: width .3s; }
  #erro { color: #8a2b1b; font-size: 13px; margin-top: 10px; text-align: center; max-width: 80vw; }
  #titulo { position: fixed; z-index: 2; left: max(14px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top));
    pointer-events: none; text-shadow: 0 1px 0 rgba(255,250,235,.85); }
  #titulo b { display: block; font-weight: normal; font-size: 22px; letter-spacing: .1em; }
  #titulo span { font-size: 12.5px; opacity: .75; font-style: italic; }
  .bt { appearance: none; border: 1px solid var(--borda); background: rgba(246,236,214,.94); color: var(--tinta); font: inherit; border-radius: 12px;
    box-shadow: 0 2px 8px rgba(60,40,20,.18); cursor: pointer; touch-action: none; }
  .bt:active, .bt.on { background: #ebcb8f; border-color: #c9a160; }
  #cima { position: fixed; z-index: 2; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); display: grid; grid-template-columns: 40px 40px; gap: 6px; }
  #cima .bt { width: 40px; height: 40px; font-size: 20px; line-height: 1; padding: 0; }
  #dir { position: fixed; z-index: 2; right: max(16px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 168px; height: 150px; }
  #dir .bt { position: absolute; border-radius: 50%; padding: 0; display: grid; place-items: center; font-size: 12px; line-height: 1.1; text-align: center; }
  #bAcao { right: 0; bottom: 0; width: 78px; height: 78px; font-size: 13px !important; }
  #bAcao.pronto { background: #f0cf8c; border-color: #c08a2e; box-shadow: 0 0 0 4px rgba(240,190,90,.35), 0 2px 8px rgba(60,40,20,.25); }
  #bPulo { right: 88px; bottom: 0; width: 58px; height: 58px; }
  #bCorre { right: 30px; bottom: 90px; width: 52px; height: 52px; }
  #bAcao i, #bPulo i, #bCorre i { font-style: normal; font-size: 22px; display: block; }
  #rotulo { position: fixed; z-index: 2; right: max(16px, env(safe-area-inset-right)); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 156px);
    background: rgba(246,236,214,.94); border: 1px solid var(--borda); border-radius: 10px; padding: 5px 10px; font-size: 13.5px;
    max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #rotulo.on { opacity: 1; }
  #rotulo::before { content: '◆ '; color: var(--ouro); }
  #joy { position: fixed; z-index: 3; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(246,236,214,.85);
    background: rgba(246,236,214,.22); display: none; pointer-events: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(246,236,214,.92);
    box-shadow: 0 2px 8px rgba(60,40,20,.25); }
  #dlg { position: fixed; z-index: 4; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); width: min(94vw, 560px); transform: translate(-50%, 130%);
    background: var(--papel); border: 1px solid var(--borda); border-radius: 16px; box-shadow: 0 8px 30px rgba(60,40,20,.28);
    padding: 16px 18px 14px; box-sizing: border-box; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  #dlg.on { transform: translate(-50%, 0); }
  #dlg h2 { margin: 0 0 6px; font-weight: normal; font-size: 19px; letter-spacing: .03em; }
  #dlg h2::before { content: '◆ '; color: var(--ouro); font-size: 14px; vertical-align: 2px; }
  #dlg p { margin: 0 0 6px; font-size: 15.5px; line-height: 1.45; }
  #dlg .ref { font-size: 12.5px; font-style: italic; opacity: .7; margin-bottom: 10px; }
  #dlg .acoes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  #dlg .acoes .bt { padding: 8px 14px; font-size: 15px; border-radius: 12px; }
  #dlg .acoes .bt.pri { background: #ebcb8f; border-color: #c9a160; }
  #dica { position: fixed; z-index: 2; left: 50%; top: max(66px, calc(env(safe-area-inset-top) + 58px)); transform: translateX(-50%);
    background: rgba(246,236,214,.92); border: 1px solid var(--borda); border-radius: 20px; padding: 7px 14px; font-size: 13px;
    transition: opacity 1.2s; pointer-events: none; text-align: center; max-width: 88vw; }
  body.ocupado #dir, body.ocupado #rotulo { opacity: .45; }
  @media (max-width: 560px) { #dica { top: calc(max(12px, env(safe-area-inset-top)) + 96px); } }
</style>

<body>
<div id="carga"><div><h1>BETÂNIA</h1><p>a quinze estádios de Jerusalém</p><div id="barra"><i></i></div><div id="erro"></div></div></div>

<script type="module">
// Vila de Betânia jogável (v2). Diorama isométrico com área de exploração em volta, controles de toque,
// interações animadas, casa de Lázaro entrável com terraço e mapa que gira.
// Eixos: +x = leste (estrada de Jericó), -x = oeste (sobe o Monte das Oliveiras); -z = norte (caminho de Jerusalém).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { computeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';
import { carregarKit, casaExemplo, casaAleatoria, GLSL_NOISE } from '../casas/construtor_casas.js';
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

const mostraErro = (m) => { const el = document.getElementById('erro'); if (el) el.textContent = 'Erro: ' + m; };
addEventListener('error', (e) => mostraErro(e.message || e));
addEventListener('unhandledrejection', (e) => mostraErro(e.reason && e.reason.message || e.reason));

const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hsh = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
let semente = 1234;
const rnd = () => { semente = (semente * 16807) % 2147483647; return semente / 2147483647; };
const MOBILE = matchMedia('(pointer: coarse)').matches;
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ================================================================== renderer, cena, luz
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = (() => {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#a6c8e2'); gr.addColorStop(0.42, '#d4e2e6'); gr.addColorStop(0.75, '#ebe3d0'); gr.addColorStop(1, '#e6dfcd');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
scene.fog = new THREE.Fog(0xe2dccb, 55, 150);

scene.add(new THREE.HemisphereLight(0xd6e8ff, 0xc9a47a, 1.35));
const sun = new THREE.DirectionalLight(0xffe2b8, 3.0);
const SOL_DIR = V(10, 13, 6).normalize();
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 110 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.035;
scene.add(sun, sun.target);

// ================================================================== carga
const manager = new THREE.LoadingManager();
manager.onProgress = (u, a, b) => { $('#barra i').style.width = Math.round(100 * a / b) + '%'; };
const texL = new THREE.TextureLoader(manager);
const tex = (url, rep = true) => { const t = texL.load(url); t.colorSpace = THREE.SRGBColorSpace; if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t; };
// texturas suavizadas (lisas, com pinceladas largas) feitas a partir das originais
const T = {
  campo: tex('tex/campo_seco.webp'), terra: tex('tex/chao_grama_v3.webp'), arada: tex('tex/terra_arada.webp'),
  rocha: tex('tex/rocha_encosta.webp'), pedra: tex('tex/pedra.webp'), cantaria: tex('tex/cantaria.webp'),
  capim: tex('../discipulo/tex/capim_tufo.webp', false),
};
const loader = new GLTFLoader(manager).setMeshoptDecoder(MeshoptDecoder);
const GLB = {};
const ARQ = {
  vila: '../vila/vila.glb', tumulo: '../tumulo/tumulo.glb', forno: '../forno-pao/forno.glb', colheita: '../colheita-trigo/colheita.glb',
  trigo: '../trigal/trigo.glb', oliveiras: '../oliveiras/oliveiras.glb', figueiras: '../figueiras/figueiras.glb',
  romanzeiras: '../romanzeiras/romanzeiras.glb', amendoeiras: '../amendoeiras/amendoeiras.glb', carvalhos: '../carvalhos/carvalhos.glb',
  lentiscos: '../lentiscos/lentiscos.glb', esteva: '../esteva/esteva.glb', sarco: '../sarcopoterium/sarcopoterium.glb',
  tomilho: '../tomilho/tomilho.glb', flores: '../flores/flores.glb', parreiras: '../parreiras/parreiras_v2.glb',
  terebintos: '../terebintos/terebintos.glb', espinheiros: '../espinheiros/espinheiros.glb', pinheiros: '../pinheiros/pinheiros.glb',
  alfarrobeiras: '../alfarrobeiras/alfarrobeiras.glb', lagar: '../lagar/lagar.glb', prensa: '../prensa-azeite/prensa.glb',
  discipulo: 'discipulo_acoes.glb',
};
const [kit] = await Promise.all([
  carregarKit('../casas/casas_kit.glb', 'tex/'),
  ...Object.entries(ARQ).map(([k, u]) => loader.loadAsync(u).then((g) => { GLB[k] = g; g.scene.updateMatrixWorld(true); })),
]);

function prep(o) {
  o.traverse((m) => {
    if (m.name && m.name.startsWith('NPC_')) m.visible = false;
    if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; }
  });
  return o;
}
function no(g, nome) { let r = null; g.scene.traverse((o) => { if (!r && o.name === nome) r = o; }); if (!r) console.warn('sem nó', nome); return r; }
function copia(g, nome) { const o = no(g, nome).clone(true); o.position.x = 0; o.position.z = 0; return prep(o); }
function conjunto(g, prefixo, base) {
  const b = no(g, base).position.clone(); const grp = new THREE.Group();
  for (const c of g.scene.children) if (c.name === base || c.name.startsWith(prefixo)) { const k = c.clone(true); k.position.sub(b); grp.add(k); }
  return prep(grp);
}
function por(o, x, z, rot = 0, y = null) { o.position.set(x, y === null ? H(x, z) : y, z); o.rotation.y = rot; scene.add(o); return o; }
function geoDe(g, nome) {
  const n = no(g, nome); let mesh = n.isMesh ? n : null; n.traverse((o) => { if (!mesh && o.isMesh) mesh = o; });
  const m = new THREE.Matrix4().compose(V(0, n.position.y, 0), n.quaternion, n.scale);
  if (mesh !== n) m.multiply(mesh.matrix);
  const geo = mesh.geometry.clone(); geo.applyMatrix4(m);
  return { geo, mat: mesh.material };
}

// ================================================================== relevo
// Área jogável: x de -34 a 34, z de -28 a 28. O núcleo da vila (x ±22, z ±16) é o mesmo; em volta, campo e encostas.
const PX0 = -34, PX1 = 34, PZ0 = -28, PZ1 = 28, TOPO = 1.5;
const zFrente = (x) => (x < -13 ? -1 : x < -11 ? lerp(-1, -4.5, (x + 13) / 2) : x <= 12 ? -4.5 : -99);
const RAMPA = { x0: 1.75, x1: 4.75, z0: -8.5, z1: -2.5 };
const ESCADA = { x0: -10.5, x1: -9.0, z0: -6.5, z1: -3.5 };
const naRampa = (x, z) => x >= RAMPA.x0 && x <= RAMPA.x1 && z >= RAMPA.z0 && z <= RAMPA.z1;
const naEscada = (x, z) => x >= ESCADA.x0 && x <= ESCADA.x1 && z >= ESCADA.z0 && z <= ESCADA.z1;
const dentroJogo = (x, z) => x >= PX0 && x <= PX1 && z >= PZ0 && z <= PZ1;
function hBase(x, z) {
  if (naRampa(x, z)) return TOPO * clamp((RAMPA.z1 - z) / (RAMPA.z1 - RAMPA.z0), 0, 1);
  if (naEscada(x, z)) return TOPO * clamp((ESCADA.z1 - z) / (ESCADA.z1 - ESCADA.z0), 0, 1);   // rampa por baixo; os degraus são de pedra
  const zf = zFrente(x);
  if (!dentroJogo(x, z)) return zf < -50 ? 0 : TOPO * smooth(zf + 4, zf - 4, z);          // fora: o degrau vira encosta
  return z < zf ? TOPO : 0;
}
// grandes formas: o monte sobe a oeste e ao norte; a leste o terreno desce para o deserto
function relevo(x, z) {
  let h = 4.2 * smooth(-12, -32, z) * (1 - 0.45 * smooth(10, 24, x));
  h += 3.2 * smooth(-20, -42, x);
  h -= 2.4 * smooth(20, 42, x);
  h -= 0.9 * smooth(15, 32, z);
  const longe = smooth(30, 70, Math.max(Math.abs(x) - 6, Math.abs(z)));
  h += longe * (9 * smooth(-30, -100, x) + 6 * smooth(-25, -95, z) - 7 * smooth(30, 100, x) + 3.5 * Math.sin(x * 0.045 + 1.3) * Math.sin(z * 0.05 + 0.4));
  return h;
}
const CASAS = [
  { nome: 'lazaro', x: -6.5, z: -2.7, w: 5, d: 4 },
  { nome: 'norte', x: 6.5, z: -4.3, w: 5, d: 4, semente: 253421 },
  { nome: 'leste', x: 13.6, z: -3.4, w: 5, d: 4, semente: 229664 },
  { nome: 'sul', x: -4.6, z: 4.6, w: 4, d: 4, semente: 300935 },
  { nome: 'sudeste', x: 6.4, z: 5.8, w: 5, d: 3, semente: 237583 },
];
const LZ = CASAS[0];
const APRISCO = { x0: -18.6, z0: 3.8, x1: -13.0, z1: 10.2 };
const CURRAL = { x0: -13.0, z0: 4.6, x1: -9.0, z1: 9.6 };
const LOTES = [...CASAS.map((c) => [c.x, c.z, c.x + c.w, c.z + c.d]), [APRISCO.x0, APRISCO.z0, CURRAL.x1, APRISCO.z1]];
const ESTRADA = [[40, 4.6], [30, 4.2], [23, 3.4], [14, 3.0], [8.5, 2.2], [5.2, 0.6], [3.25, -2.2], [3.25, -8.5], [3.0, -16], [2.0, -22], [2.6, -30]];
const TRILHAS = [
  [[-5, 2.0], [-3.2, 2.5], [-0.6, 2.6]],
  [[-9.75, -3.2], [-8.3, -3.4], [-7.4, -3.4]],
  [[-8.3, -3.4], [-8.0, 0.4], [-6.6, 2.0], [-5, 2.0]],
  [[-9.75, -6.8], [-11.2, -6.0], [-12.6, -4.6]],
  [[-2.6, 8.9], [-0.2, 6.0], [0.4, 3.6]],
  [[-8.6, 7.1], [-5.6, 4.0], [-1.8, 3.2]],
  [[8.8, 10.6], [5.6, 9.6], [5.3, 6.0], [5.9, 2.6]],
  [[16.1, 0.8], [15.8, 2.7]],
  [[-11.4, -5.2], [-17, -6.2], [-22.5, -7.2]],              // patamar -> prensa de azeite
  [[24, 4.0], [26.5, 10], [27.5, 18.5]],                    // estrada -> vinha e lagar
  [[0.4, 3.6], [1.6, 12], [2.4, 18.4]],                     // praça -> campo de cevada ao sul
];
const PRACA = { x: 0.9, z: 2.4, r: 3.4 };
const CAMPO = { x0: 12.6, x1: 20.4, z0: 6.8, z1: 13.8 };
const CEVADA = { x0: -3.0, x1: 8.0, z0: 19.0, z1: 25.0 };
function distSeg(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az; const t = clamp(((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz || 1), 0, 1);
  return Math.hypot(px - ax - dx * t, pz - az - dz * t);
}
const distLinha = (x, z, L) => { let d = 1e9; for (let i = 0; i < L.length - 1; i++) d = Math.min(d, distSeg(x, z, ...L[i], ...L[i + 1])); return d; };
const ruido = (x, z) => Math.sin(x * 1.31 + z * 0.73) * 0.5 + Math.sin(z * 1.67 - x * 0.41 + 1.3) * 0.5;
function mascaraCaminho(x, z) {
  const borda = 0.25 * ruido(x * 1.7, z * 1.7);
  let m = 1 - smooth(1.15, 1.6, distLinha(x, z, ESTRADA) + borda);
  for (const t of TRILHAS) m = Math.max(m, 1 - smooth(0.45, 0.85, distLinha(x, z, t) + borda * 0.7));
  m = Math.max(m, 1 - smooth(PRACA.r - 0.6, PRACA.r + 0.2, Math.hypot(x - PRACA.x, z - PRACA.z) + borda));
  if (naRampa(x, z)) m = 1;
  return m;
}
function terraCasas(x, z) {
  let m = 0;
  for (const [x0, z0, x1, z1] of LOTES) {
    const dx = Math.max(x0 - x, 0, x - x1), dz = Math.max(z0 - z, 0, z - z1);
    m = Math.max(m, 1 - smooth(0.3, 1.5, Math.hypot(dx, dz) + 0.35 * ruido(x * 2.1, z * 2.1)));
  }
  return m;
}
const naCaixa = (x, z, C) => x > C.x0 && x < C.x1 && z > C.z0 && z < C.z1;
const noCampo = (x, z) => naCaixa(x, z, CAMPO) || naCaixa(x, z, CEVADA);
function ondula(x, z) {
  const nucleo = Math.abs(x) < 22 && Math.abs(z) < 16;
  const plano = (1 - mascaraCaminho(x, z)) * (1 - terraCasas(x, z));
  const perto = (Math.abs(z - zFrente(x)) < 0.9 || (Math.abs(x - 12) < 0.9 && z < -4) || naEscada(x, z) || naRampa(x, z) || noCampo(x, z)) ? 0 : 1;
  const amp = nucleo ? 0.08 : 0.22;
  return amp * ruido(x * 0.6, z * 0.6) * plano * perto;
}
const H = (x, z) => hBase(x, z) + relevo(x, z) + ondula(x, z);

// ================================================================== túmulo e poço (definidos antes do chão, que tem furos)
const TUM = { x: -14.6, z: -8.4, rot: 0.55 };

  // ---- casa de Lázaro: as portas abrem sozinhas quando se chega perto; por dentro, o teto some
  for (const g of Object.values(casas)) for (const p of g.userData.portas) {
    if (g === casaLZ) { const w = p.getWorldPosition(tmp2); const perto = Math.hypot(w.x - P.x, w.z - P.z) < 1.9 && Math.abs(w.y - P.y) < 1.6; p.userData.alvo = perto ? p.userData.aberta : p.userData.fechada; }
    p.rotation.y += (p.userData.alvo - p.rotation.y) * Math.min(1, dt * 5);
  }
  const dentroLZ = dentroCasaLZ() && P.y < 1.5;
  casaLZ.userData.camadas.cima.visible = !dentroLZ;
  for (const p of portasLZ) if (p.position.y > 1) p.visible = !dentroLZ;

  // ---- forno: brasa, chamas, luz e fumaça
  fogoNivel += (fogoAlvo - fogoNivel) * Math.min(1, dt * 0.8);
  const ch = 0.85 + 0.15 * Math.sin(tempo * 17) * Math.sin(tempo * 7.3);
  if (FN.Forno_Brasa) FN.Forno_Brasa.visible = brasa > 0;
  for (const n of ['Forno_Chamas', 'Forno_ChamaBoca']) if (FN[n]) { FN[n].visible = fogoNivel > 0.04; FN[n].scale.set(1, Math.max(0.01, fogoNivel * ch), 1); }
  luzForno.intensity = (fogoNivel * 3.5 + brasa * 0.8) * ch;
  if (fogoNivel > 0.5 && Math.random() < dt * 1.6) fumaca.emite(FORNO_TOPO.clone().add(V(0, 0.15, 0)), V(0.08, 0.5, 0.02), 1, 0.2);

  // ---- pá de forno
  if (paEst.modo === 'mao') {
    pa.position.copy(mao);
    const frente = V(Math.sin(P.rot), 0, Math.cos(P.rot));
    pa.lookAt(paEst.alvo ? paEst.alvo : mao.clone().addScaledVector(frente, 1.4).add(V(0, -0.15, 0)));
  } else { pa.position.copy(PA_DESCANSO.p); pa.lookAt(PA_DESCANSO.alvo); }
  pa.updateMatrixWorld(true);
  if (paEst.carga) { paEst.carga.position.copy(pa.localToWorld(PONTA_PA.clone())); paEst.carga.rotation.set(0, P.rot, 0); }

  // ---- balde e corda
  const B = baldeEst;
  if (B.modo === 'borda') B.p.lerp(BALDE_BORDA, Math.min(1, dt * 8));
  else if (B.modo === 'mao') B.p.lerp(tmp2.copy(mao).add(V(0, -BALDE_ALCA + 0.04, 0)), Math.min(1, dt * 14));
  else if (B.modo === 'caindo') {
    B.t += dt;
    B.p.x += (POCO.x - B.p.x) * Math.min(1, dt * 6); B.p.z += (POCO.z - B.p.z) * Math.min(1, dt * 6);
    B.vy -= 9.8 * dt; B.p.y += B.vy * dt;
    const fundo = PC.Poco_1_Agua.getWorldPosition(tmp2).y + BALDE_PE * 0.4;
    if (B.p.y < fundo) { B.p.y = fundo; B.modo = 'fundo'; B.t = 0; respingo.emite(V(POCO.x, RIM + 0.1, POCO.z), V(0, 2.2, 0), 14, 0.3); }
  } else if (B.modo === 'fundo') {
    B.t += dt; if (B.t > 0.7) { B.modo = 'subindo'; B.cheio = true; }
  } else if (B.modo === 'subindo') {
    B.p.y += dt * 1.6; B.p.x = POCO.x; B.p.z = POCO.z;
    if (B.p.y >= BALDE_GANCHO.y) { B.p.copy(BALDE_GANCHO); B.modo = 'gancho'; }
  } else if (B.modo === 'gancho') B.p.lerp(BALDE_GANCHO, Math.min(1, dt * 8));
  balde.position.copy(B.p);
  balde.rotation.z += ((B.inclina || 0) - balde.rotation.z) * Math.min(1, dt * 6);
  PC.Poco_1_BaldeAgua.visible = B.cheio;
  {
    const ponta = tmp2.copy(B.p).add(V(0, BALDE_ALCA, 0));
    const d = ponta.sub(POLIA); const L = d.length();
    corda.position.copy(POLIA); corda.scale.set(1, Math.max(0.01, L), 1);
    if (L > 1e-4) corda.quaternion.setFromUnitVectors(V(0, -1, 0), d.normalize());
  }
  faiscas.passo(dt); fumaca.passo(dt); palha.passo(dt); respingo.passo(dt);

  // ---- câmera
  const [v, d] = alvoCamera();
  const k = 1 - Math.exp(-dt * 3.2);
  camAlvo.lerp(v, k); camDist += (d - camDist) * k;
  camera.position.copy(camAlvo).addScaledVector(DIR, camDist);
  camera.lookAt(camAlvo);
  sun.position.copy(camAlvo).addScaledVector(SOL_DIR, 50); sun.target.position.copy(camAlvo);
}

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); ajustaFov(); });
renderer.autoClear = false; renderer.shadowMap.autoUpdate = false;
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, relogio.getDelta()); passo(dt);
  renderer.shadowMap.needsUpdate = true; renderer.clear(); renderer.render(scene, camera);
  const bg = scene.background; scene.background = null; scene.overrideMaterial = matSilhueta; camera.layers.set(1);
  renderer.render(scene, camera);
  scene.background = bg; scene.overrideMaterial = null; camera.layers.set(0);
});
renderer.compile(scene, camera);
setTimeout(() => { $('#carga').style.opacity = 0; setTimeout(() => $('#carga').remove(), 1000); }, 250);
setTimeout(() => { $('#dica').style.opacity = 0; }, 10000);
window.__vila = { NYf: () => NY, NXf: () => NX, NZf: () => NZ, sonda: (ax, az, bx, bz, y) => { const d = V(bx - ax, 0, bz - az); const L = d.length(); d.normalize(); raio.set(V(ax, y, az), d); raio.far = L + 0.05; return raio.intersectObjects(malhasLZ, false).map((h) => h.point.toArray().map((n) => n.toFixed(2)).join(',') + ' ' + h.object.parent.name); }, ligacao, raio, malhasLZ, P, POIS, abrir, irPara, roteiro, tumParaMundo, camera, camAlvo, baldeEst, paEst, LZ, caminho, noEm, pisosLZ,
  get zoomT() { return zoomT; }, set zoomT(v) { zoomT = v; }, get az() { return azAlvo; }, set az(v) { azAlvo = v; }, get ocupado() { return ocupado; }, get fogo() { return fogoNivel; } };
</script>
