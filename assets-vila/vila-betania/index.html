<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Betânia</title>
<style>
  :root { --papel: #f6ecd6; --tinta: #3d2e1f; --ouro: #c98a2b; --borda: #d9c49a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e6dfcd; font-family: Georgia, 'Times New Roman', serif; color: var(--tinta);
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #carga { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; background: #e6dfcd; transition: opacity .9s; }
  #carga h1 { font-weight: normal; letter-spacing: .14em; margin: 0 0 6px; font-size: 30px; text-align: center; }
  #carga p { margin: 0; text-align: center; font-size: 14px; opacity: .7; font-style: italic; }
  #barra { width: 180px; height: 3px; background: #d8ccb0; margin: 14px auto 0; border-radius: 2px; overflow: hidden; }
  #barra i { display: block; height: 100%; width: 0; background: var(--ouro); transition: width .3s; }
  #erro { color: #8a2b1b; font-size: 13px; margin-top: 10px; text-align: center; max-width: 80vw; }
  #titulo { position: fixed; z-index: 2; left: max(14px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top));
    pointer-events: none; text-shadow: 0 1px 0 rgba(255,250,235,.85); }
  #titulo b { display: block; font-weight: normal; font-size: 22px; letter-spacing: .1em; }
  #titulo span { font-size: 12.5px; opacity: .75; font-style: italic; }
  #zoom { position: fixed; z-index: 2; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 6px; }
  .bt { appearance: none; border: 1px solid var(--borda); background: rgba(246,236,214,.94); color: var(--tinta); font: inherit; border-radius: 12px;
    box-shadow: 0 2px 8px rgba(60,40,20,.18); cursor: pointer; }
  .bt:active { transform: translateY(1px); }
  #zoom .bt { width: 40px; height: 40px; font-size: 22px; line-height: 1; padding: 0; }
  #interagir { position: fixed; z-index: 2; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translate(-50%, 160%);
    padding: 11px 20px; font-size: 16px; transition: transform .3s; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  #interagir.on { transform: translate(-50%, 0); }

  #dlg { position: fixed; z-index: 3; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); width: min(94vw, 560px); transform: translate(-50%, 130%);
    background: var(--papel); border: 1px solid var(--borda); border-radius: 16px; box-shadow: 0 8px 30px rgba(60,40,20,.28);
    padding: 16px 18px 14px; box-sizing: border-box; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  #dlg.on { transform: translate(-50%, 0); }
  #dlg h2 { margin: 0 0 6px; font-weight: normal; font-size: 19px; letter-spacing: .03em; }
  #dlg h2::before { content: '◆ '; color: var(--ouro); font-size: 14px; vertical-align: 2px; }
  #dlg p { margin: 0 0 6px; font-size: 15.5px; line-height: 1.45; }
  #dlg .ref { font-size: 12.5px; font-style: italic; opacity: .7; margin-bottom: 10px; }
  #dlg .acoes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  #dlg .acoes .bt { padding: 8px 14px; font-size: 15px; }

  #dica { position: fixed; z-index: 2; left: 50%; top: max(66px, calc(env(safe-area-inset-top) + 58px)); transform: translateX(-50%);
    background: rgba(246,236,214,.92); border: 1px solid var(--borda); border-radius: 20px; padding: 7px 14px; font-size: 13.5px;
    transition: opacity 1.2s; pointer-events: none; white-space: nowrap; }

<body>
<div id="carga"><div><h1>BETÂNIA</h1><p>a quinze estádios de Jerusalém</p><div id="barra"><i></i></div><div id="erro"></div></div></div>

<script type="module">
// Vila de Betânia jogável: diorama isométrico compacto, montado do zero com os assets de assets-vila.
// Eixos: +x = leste (estrada de Jericó), -x = oeste; -z = norte (o caminho sobe para Betfagé e Jerusalém); +z = frente da câmera.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { carregarKit, casaExemplo, casaAleatoria, GLSL_NOISE } from '../casas/construtor_casas.js';

addEventListener('error', (e) => { const el = document.getElementById('erro'); if (el) el.textContent = 'Erro: ' + (e.message || e); });
addEventListener('unhandledrejection', (e) => { const el = document.getElementById('erro'); if (el) el.textContent = 'Erro: ' + (e.reason && e.reason.message || e.reason); });

const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hsh = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
let semente = 1234;
const rnd = () => { semente = (semente * 16807) % 2147483647; return semente / 2147483647; };
const MOBILE = matchMedia('(pointer: coarse)').matches;

// ================================================================== renderer, cena, luz
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const FUNDO_SRGB = new THREE.Vector3(0xe6 / 255, 0xdf / 255, 0xcd / 255);
const scene = new THREE.Scene();
scene.background = (() => {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#a6c8e2'); gr.addColorStop(0.42, '#d4e2e6'); gr.addColorStop(0.75, '#ebe3d0'); gr.addColorStop(1, '#e6dfcd');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
scene.fog = new THREE.Fog(0xe6dfcd, 110, 220);

scene.add(new THREE.HemisphereLight(0xd6e8ff, 0xc9a47a, 1.3));
const sun = new THREE.DirectionalLight(0xffe2b8, 3.1);
const SOL_DIR = new THREE.Vector3(10, 13, 6).normalize();
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 100 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.035;
scene.add(sun, sun.target);

// ================================================================== carga
const manager = new THREE.LoadingManager();
manager.onProgress = (u, a, b) => { $('#barra i').style.width = Math.round(100 * a / b) + '%'; };
const texL = new THREE.TextureLoader(manager);
const tex = (url, rep = true) => { const t = texL.load(url); t.colorSpace = THREE.SRGBColorSpace; if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t; };
const T = {
  campo: tex('../discipulo/tex/campo_seco.webp'),
  terra: tex('../vila/tex/chao_grama_v3.webp'),
  arada: tex('../trigal/tex/terra_arada.webp'),
  rocha: tex('../tumulo/tex/rocha_encosta.webp'),
  pedra: tex('../casas/tex/pedra.webp'),
  cantaria: tex('../casas/tex/cantaria.webp'),
  capim: tex('../discipulo/tex/capim_tufo.webp', false),
};
const loader = new GLTFLoader(manager).setMeshoptDecoder(MeshoptDecoder);
const GLB = {};
const ARQ = {
  vila: '../vila/vila.glb', tumulo: '../tumulo/tumulo.glb', forno: '../forno-pao/forno.glb', colheita: '../colheita-trigo/colheita.glb',
  trigo: '../trigal/trigo.glb', oliveiras: '../oliveiras/oliveiras.glb', figueiras: '../figueiras/figueiras.glb',
  romanzeiras: '../romanzeiras/romanzeiras.glb', amendoeiras: '../amendoeiras/amendoeiras.glb', carvalhos: '../carvalhos/carvalhos.glb',
  lentiscos: '../lentiscos/lentiscos.glb', esteva: '../esteva/esteva.glb', sarco: '../sarcopoterium/sarcopoterium.glb',
  tomilho: '../tomilho/tomilho.glb', flores: '../flores/flores.glb', parreiras: '../parreiras/parreiras_v2.glb',
  discipulo: '../discipulo/discipulo.glb',
};
const [kit] = await Promise.all([
  carregarKit('../casas/casas_kit.glb', '../casas/tex/'),
  ...Object.entries(ARQ).map(([k, u]) => loader.loadAsync(u).then((g) => { GLB[k] = g; g.scene.updateMatrixWorld(true); })),
]);

function prep(o) {
  o.traverse((m) => {
    if (m.name && m.name.startsWith('NPC_')) m.visible = false;
    if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; }
  });
  return o;
}
function no(g, nome) { let r = null; g.scene.traverse((o) => { if (!r && o.name === nome) r = o; }); if (!r) console.warn('sem nó', nome); return r; }
// cópia de um nó do catálogo, com a posição de catálogo zerada em x/z
function copia(g, nome) { const o = no(g, nome).clone(true); o.position.x = 0; o.position.z = 0; return prep(o); }
// peças do catálogo que andam juntas (ex.: Poco_1 e Poco_1_*), relativas à peça base
function conjunto(g, prefixo, base) {
  const b = no(g, base).position.clone(); const grp = new THREE.Group();
  for (const c of g.scene.children) if (c.name === base || c.name.startsWith(prefixo)) { const k = c.clone(true); k.position.sub(b); grp.add(k); }
  return prep(grp);
}
function por(o, x, z, rot = 0, y = null) { o.position.set(x, y === null ? H(x, z) : y, z); o.rotation.y = rot; scene.add(o); return o; }
// geometria (com a transformação do nó, sem a posição) de um nó de uma peça só
function geoDe(g, nome) {
  const n = no(g, nome); let mesh = n.isMesh ? n : null; n.traverse((o) => { if (!mesh && o.isMesh) mesh = o; });
  const m = new THREE.Matrix4().compose(new THREE.Vector3(0, n.position.y, 0), n.quaternion, n.scale);
  if (mesh !== n) m.multiply(mesh.matrix);
  const geo = mesh.geometry.clone(); geo.applyMatrix4(m);
  return { geo, mat: mesh.material };
}

// ================================================================== relevo: uma só função para o desenho e para os passos
// Diorama: x de -22 a 22, z de -16 a 16. Dois níveis: a vila (0) e o patamar de trás (1,5 m), com rampa e escada.
const X0 = -22, X1 = 22, Z0 = -16, Z1 = 16, TOPO = 1.5;
const zFrente = (x) => (x < -13 ? -1 : x < -11 ? lerp(-1, -4.5, (x + 13) / 2) : x <= 12 ? -4.5 : -99);
const RAMPA = { x0: 1.75, x1: 4.75, z0: -8.5, z1: -2.5 };
const ESCADA = { x0: -10.5, x1: -9.0, z0: -6.5, z1: -3.5 };
const naRampa = (x, z) => x >= RAMPA.x0 && x <= RAMPA.x1 && z >= RAMPA.z0 && z <= RAMPA.z1;
const naEscada = (x, z) => x >= ESCADA.x0 && x <= ESCADA.x1 && z >= ESCADA.z0 && z <= ESCADA.z1;
function hBase(x, z) {
  if (naRampa(x, z)) return TOPO * clamp((RAMPA.z1 - z) / (RAMPA.z1 - RAMPA.z0), 0, 1);
  if (naEscada(x, z)) return z > ESCADA.z1 - 1e-6 ? 0 : 0.25 * clamp(Math.floor((ESCADA.z1 - z) / 0.5 + 1e-6) + 1, 1, 6);
  return z < zFrente(x) ? TOPO : 0;
}
// lotes das casas e do aprisco [x0, z0, x1, z1] (terra batida em volta e bloqueio)
const CASAS = [
  { nome: 'lazaro', x: -6.5, z: -4.3, w: 5, d: 4 },
  { nome: 'norte', x: 6.5, z: -4.3, w: 5, d: 4, semente: 253421 },
  { nome: 'leste', x: 13.6, z: -3.4, w: 5, d: 4, semente: 229664 },
  { nome: 'sul', x: -4.6, z: 4.6, w: 4, d: 4, semente: 300935 },
  { nome: 'sudeste', x: 6.4, z: 5.8, w: 5, d: 3, semente: 237583 },
];
const APRISCO = { x0: -18.6, z0: 3.8, x1: -13.0, z1: 10.2 };
const CURRAL = { x0: -13.0, z0: 4.6, x1: -9.0, z1: 9.6 };
const LOTES = [...CASAS.map((c) => [c.x, c.z, c.x + c.w, c.z + c.d]), [APRISCO.x0, APRISCO.z0, CURRAL.x1, APRISCO.z1]];
// caminhos
const ESTRADA = [[23, 3.4], [14, 3.0], [8.5, 2.2], [5.2, 0.6], [3.25, -2.2], [3.25, -8.5], [3.25, -17]];
const TRILHAS = [
  [[-5, 0.4], [-3.2, 1.6], [-0.6, 2.4]],                 // porta de Lázaro -> praça
  [[-9.75, -3.2], [-7.8, -0.6], [-5, 0.4]],              // pé da escada -> porta de Lázaro
  [[-9.75, -6.8], [-11.2, -6.0], [-12.6, -4.6]],         // topo da escada -> túmulo
  [[-2.6, 8.9], [-0.2, 6.0], [0.4, 3.6]],                // casa do sul -> praça
  [[-8.6, 7.1], [-5.6, 4.0], [-1.8, 3.2]],               // curral -> praça
  [[8.8, 10.6], [5.6, 9.6], [5.3, 6.0], [5.9, 2.6]],     // eira -> estrada
  [[16.1, 0.8], [15.8, 2.7]],                            // casa do leste -> estrada
];
const PRACA = { x: 0.9, z: 2.4, r: 3.4 };
const CAMPO = { x0: 12.6, x1: 20.4, z0: 6.8, z1: 13.8 };
function distSeg(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az; const t = clamp(((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz || 1), 0, 1);
  return Math.hypot(px - ax - dx * t, pz - az - dz * t);
}
const distLinha = (x, z, L) => { let d = 1e9; for (let i = 0; i < L.length - 1; i++) d = Math.min(d, distSeg(x, z, ...L[i], ...L[i + 1])); return d; };
const ruido = (x, z) => Math.sin(x * 1.31 + z * 0.73) * 0.5 + Math.sin(z * 1.67 - x * 0.41 + 1.3) * 0.5;
function mascaraCaminho(x, z) {
  const borda = 0.25 * ruido(x * 1.7, z * 1.7);
  let m = 1 - smooth(1.15, 1.6, distLinha(x, z, ESTRADA) + borda);
  for (const t of TRILHAS) m = Math.max(m, 1 - smooth(0.45, 0.85, distLinha(x, z, t) + borda * 0.7));
  m = Math.max(m, 1 - smooth(PRACA.r - 0.6, PRACA.r + 0.2, Math.hypot(x - PRACA.x, z - PRACA.z) + borda));
  if (naRampa(x, z)) m = 1;
  return m;
}
function terraCasas(x, z) {
  let m = 0;
  for (const [x0, z0, x1, z1] of LOTES) {
    const dx = Math.max(x0 - x, 0, x - x1), dz = Math.max(z0 - z, 0, z - z1);
    m = Math.max(m, 1 - smooth(0.3, 1.5, Math.hypot(dx, dz) + 0.35 * ruido(x * 2.1, z * 2.1)));
  }
  return m;
}
const noCampo = (x, z) => x > CAMPO.x0 && x < CAMPO.x1 && z > CAMPO.z0 && z < CAMPO.z1;
// ondulação suave fora dos caminhos e longe das bordas e dos degraus
function ondula(x, z) {
  const longe = smooth(0, 1.2, Math.min(x - X0, X1 - x, z - Z0, Z1 - z));
  const plano = (1 - mascaraCaminho(x, z)) * (1 - terraCasas(x, z));
  const perto = (Math.abs(z - zFrente(x)) < 0.8 || Math.abs(x - 12) < 0.8 && z < -4 || naEscada(x, z) || naRampa(x, z) || noCampo(x, z)) ? 0 : 1;
  return 0.08 * ruido(x * 0.9, z * 0.9) * longe * plano * perto;
}
const H = (x, z) => hBase(x, z) + ondula(x, z);

// ================================================================== túmulo (definido antes do chão, que tem furo sobre a câmara)
const TUM = { x: -14.6, z: -8.4, y: TOPO, rot: 0.55 };
const tumParaLocal = (x, z) => { const dx = x - TUM.x, dz = z - TUM.z, c = Math.cos(TUM.rot), s = Math.sin(TUM.rot); return [dx * c - dz * s, dx * s + dz * c]; };
const tumParaMundo = (lx, lz) => { const c = Math.cos(TUM.rot), s = Math.sin(TUM.rot); return [TUM.x + lx * c + lz * s, TUM.z - lx * s + lz * c]; };
const noFuroTumulo = (x, z) => { const [lx, lz] = tumParaLocal(x, z); return (lx > -1.7 && lx < 1.7 && lz < 0.05 && lz > -6.3) || (lx > -2.62 && lx < 0.95 && lz > 0.2 && lz < 0.62); };
const POCO = { x: 1.2, z: 2.0 };
const poco = conjunto(GLB.vila, 'Poco_1_', 'Poco_1');
let POCO_R;
{ const bb = new THREE.Box3().setFromObject(pecaUnica(poco, 'Poco_1')); POCO_R = Math.min(bb.max.x - bb.min.x, bb.max.z - bb.min.z) * 0.5 * 0.6; }
function pecaUnica(grp, nome) { return grp.getObjectByName(nome); }

// ================================================================== materiais (textura sem repetição aparente)
const GLSL_W = `varying vec3 vW;\n`;
function comMundo(sh) {
  sh.vertexShader = GLSL_W + sh.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\n vW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
}
function matChao() {
  const m = new THREE.MeshStandardMaterial({ roughness: 1, flatShading: true });
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { tCampo: { value: T.campo }, tTerra: { value: T.terra }, tArada: { value: T.arada }, tPedra: { value: T.pedra }, tCant: { value: T.cantaria } });
    comMundo(sh);
    sh.vertexShader = 'attribute vec4 aMask; varying vec4 vM;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vM = aMask;');
    sh.fragmentShader = 'uniform sampler2D tCampo, tTerra, tArada, tPedra, tCant; varying vec4 vM;\n' + GLSL_W + GLSL_NOISE +
      sh.fragmentShader.replace('#include <map_fragment>', `
      vec3 nW = normalize(cross(dFdx(vW), dFdy(vW)));
      float verde = vnoise(vW.xz * 0.13 + 3.0);
      vec3 campo = semRep(tCampo, vW.xz / 4.2) * mix(vec3(0.6, 0.97, 0.4), vec3(0.8, 1.0, 0.5), verde) * 1.06;
      vec3 terra = semRep(tTerra, vW.xz / 3.4) * vec3(1.02, 0.99, 0.93);
      vec3 arada = semRep(tArada, vW.xz / 2.6) * vec3(1.05, 0.98, 0.9);
      vec3 cant = semRep(tCant, vW.xz / 1.6);
      vec3 col = mix(campo, terra, clamp(vM.x, 0.0, 1.0));
      col = mix(col, arada, vM.z);
      col = mix(col, cant, vM.w);
      float ingreme = 1.0 - smoothstep(0.45, 0.62, abs(nW.y));
      vec3 muro = semRep(tPedra, planar(vW, nW) / 1.3) * vec3(1.0, 0.95, 0.86);
      col = mix(col, muro, ingreme);
      diffuseColor.rgb *= col * macro(vW);`);
  };
  return m;
}
// rocha: paredes com a rocha da encosta, topos com capim; embaixo some na bruma (nunca se vê o fundo da fase)
const uFundo = { value: FUNDO_SRGB };
function matRocha() {
  const m = new THREE.MeshStandardMaterial({ roughness: 1, flatShading: true });
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { tRocha: { value: T.rocha }, tCampo: { value: T.campo }, tTerra: { value: T.terra }, uFundo });
    comMundo(sh);
    sh.fragmentShader = 'uniform sampler2D tRocha, tCampo, tTerra; uniform vec3 uFundo;\n' + GLSL_W + GLSL_NOISE +
      sh.fragmentShader.replace('#include <map_fragment>', `
      vec3 nW = normalize(cross(dFdx(vW), dFdy(vW)));

  const ac = dlg.querySelector('.acoes'); ac.innerHTML = '';
  for (const [rot, fn, pri] of T2.a) { const b = document.createElement('button'); b.className = 'bt' + (pri ? ' pri' : ''); b.textContent = rot; b.onclick = (e) => { e.stopPropagation(); fn(); }; ac.appendChild(b); }

function fecharDlg(soltaCamera = true) {

}
$('#interagir').onclick = (e) => { e.stopPropagation(); if (poiPerto) abrir(poiPerto.id); };

// ================================================================== câmera isométrica presa
const camera = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, 1, 400);
const AZ = Math.PI * 0.25, EL = 0.66;
const DIR = new THREE.Vector3(Math.sin(AZ) * Math.cos(EL), Math.sin(EL), Math.cos(AZ) * Math.cos(EL));
const retrato = () => innerHeight > innerWidth * 1.05;
let zoomT = 0.45;
const camAlvo = new THREE.Vector3(P.x, 1, P.z); let camDist = 40;

function ajustaFov() { camera.fov = retrato() ? 30 : 24; camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
ajustaFov();
function alvoCamera() {
  if (poiAberto) {
    let f = poiAberto.foco, d = poiAberto.dist;
    if (poiAberto.id === 'tumulo' && dentroTumulo()) { const [x, z] = tumParaMundo(0, -3.0); f = [x, TUM.y + 0.6, z]; d = 12; }
    return [new THREE.Vector3(...f), d * (retrato() ? 1.45 : 1)];
  }
  if (dentroTumulo()) { const [x, z] = tumParaMundo(0, -3.0); return [new THREE.Vector3(x, TUM.y + 0.6, z), retrato() ? 15 : 10.5]; }
  // segue o jogador, mas o alvo fica preso numa caixa que encolhe quando se afasta: nunca sai da área montada
  const hx = lerp(13, 0.5, zoomT) * (retrato() ? 0.8 : 1), hz = lerp(9.5, 0.5, zoomT);
  const v = new THREE.Vector3(clamp(P.x, -hx, hx), P.y * 0.6 + 0.8, clamp(P.z, -hz - 1, hz));
  return [v, distZoom()];
}
{ const [v, d] = alvoCamera(); camAlvo.copy(v); camDist = d; }
const zoom = (dz) => { zoomT = clamp(zoomT + dz, 0, 1); };
$('#zMais').onclick = (e) => { e.stopPropagation(); zoom(-0.2); };
$('#zMenos').onclick = (e) => { e.stopPropagation(); zoom(0.2); };
renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); zoom(Math.sign(e.deltaY) * 0.1); }, { passive: false });

// ================================================================== entrada: tocar para andar, pinça para zoom, teclado
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const dedos = new Map(); let pinca = null, toque0 = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', (e) => {
  dedos.set(e.pointerId, [e.clientX, e.clientY]);
  if (dedos.size === 2) { const [a, b] = [...dedos.values()]; pinca = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: zoomT }; toque0 = null; }
  else toque0 = { x: e.clientX, y: e.clientY, t: performance.now() };
});
cv.addEventListener('pointermove', (e) => {
  if (!dedos.has(e.pointerId)) return; dedos.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinca && dedos.size === 2) { const [a, b] = [...dedos.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoomT = clamp(pinca.z - (d / pinca.d - 1) * 0.9, 0, 1); }
});
const solta = (e) => {
  dedos.delete(e.pointerId); if (dedos.size < 2) pinca = null;
  if (!toque0 || e.type !== 'pointerup') { toque0 = null; return; }
  const ok = Math.hypot(e.clientX - toque0.x, e.clientY - toque0.y) < 10 && performance.now() - toque0.t < 450; toque0 = null;
  if (ok) tocar(e.clientX, e.clientY);
};
cv.addEventListener('pointerup', solta); cv.addEventListener('pointercancel', solta);

function tocar(cx, cy) {
  $('#dica').style.opacity = 0;
  ptr.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  let poi = null;
  const hm = ray.intersectObjects(toques, false)[0]; if (hm) poi = hm.object.userData.poi;
  const hc = ray.intersectObject(chao, false)[0];
  if (!poi && hc) poi = POIS.find((p) => Math.hypot(hc.point.x - p.alvo[0], hc.point.z - p.alvo[1]) < p.alvo[2]) || null;
  if (!poi) { // casas, árvores e objetos: o primeiro que o raio pega, projetado no chão
    const hs = ray.intersectObjects(scene.children, true).find((h) => h.object !== chao && h.object.visible && !h.object.isInstancedMesh);
    if (hs) poi = POIS.find((p) => Math.hypot(hs.point.x - p.alvo[0], hs.point.z - p.alvo[1]) < p.alvo[2] + 1.2) || null;
  }
  if (poi) {
    if (poiAberto) fecharDlg(false);
    if (poi.id === 'tumulo' && dentroTumulo()) { abrir('tumulo'); return; }
    irPara(poi.pe, () => abrir(poi.id));
    return;
  }

  if (hc) irPara([hc.point.x, hc.point.z], null);
}
function irPara([x, z], aoChegar) {
  const r = caminho(P.x, P.z, x, z);
  P.aoChegar = aoChegar;
  if (!r) { P.rota = []; if (aoChegar && Math.hypot(P.x - x, P.z - z) < 1.5) aoChegar(); return; }
  P.rota = r;
  // marca no chão
  const fim = r[r.length - 1]; alvoMarca.position.set(fim[0], alturaEm(fim[0], fim[1]) + 0.04, fim[1]); alvoMarca.material.opacity = 0.9; alvoMarca.scale.setScalar(1);
}
const alvoMarca = new THREE.Mesh(new THREE.RingGeometry(0.22, 0.32, 20).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xfff1cf, transparent: true, opacity: 0, depthWrite: false }));
scene.add(alvoMarca);

const teclas = new Set();
addEventListener('keydown', (e) => {
  teclas.add(e.key.toLowerCase());
  if ((e.key === 'e' || e.key === 'E' || e.key === 'Enter' || e.key === ' ') && poiPerto && !dlg.classList.contains('on')) { abrir(poiPerto.id); e.preventDefault(); }
  if (e.key === 'Escape') fecharDlg();
  if (e.key === '+' || e.key === '=') zoom(-0.15);
  if (e.key === '-') zoom(0.15);
});
addEventListener('keyup', (e) => teclas.delete(e.key.toLowerCase()));
function alturaEm(x, z) {
  if (naZonaTumulo(x, z)) return alturaTumulo(x, z, Math.max(P.y, TUM.y - 0.5) + 0.9);
  return H(x, z);
}
function podePisar(x0, z0, x1, z1) {
  const [i0, k0] = celDe(x0, z0), [i1, k1] = celDe(x1, z1);
  const a = k0 * NNI + i0, b = k1 * NNI + i1;
  if (a === b) return !!anda[b] || !anda[a];
  return passa(a, b) || (!anda[a] && anda[b]);
}

// ================================================================== laço
const relogio = new THREE.Clock();
let tempo = 0;
const FRENTE = new THREE.Vector2(-Math.sin(AZ), -Math.cos(AZ)), DIREITA = new THREE.Vector2(Math.cos(AZ), -Math.sin(AZ));
function passo(dt) {
  tempo += dt;
  // ---- movimento por teclado
  let kx = 0, kz = 0;
  if (teclas.has('w') || teclas.has('arrowup')) { kx += FRENTE.x; kz += FRENTE.y; }
  if (teclas.has('s') || teclas.has('arrowdown')) { kx -= FRENTE.x; kz -= FRENTE.y; }
  if (teclas.has('d') || teclas.has('arrowright')) { kx += DIREITA.x; kz += DIREITA.y; }
  if (teclas.has('a') || teclas.has('arrowleft')) { kx -= DIREITA.x; kz -= DIREITA.y; }
  let vel = 0;
  if (kx || kz) {
    P.rota = []; P.aoChegar = null;
    if (poiAberto) fecharDlg();
    const l = Math.hypot(kx, kz); kx /= l; kz /= l; vel = VEL.Trote;
    const nx = P.x + kx * vel * dt, nz = P.z + kz * vel * dt;
    if (podePisar(P.x, P.z, nx, nz)) { P.x = nx; P.z = nz; }
    else if (podePisar(P.x, P.z, nx, P.z)) P.x = nx;
    else if (podePisar(P.x, P.z, P.x, nz)) P.z = nz;

    // ---- seguindo a rota do toque
    const [tx, tz] = P.rota[0]; const dx = tx - P.x, dz = tz - P.z, d = Math.hypot(dx, dz);
    let resto = d; for (let i = 1; i < P.rota.length; i++) resto += Math.hypot(P.rota[i][0] - P.rota[i - 1][0], P.rota[i][1] - P.rota[i - 1][1]);
    vel = resto > 2.2 ? VEL.Trote : VEL.Andar;
    const s = vel * dt;
    if (d <= s) { P.x = tx; P.z = tz; P.rota.shift(); if (!P.rota.length) { vel = 0; const f = P.aoChegar; P.aoChegar = null; if (f) f(); } }
    else { P.x += dx / d * s; P.z += dz / d * s; P.rotAlvo = Math.atan2(dx, dz); }
  }

  let dr = (P.rotAlvo ?? P.rot) - P.rot; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); P.rot += dr * Math.min(1, dt * 10);
  const yAlvo = alturaEm(P.x, P.z); P.y += (yAlvo - P.y) * Math.min(1, dt * 14);
  heroi.position.set(P.x, P.y, P.z); heroi.rotation.y = P.rot;
  mixer.update(dt);
  alvoMarca.material.opacity = Math.max(0, alvoMarca.material.opacity - dt * (P.rota.length ? 0.3 : 2)); alvoMarca.scale.setScalar(1 + (1 - alvoMarca.material.opacity) * 0.6);

  // ---- ponto de interesse perto

  for (const p of POIS) if (Math.hypot(P.x - p.pe[0], P.z - p.pe[1]) < 2.4) poiPerto = p;
  if (dentroTumulo()) poiPerto = POIS[0];
  const bi = $('#interagir');
  if (poiPerto && !dlg.classList.contains('on') && !P.rota.length) { bi.textContent = poiPerto.nome; bi.classList.add('on'); } else bi.classList.remove('on');
  for (const p of POIS) {
    p.m.position.y = p.y0 + Math.sin(tempo * 2 + p.marca[0]) * 0.12; p.m.rotation.y = tempo * 1.2;
    p.m.visible = !(poiAberto === p && dlg.classList.contains('on'));
  }

    if (aoParar) { const f = aoParar; aoParar = null; f(); }

  // ---- porta da casa de Lázaro

  // ---- forno: chama que tremula
  fogo += (1 - fogo) * Math.min(1, dt * 0.6);
  const ch = 0.85 + 0.15 * Math.sin(tempo * 17) * Math.sin(tempo * 7.3);
  if (FN.Forno_Chamas) FN.Forno_Chamas.scale.set(1, ch * fogo, 1);
  if (FN.Forno_ChamaBoca) FN.Forno_ChamaBoca.scale.set(1, (0.9 + 0.2 * Math.sin(tempo * 13)) * Math.min(1.4, fogo), 1);

  // ---- balde da cisterna: desce, enche, sobe
  if (baldeAnim) {
    baldeAnim.t += dt; const t = baldeAnim.t;
    const fundo = -2.7; let y;
    if (t < 2) y = lerp(BALDE_Y0, fundo, smooth(0, 2, t));
    else if (t < 2.7) { y = fundo; baldeAgua.visible = true; }
    else if (t < 4.9) y = lerp(fundo, BALDE_Y0, smooth(2.7, 4.9, t));
    else { y = BALDE_Y0; baldeAnim = null; }
    balde.position.y = y; baldeAgua.position.y = y;
    corda.scale.y = Math.max(0.05, (CORDA_Y - y) / Math.max(0.01, CORDA_Y - BALDE_Y0));
  }

  const [v, d] = alvoCamera();

  camera.position.copy(camAlvo).addScaledVector(DIR, camDist);
  camera.lookAt(camAlvo);
  sun.position.copy(camAlvo).addScaledVector(SOL_DIR, 45); sun.target.position.copy(camAlvo);
}

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); ajustaFov(); });
renderer.autoClear = false; renderer.shadowMap.autoUpdate = false;
