<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste das fases</title>
<style>
  :root { --fundo: #f6f1e4; --texto: #3b2b1a; --fraco: #8a7a63; --ok: #2f7a3a; --erro: #b3261e; --aviso: #a86a00; --linha: #e2d8c3; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--fundo); color: var(--texto); font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 14px; color: var(--fraco); font-size: 13px; }
  #placar { font-size: 17px; font-weight: 600; margin: 10px 0; }
  button { padding: 9px 16px; border: 0; border-radius: 10px; background: var(--texto); color: var(--fundo); font-size: 15px; }
  button:disabled { opacity: .45; }
  ol { list-style: none; padding: 0; margin: 12px 0; max-width: 760px; }
  li { padding: 7px 0; border-bottom: 1px solid var(--linha); display: grid; grid-template-columns: 26px 1fr; gap: 4px 6px; }
  li .s { font-weight: 700; }
  li.ok .s { color: var(--ok); } li.erro .s { color: var(--erro); } li.aviso .s { color: var(--aviso); } li.rodando .s { color: var(--fraco); }
  li .d { grid-column: 2; color: var(--fraco); font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  li.grupo { border: 0; padding-top: 14px; font-weight: 700; grid-template-columns: 1fr; }
  #quadro { width: min(100%, 480px); height: 270px; border: 1px solid var(--linha); border-radius: 8px; background: #000; display: block; }
</style>
</head>
<body>
<h1>Teste das fases</h1>
<p class="sub">Abre Betfagé e Betânia sozinho, anda com o jogador, troca de fase e confere se nada quebrou. Leva uns 2 a 4 minutos. Deixe esta aba visível enquanto roda.</p>
<button id="rodar">Rodar de novo</button>
<div id="placar">Preparando…</div>
<iframe id="quadro" title="fase em teste"></iframe>
<ol id="lista"></ol>
<script>
window.TESTADOR = true;             // as fases veem isto e ligam o modo de teste (limpo-motor/modo-teste.js)
const quadro = document.getElementById('quadro'), lista = document.getElementById('lista'), placar = document.getElementById('placar'), btRodar = document.getElementById('rodar');
const espera = (ms) => new Promise((r) => setTimeout(r, ms));
let ITENS = [];

function grupo(nome) { const li = document.createElement('li'); li.className = 'grupo'; li.textContent = nome; lista.appendChild(li); }
function item(nome) {
  const li = document.createElement('li'); li.className = 'rodando';
  li.innerHTML = '<span class="s">…</span><span></span><span class="d"></span>'; li.children[1].textContent = nome; lista.appendChild(li);
  const reg = { nome, estado: 'rodando', detalhe: '' }; ITENS.push(reg);
  const marca = (estado, detalhe = '') => { reg.estado = estado; reg.detalhe = detalhe; li.className = estado; li.children[0].textContent = { ok: '✓', erro: '✗', aviso: '!' }[estado]; li.children[2].textContent = detalhe; };
  return { ok: (d) => marca('ok', d), erro: (d) => marca('erro', d), aviso: (d) => marca('aviso', d) };
}
// roda um teste; se ele lançar erro, marca como falha e segue
async function teste(nome, fn) { const it = item(nome); try { await fn(it); } catch (e) { it.erro(String(e && e.message || e)); } }

const W = () => quadro.contentWindow, D = () => quadro.contentDocument;
async function ate(cond, ms, passo = 200) { const t0 = performance.now(); while (performance.now() - t0 < ms) { try { const v = cond(); if (v) return v; } catch (e) { /* página ainda trocando */ } await espera(passo); } return null; }
function abre(url) { quadro.src = 'about:blank'; return espera(100).then(() => { quadro.src = url; }); }
// espera a fase ficar pronta (TESTE aparece) e devolve quanto tempo levou
// (se a página já registrou erro e mesmo assim não ficou pronta em 15 s, desiste sem esperar os 2 minutos)
async function esperaFase(ms = 120000) {
  const t0 = performance.now(); let tErro = 0;
  const T = await ate(() => {
    if (W().TESTE) return W().TESTE;
    if ((W().ERROS || []).some((e) => !e.startsWith('console:')) || arquivosFalhos().length) { tErro = tErro || performance.now(); if (performance.now() - tErro > 15000) return 'erro'; }
    return null;
  }, ms);
  return T && T !== 'erro' ? (performance.now() - t0) / 1000 : null;
}
// arquivos que voltaram com erro (404 etc.), quando o navegador informa
function arquivosFalhos() {
  const r = W().performance.getEntriesByType('resource');
  return [...new Set(r.filter((e) => e.responseStatus >= 400).map((e) => e.responseStatus + ' ' + decodeURI(e.name.replace(location.origin, ''))))];
}
const listaErros = () => [...new Set([...arquivosFalhos(), ...(W().ERROS || [])])].slice(0, 10).join('\n');
const caminho = () => decodeURI(W().location.pathname.replace(/^.*assets-vila\//, '')) + W().location.search;
const quadros = (n, dt = 1 / 30) => { const T = W().TESTE; for (let i = 0; i < n; i++) T.laco(dt); };

// ---------- testes de uma fase aberta ----------
async function testesDaFase(nome, opc = {}) {
  let tempo = null;
  await teste('carrega', async (it) => {
    tempo = await esperaFase();
    if (tempo == null) throw new Error('a fase não ficou pronta (está em ' + caminho() + ')\n' + listaErros());
    it.ok(tempo.toFixed(1) + ' s até ficar jogável · ' + caminho());
  });
  if (tempo == null) return false;
  await espera(1500);           // deixa terminar o que carrega por último
  await teste('nenhum erro nem arquivo faltando', async (it) => {
    const erros = [...new Set(W().ERROS || [])], falhos = arquivosFalhos();
    if (erros.length || falhos.length) it.erro([...falhos, ...erros].slice(0, 12).join('\n'));
    else it.ok(W().performance.getEntriesByType('resource').length + ' arquivos carregados');
  });
  await teste('desenha a cena', async (it) => {
    const T = W().TESTE; quadros(2);
    const tri = T.renderer.info.render.triangles, n = T.scene.children.length;
    if (!tri || n < 20) it.erro('triângulos na tela: ' + tri + ' · objetos na cena: ' + n);
    else it.ok(tri.toLocaleString('pt-BR') + ' triângulos na tela · ' + n + ' objetos na cena');
  });
  await teste('personagens e animais se mexem', async (it) => {
    const T = W().TESTE, atores = [];
    for (const mx of T.MIX) {
      const raiz = mx.getRoot(), ossos = [];
      raiz.traverse((o) => { if (o.isBone && ossos.length < 40) ossos.push(o); });
      if (!raiz.visible || !ossos.length) continue;
      const rodando = mx._actions.filter((a) => a.isRunning() && a.getEffectiveWeight() > 0).map((a) => a.getClip().name);
      if (!rodando.length) continue;
      atores.push({ raiz, ossos, rodando, antes: ossos.map((b) => b.quaternion.clone()) });
    }
    quadros(20);
    const parados = atores.filter((a) => a.ossos.every((b, i) => b.quaternion.angleTo(a.antes[i]) < 1e-4));
    if (!atores.length) it.erro('nenhum personagem com animação tocando');
    else if (parados.length) it.erro(parados.length + ' de ' + atores.length + ' com animação tocando mas sem se mexer: ' + parados.map((a) => (a.raiz.name || '?') + ' (' + a.rodando.join(',') + ')').slice(0, 6).join('; '));
    else it.ok(atores.length + ' personagens e animais animados');
  });
  if (opc.eira) await teste('eira: os dois malham com o forcado', async (it) => {
    const T = W().TESTE, garfos = [];
    T.scene.traverse((o) => { if (o.name === 'garfo' && o.parent && o.parent.isBone) garfos.push(o); });
    if (garfos.length !== 2) throw new Error('esperava 2 forcados, achei ' + garfos.length);
    const pos = () => garfos.map((g) => { g.updateWorldMatrix(true, false); return g.matrixWorld.elements.slice(12, 15); });
    const a = pos(); quadros(15); const b = pos();
    const mov = a.map((p, i) => Math.hypot(p[0] - b[i][0], p[1] - b[i][1], p[2] - b[i][2]));
    const malhar = T.MIX.filter((mx) => mx._actions.some((x) => x.getClip().name === 'Malhar' && x.isRunning())).length;
    if (malhar !== 2) it.erro('clipe Malhar tocando em ' + malhar + ' de 2');
    else if (mov.some((m) => m < 0.05)) it.erro('forcado parado (andou ' + mov.map((m) => m.toFixed(2)).join(' e ') + ' m)');
    else it.ok('forcados andaram ' + mov.map((m) => m.toFixed(2)).join(' e ') + ' m em meio segundo');
  });
  await teste('jogador anda, fica no chão e não atravessa obstáculos', async (it) => {
    const T = W().TESTE, p = T.jog.o.position;
    await ate(() => !T.E.fora, 15000);          // espera a abertura liberar o jogador
    if (T.E.fora) throw new Error('o jogador continua travado (E.fora) depois da abertura');
    if (T.bate(p.x, p.z, 0)) it.aviso('começa encostado num obstáculo');
    const inicio = p.clone(), andou = {}, dentro = [], fora = [], saidas = [];
    for (const k of ['KeyW', 'KeyD', 'KeyS', 'KeyA']) {
      const de = p.clone(); T.tecla[k] = true;
      for (let i = 0; i < 45; i++) {
        T.laco(1 / 30);
        if (T.bate(p.x, p.z, 0.05)) dentro.push(k + ' ' + p.x.toFixed(1) + ',' + p.z.toFixed(1));
      }
      T.tecla[k] = false; quadros(10);
      if (T.E.fora) {          // chegou numa saída e a fase perguntou se quer ir embora: responde "Ainda não" e segue
        if (await responde('Deseja', 'Ainda não', 1500)) saidas.push(k); else throw new Error('o jogador travou andando (' + k + ') sem pergunta aberta');
        quadros(5);
      }
      andou[k] = Math.hypot(p.x - de.x, p.z - de.z);
      const chao = T.alturaEm(p.x, p.z, p.y);
      if (Math.abs(p.y - chao) > 0.3) fora.push(k + ': ' + (p.y - chao).toFixed(2) + ' m do chão');
    }
    const total = Object.values(andou).reduce((s, v) => s + v, 0);
    const txt = Object.entries(andou).map(([k, v]) => k.slice(3) + ' ' + v.toFixed(1) + ' m').join(' · ');
    if (total < 1) it.erro('quase não andou: ' + txt);
    else if (dentro.length) it.erro('entrou em obstáculo: ' + dentro.slice(0, 4).join('; '));
    else if (fora.length) it.erro('fora do chão: ' + fora.join('; '));
    else it.ok(txt + ' (WASD, 1,5 s cada)' + (saidas.length ? ' · chegou na saída e respondeu "Ainda não" (' + saidas.join(', ') + ')' : ''));
    T.jog.o.position.copy(inicio); T.E.fora = false;
  });
  await teste('velocidade (só informação)', async (it) => {
    let n = 0, vivo = true; const w = W(); const f = () => { n++; if (vivo) w.requestAnimationFrame(f); }; w.requestAnimationFrame(f);
    await espera(2000); vivo = false;
    const fps = n / 2; (fps >= 20 ? it.ok : it.aviso)(fps.toFixed(0) + ' quadros por segundo neste aparelho' + (fps < 20 ? ' (lento; se esta aba ficou escondida, o navegador desacelera de propósito)' : ''));
  });
  return true;
}

// visível na tela (vale também para caixas com position: fixed)
const visivel = (el) => el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
// aperta um botão como o jogador (algumas caixas respondem ao pointerdown, outras ao click)
function aperta(b) { b.dispatchEvent(new (W().PointerEvent)('pointerdown', { bubbles: true, cancelable: true })); if (b.isConnected && visivel(b)) b.click(); }
// procura o botão de uma pergunta aberta (pelo texto da pergunta) e aperta
async function responde(texto, botao, ms = 5000) {
  const btn = await ate(() => {
    for (const c of D().querySelectorAll('div')) {
      if (!c.textContent.includes(texto) || !visivel(c)) continue;
      const b = [...c.querySelectorAll('button')].find((x) => x.textContent.trim() === botao && visivel(x)); if (b) return b;
    }
    return null;
  }, ms);
  if (!btn) return false; aperta(btn); return true;
}
const confirma = (texto) => responde(texto, 'Sim');
// interações (limpo-motor/interacoes.js): chega perto de cada item pelo nome, aperta E e vai até o fim da conversa
async function testaInteracoes(it, nomes) {
  const T = W().TESTE, p = T.jog.o.position, r = [];
  r.push(T.INT.L.length + ' interações');
  for (const nome of nomes) {
    const item = T.INT.L.find((n) => n.nome === nome); if (!item) { r.push(nome + ': NÃO existe'); continue; }
    T.E.fora = false; const q = item.o.position, d = Math.min(1.1, item.r - 0.4);
    const lado = [[d, 0], [-d, 0], [0, d], [0, -d], [d * 0.7, d * 0.7], [-d * 0.7, -d * 0.7]].find(([dx, dz]) => !T.bate(q.x + dx, q.z + dz, 0.05)) || [d, 0];
    p.set(q.x + lado[0], T.alturaEm(q.x + lado[0], q.z + lado[1], 50), q.z + lado[1]); quadros(3);
    W().dispatchEvent(new (W().KeyboardEvent)('keydown', { code: 'KeyE' })); W().dispatchEvent(new (W().KeyboardEvent)('keyup', { code: 'KeyE' })); quadros(2);
    let n = 0; while (n < 12 && (await responde('', 'Continuar', 700))) n++;
    const fechou = await responde('', 'Fechar', 1200); quadros(2);
    r.push(nome + ': ' + (fechou ? (n + 1) + ' falas' : 'NÃO abriu'));
  }
  (r.slice(1).every((x) => x.endsWith('falas')) ? it.ok : it.erro)(r.join('; '));
}

async function rodar() {
  btRodar.disabled = true; lista.innerHTML = ''; ITENS = []; window.RESULTADO = null;
  const t0 = performance.now(); placar.textContent = 'Rodando…';

  grupo('Betfagé (fase-betfage/)');
  await abre('fase-betfage/');
  const okBf = await testesDaFase('Betfagé', { eira: true });
  if (okBf) await teste('interações em Betfagé: o dono da jumenta, a figueira seca, o ceifeiro (as primícias)', (it) => testaInteracoes(it, ['O dono da jumenta', 'a figueira seca', 'O ceifeiro']));

  grupo('Troca: Betfagé → Betânia');
  let chegouBt = false;
  if (okBf) await teste('o pé da estrada pergunta "voltar para Betânia" e o Sim leva até lá', async (it) => {
    const T = W().TESTE;
    for (let i = 0; i < T.AMOS.length && !T.E.fora; i += 2) { const q = T.AMOS[i]; T.jog.o.position.set(q.x, T.alturaEm(q.x, q.z, 50), q.z); quadros(2); }
    if (!T.E.fora) throw new Error('andando pela estrada desde o pé, a pergunta não apareceu');
    if (!await confirma('voltar para Betânia')) throw new Error('a pergunta apareceu sem o botão Sim visível');
    const foi = await ate(() => /fase-betania\/(index\.html)?$/.test(W().location.pathname) && W().location.search.includes('de=betfage'), 8000);
    if (!foi) throw new Error('não mudou de página (está em ' + caminho() + ')');
    chegouBt = true; it.ok('foi para ' + caminho());
  });
  else item('troca de fase').aviso('pulado: Betfagé não carregou');

  grupo('Betânia, chegando de Betfagé');
  if (!chegouBt) await abre('fase-betania/?de=betfage');
  const okBt = await testesDaFase('Betânia');
  if (okBt) await teste('chega no fim da estrada, vindo de Betfagé', async (it) => {
    const p = W().TESTE.jog.o.position;
    (p.x < -25 ? it.ok : it.erro)('jogador em x ' + p.x.toFixed(1) + ', z ' + p.z.toFixed(1));
  });

  grupo('Troca: Betânia → Betfagé');
  if (okBt) await teste('o fim da estrada pergunta "ir para Betfagé" e o Sim leva até lá', async (it) => {
    const T = W().TESTE; T.E.fora = false; T.jog.o.position.x = -36; quadros(3);
    if (!await confirma('Betfagé')) throw new Error('a pergunta não apareceu no fim da estrada');
    const foi = await ate(() => /fase-betfage\/(index\.html)?$/.test(W().location.pathname) && W().location.search.includes('de=betania'), 8000);
    if (!foi) throw new Error('não mudou de página (está em ' + caminho() + ')');
    it.ok('foi para ' + caminho());
    const tempo = await esperaFase();
    if (tempo == null) throw new Error('Betfagé não ficou pronta depois da troca\n' + listaErros());
    await espera(1000);
    const erros = [...(W().ERROS || []), ...arquivosFalhos()];
    if (erros.length) it.erro('foi, mas com erro ao chegar:\n' + erros.slice(0, 8).join('\n'));
    else it.ok('foi para ' + caminho() + ' e carregou em ' + tempo.toFixed(1) + ' s');
  });
  else item('troca de fase').aviso('pulado: Betânia não carregou');

  grupo('Troca: Betfagé → Monte das Oliveiras');
  let chegouOl = false, chegouGs = false;
  await teste('o alto da estrada pergunta "ir ao Monte das Oliveiras" e o Sim leva até lá', async (it) => {
    if (!W().TESTE) { await abre('fase-betfage/'); if (await esperaFase() == null) throw new Error('Betfagé não carregou\n' + listaErros()); }
    const T = W().TESTE; T.E.fora = false;
    for (let i = T.AMOS.length - 1; i >= 0 && !T.E.fora; i -= 2) { const q = T.AMOS[i]; T.jog.o.position.set(q.x, T.alturaEm(q.x, q.z, 80), q.z); quadros(2); }
    if (!await confirma('Monte das Oliveiras')) throw new Error('a pergunta não apareceu no alto da estrada');
    const foi = await ate(() => /fase-oliveiras\/(index\.html)?$/.test(W().location.pathname) && W().location.search.includes('de=betfage'), 8000);
    if (!foi) throw new Error('não mudou de página (está em ' + caminho() + ')');
    chegouOl = true; it.ok('foi para ' + caminho());
  });

  grupo('Monte das Oliveiras');
  if (!chegouOl) await abre('fase-oliveiras/?de=betfage');
  const okOl = await testesDaFase('Monte das Oliveiras');
  if (okOl) {
    await teste('interações no Monte das Oliveiras: o homem da prensa e Jerusalém vista do alto (Lc 19.41)', (it) => testaInteracoes(it, ['O homem da prensa', 'Jerusalém']));
    await teste('câmera: de quina (como em Betfagé) na subida; no cume vem para trás do jogador, de frente para a cidade; o jogador sempre na tela', async (it) => {
      const T = W().TESTE, p = T.jog.o.position, i0 = 8, alvo = T.iCume;
      const naTela = () => { const V = p.constructor, c = T.camera; return [new V(p.x, p.y + 0.05, p.z), new V(p.x, p.y + 1.75, p.z)].every((v) => { v.project(c); return Math.abs(v.x) < 0.85 && Math.abs(v.y) < 0.9 && v.z < 1; }); };
      const d = (i) => { const q = T.AMOS[i]; p.set(q.x, T.chaoTerra(q.x, q.z), q.z); quadros(60); return [T.camera.position.distanceTo(p), naTela()]; };
      const [longe, v1] = d(i0); quadros(60); const [perto, v2] = d(alvo); quadros(90);
      const olhar = new (p.constructor)(); T.camera.getWorldDirection(olhar); const oeste = olhar.x < -0.8;
      // andando de lado e para trás, ele continua na tela
      for (const k of ['KeyD', 'KeyS', 'KeyA']) { T.tecla[k] = true; quadros(30); T.tecla[k] = false; }
      const v3 = naTela();
      (longe > 20 && perto < 17 && oeste && v1 && v2 && v3 ? it.ok : it.erro)('distância da câmera: ' + longe.toFixed(1) + ' m no pé, ' + perto.toFixed(1) + ' m no cume; no cume olha para oeste (a cidade): ' + (oeste ? 'sim' : 'NÃO') + '; jogador na tela: ' + [v1, v2, v3].map((v) => (v ? 'sim' : 'NÃO')).join(', '));
    });
    await teste('cume: a cidade (a maquete) está sempre no lugar, aparece do cume, e o jogador passa sem parar', async (it) => {
      const T = W().TESTE, p = T.jog.o.position, V = p.constructor;
      // Jerusalém é a maquete 3D (../jerusalem); o alvo é um ponto no alto da fachada do santuário
      if (!T.PAN.mesh || !T.PAN.mesh.getObjectByName('Santuario')) { it.erro('a maquete de Jerusalém não está na cena'); return; }
      const alvo = T.PAN.alvo.clone();
      // a câmera vê o templo? (o chão do monte no meio do caminho tapa)
      const THREE = await W().eval("import('three')"), chao = T.scene.getObjectByName('Oliveiras_Terreno'), raio = new THREE.Raycaster();
      const ve = () => { const c = T.camera.position.clone(), d = alvo.clone().sub(c), L = d.length(); raio.set(c, d.normalize()); raio.far = L; return raio.intersectObject(chao, true).length === 0; };
      const em = (i) => { const q = T.AMOS[i]; p.set(q.x, T.chaoTerra(q.x, q.z), q.z); quadros(60); return ve(); };
      const vPe = em(8), vMeio = em(Math.round(8 + (T.iCume - 8) * 0.5)), vCume = em(T.iCume - 2);
      const sempre = T.PAN.mesh.visible && T.PAN.mesh.parent === T.scene;
      const livre = T.E.modo === 'descida' && !T.E.fora;
      (sempre && vCume && livre ? it.ok : it.erro)('cidade sempre no lugar: ' + (sempre ? 'sim' : 'NÃO') + '; templo visível no pé: ' + (vPe ? 'sim (a câmera de quina vê por cima do monte)' : 'não') + ', no meio: ' + (vMeio ? 'sim' : 'não') + ', no cume: ' + (vCume ? 'sim' : 'NÃO') + '; no cume o jogador está ' + (livre ? 'livre' : 'TRAVADO (modo ' + T.E.modo + ')'));
    });
    await teste('prensa de azeite: o prenseiro trabalha', async (it) => {
      const T = W().TESTE, prensa = T.scene.children.find((o) => o.isGroup && o.children.some((c) => c.name === 'Prensa_Mo'));
      if (!prensa) throw new Error('a prensa não está na cena');

      (r.every((s) => s.endsWith('sim')) ? it.ok : it.erro)(r.join('; '));
    });
    await teste('as saídas perguntam: o viaduto (o templo) e a Porta de Genat; o Sim da porta leva ao Gólgota', async (it) => {
      const T = W().TESTE, L = T.LAY, r = [];
      T.E.fora = false; T.E.perguntou = false; T.jog.o.position.set(L.ponte[0], T.chaoTerra(L.ponte[0], L.ponte[2] - 1), L.ponte[2] - 1); quadros(3);
      r.push('viaduto: ' + ((await responde('templo', 'Ainda não', 3000)) ? 'sim' : 'NÃO')); quadros(5);
      T.E.fora = false; T.E.perguntou = false; T.jog.o.position.set(L.genat[0], T.chaoTerra(L.genat[0], L.genat[2] - 1.4), L.genat[2] - 1.4); quadros(3);
      if (!await confirma('Genat')) r.push('Genat: NÃO');
      else { const foi = await ate(() => /fase-golgota\/(index\.html)?$/.test(W().location.pathname), 8000); r.push('Genat: ' + (foi ? 'sim, foi para ' + caminho() : 'NÃO mudou de página')); }
      (r.every((s) => s.includes('sim')) ? it.ok : it.erro)(r.join('; '));
    });
  } else item('Cidade alta').aviso('pulado: a fase não carregou');

  grupo('Gólgota e o sepulcro (fase-golgota/)');
  await abre('fase-golgota/');
  const okGo = await testesDaFase('Gólgota');
  if (okGo) {
    await teste('o Gólgota (com as três cruzes) fica à beira da estrada, fora do muro; o sepulcro, no horto, a ~30 m; o jogador se abaixa e olha dentro', async (it) => {
      const T = W().TESTE, L = T.LAY, p = T.jog.o.position;
      for (const n of ['Golgota_Rocha', 'Golgota_Cavidades', 'Cruzes', 'Pedreira']) if (!T.scene.getObjectByName(n)) throw new Error('falta ' + n + ' na cena');
      if (!T.scene.getObjectByName('Muralhas') || !T.scene.getObjectByName('Templo_Muros')) throw new Error('falta a maquete de Jerusalém');
      const dSep = Math.hypot(L.sepulcro[0] - L.golgota[0], L.sepulcro[2] - L.golgota[2]);
      const [, dEstr] = (() => { let m = 1e9; for (const a of T.AMOS) m = Math.min(m, Math.hypot(a.x - L.golgota[0], a.z - L.golgota[2])); return [0, m]; })();
      T.E.fora = false; T.jog.o.position.set(L.olhar[0] + 0.4, T.chaoTerra(L.olhar[0] + 0.4, L.olhar[2]), L.olhar[2]); quadros(3);
      const txt = D().getElementById('acao').textContent;
      W().dispatchEvent(new (W().KeyboardEvent)('keydown', { code: 'KeyE' })); W().dispatchEvent(new (W().KeyboardEvent)('keyup', { code: 'KeyE' }));
      quadros(30 * 10); const fala = D().getElementById('fala').textContent, abaixado = T.E.fora;
      quadros(30 * 17);
      (dSep > 25 && dSep < 45 && dEstr < 16 && /olhar dentro/.test(txt) && abaixado && /lençóis|lenço/.test(fala) && T.E.olhou && !T.E.fora ? it.ok : it.erro)('sepulcro a ' + dSep.toFixed(1) + ' m do Gólgota; o Gólgota a ' + dEstr.toFixed(1) + ' m da estrada; botão "' + txt + '"; abaixado: ' + (abaixado ? 'sim' : 'NÃO') + '; legenda: "' + fala.slice(0, 50) + '…"; depois livre: ' + (T.E.olhou && !T.E.fora ? 'sim' : 'NÃO'));
    });
    await teste('Jo 20.4-13: Pedro e João chegam correndo, entram e voltam; Maria Madalena fica chorando e conversa', async (it) => {
      const T = W().TESTE, C = T.CENA, fases = new Set(), p = T.jog.o.position;
      C.fase = 'espera'; C.t = 0;          // do começo
      for (let k = 0; k < 30 * 150; k++) { T.laco(1 / 30); fases.add(C.fase); if (C.fase === 'espera' && fases.has('voltam')) break; }
      const cena = ['correm', 'dentro1', 'dentro2', 'voltam'].every((f) => fases.has(f)) && C.fase === 'espera';
      const m = T.CONVERSAS.find((n) => n.nome === 'Maria Madalena'); let conv = false;
      if (m) {
        T.E.fora = false; const q = m.o.position; p.set(q.x + 1.2, T.chaoTerra(q.x + 1.2, q.z), q.z); quadros(3); T.acionar(); quadros(2);
        conv = await responde('Maria Madalena', 'Continuar', 2000);
        for (let k = 0; k < 4; k++) { if (!(await responde('', 'Continuar', 500))) break; }
        await responde('', 'Fechar', 1500); quadros(2);
      }
      (cena && conv && !T.E.fora ? it.ok : it.erro)('a cena passou por: ' + [...fases].join(' → ') + '; conversa com Maria Madalena: ' + (conv ? 'sim' : 'NÃO'));
    });
    await teste('coisas para olhar no Gólgota: as cruzes (as sete palavras), o letreiro, a pedra rolada, os túmulos antigos', (it) => testaInteracoes(it, ['as cruzes', 'o letreiro', 'a pedra rolada', 'os túmulos antigos']));
    await teste('as pontas da estrada perguntam: "voltar para a cidade" (sudeste) e "seguir pela estrada de Emaús" (noroeste)', async (it) => {
      const T = W().TESTE, N = T.AMOS.length, r = [];
      for (const [i, txt] of [[1, 'cidade'], [N - 2, 'Emaús']]) {
        T.E.fora = false; T.E.perguntou = false; const q = T.AMOS[i]; T.jog.o.position.set(q.x, T.chaoTerra(q.x, q.z), q.z); quadros(3);
        r.push(txt + ': ' + ((await responde(txt, 'Ainda não', 3000)) ? 'sim' : 'NÃO')); quadros(5);
      }
      const ok = r.every((s) => s.endsWith('sim')) && !T.E.fora;
      (ok ? it.ok : it.erro)(r.join('; ') + '; o "Ainda não" recua: ' + (!T.E.fora ? 'sim' : 'NÃO'));
    });
  } else item('Gólgota').aviso('pulado: a fase não carregou');

  grupo('Betânia do começo (com a abertura)');
  await abre('fase-betania/');
  await teste('carrega sem erro', async (it) => {
    const tempo = await esperaFase(); if (tempo == null) throw new Error('não ficou pronta\n' + listaErros());
    await espera(1500); quadros(30);
    const erros = [...new Set(W().ERROS || []), ...arquivosFalhos()];
    if (erros.length) it.erro(erros.slice(0, 10).join('\n')); else it.ok(tempo.toFixed(1) + ' s');
  });
  await teste('a abertura: a conversa com Cléopas (o encontro na estrada de Emaús)', async (it) => {
    const T = W().TESTE; let n = 0, viu = '';
    for (let k = 0; k < 40 && !viu; k++) { quadros(30); const d = [...D().querySelectorAll('div')].find((x) => x.style.zIndex === '8' && visivel(x)); if (d) viu = d.textContent; await espera(50); }
    while (n < 8 && (await responde('Cléopas', 'Continuar', 800))) n++;
    const fechou = await responde('Cléopas', 'Fechar', 1500); quadros(30);
    (fechou && /Cléopas/.test(viu) ? it.ok : it.erro)('a conversa abriu: ' + (viu ? 'sim' : 'NÃO') + '; ' + (n + 1) + ' falas; terminou: ' + (fechou ? 'sim' : 'NÃO'));
  });
  await teste('interações em Betânia: Marta, Lázaro (Jo 11), a padeira, o poço', (it) => testaInteracoes(it, ['Marta', 'Lázaro', 'A padeira', 'o poço']));

  grupo('Backups e endereços antigos');
  for (const url of ['fase-betfage/antigo.html', 'fase-betania/antigo.html']) {
    await teste(url + ' abre', async (it) => {
      await abre(url); await espera(1500);
      const tela = await ate(() => D().querySelector('canvas') && W().performance.getEntriesByType('resource').some((e) => /\.glb/.test(e.name)) && D().readyState === 'complete', 60000);
      await espera(6000);
      const falhos = arquivosFalhos();
      if (!tela) it.erro('não desenhou a tela em 1 minuto'); else if (falhos.length) it.erro(falhos.slice(0, 8).join('\n')); else it.ok('abre, sem arquivo faltando');
    });
  }
  for (const [url, destino] of [['limpo-betfage/', 'fase-betfage/'], ['limpo-betania/', 'fase-betania/'], ['fase-betfage/prado.html', 'fase-betfage/']]) {
    await teste(url + ' leva para ' + destino, async (it) => {
      await abre(url);
      const ok = await ate(() => W().location.pathname.endsWith('/' + destino), 8000);
      (ok ? it.ok : it.erro)('está em ' + caminho());
    });
  }
  quadro.src = 'about:blank';

  const falhas = ITENS.filter((i) => i.estado === 'erro').length, avisos = ITENS.filter((i) => i.estado === 'aviso').length;
  const seg = ((performance.now() - t0) / 1000).toFixed(0);
  placar.textContent = (falhas ? '✗ ' + falhas + ' falha' + (falhas > 1 ? 's' : '') : '✓ Tudo certo') + (avisos ? ' · ' + avisos + ' aviso' + (avisos > 1 ? 's' : '') : '') + ' · ' + ITENS.length + ' testes em ' + seg + ' s';
  placar.style.color = falhas ? 'var(--erro)' : 'var(--ok)';
  window.RESULTADO = { falhas, avisos, segundos: +seg, itens: ITENS };
  btRodar.disabled = false;
}
btRodar.onclick = rodar;
rodar();
</script>
